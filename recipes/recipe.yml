---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published to ghcr.io/wolklaw/sparkos
name: sparkos
description: SparkOS, a desktop for gaming and everyday work, built on Bazzite.

# Base: Bazzite (KDE Plasma, AMD/Intel GPUs, current Mesa drivers, gaming kernel).
#
# App policy (owner's decision, 2026-11-20): SparkOS ships only the owner's own apps (Soot,
# FreeSuite and the Spark apps: Snip, Media, Welcome, Games, Monitor, Edit, Calc, Archive, Scan,
# Run, Link, Store and Update). Every other company's or project's app is removed, Bazzite's
# included; people install what they want from the Store (Spark Store, or Bazaar next to it). What stays is the platform
# SparkOS needs to work: Plasma, Dolphin, Konsole, System
# Settings, Ark (zip support), KDE Connect, the Store, drivers, printing and scanning.
# Where a Spark app does the job, KDE's own is removed too: Spark Monitor replaces Plasma System
# Monitor (and takes its shortcuts), Spark Snip replaces Spectacle (it captures through KWin
# itself). Ark and KDE Connect stay until Spark Archive and Spark Link
# are tried on real hardware. Tailscale, a company's VPN service, is removed too.
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root

  - type: dnf
    install:
      packages:
        # Printing (CUPS, driverless, plasma-print-manager) and scanning (SANE pixma, airscan) are
        # already in Bazzite; a scanning app comes from the Store.
        - bubblewrap # Claude Code's command sandbox (already in Bazzite for Flatpak; listed so it stays)
        - socat # Claude Code's command sandbox
        - kdialog # folder picker for sparkos-claude and the install dialogs
        - fuse # AppImages mount themselves with FUSE (fusermount); already in Bazzite, listed so it stays
        - fuse-libs # FUSE 2, which most AppImages' runtime needs
        - rsms-inter-fonts # Inter, the SparkOS interface font (Chakra Petch is in files/sparkos-theme/fonts)
        # So Androidbox installs for your user (bash packaging/linux/install.sh --user) with no root:
        # a Python that Qt for Python supports (Fedora 45's own is 3.15), and the libraries Qt, SDL
        # and Google's emulator load. Androidbox itself is not in the image.
        - python3.13
        - SDL2
        - xcb-util-cursor
        - libxkbcommon-x11
        - libxkbfile
        - mesa-libGL
        - mesa-libEGL
        - mesa-libgbm
        - alsa-lib
        - pulseaudio-libs
        - nss
        - libXcomposite
        - libXcursor
        - libXdamage
        - libXi
        - libXrandr
        - libXtst
    remove:
      packages:
        # Other companies' and projects' apps that Bazzite ships. All installable from the Store.
        - steam
        - lutris
        - waydroid
        - input-remapper
        - kate
        - kwrite
        - filelight
        - kfind
        - krdc
        - krfb
        - kwalletmanager5
        - kdebugsettings
        - khelpcenter
        # KDE's own apps that a Spark app replaces (nothing else in the image requires them)
        - plasma-systemmonitor # Spark Monitor
        - spectacle # Spark Snip (captures through KWin; nothing else in the image requires Spectacle)
        # Third-party services Bazzite preinstalls (installable by anyone who wants them; see docs/switching.md)
        - tailscale

  - type: script
    scripts:
      - sparkos-identity.sh # shows "SparkOS" as the system name
      - sparkos-apps.sh # no preinstalled third-party apps: empties Bazzite's first-boot app list, drops the Portal
      - soot.sh # Soot browser, latest release
      - freesuite.sh # FreeSuite office apps, latest release
      - spark-snip.sh # Spark Snip: screenshots, text (OCR) and screen recording
      - spark-media.sh # Spark Media: photos, videos and music
      - spark-welcome.sh # Spark Welcome: first-login setup (launchers and apps on click, files from Windows, PC check)
      - spark-games.sh # Spark Games: one library for every installed game
      - spark-monitor.sh # Spark Monitor: task manager (Ctrl+Shift+Esc)
      - spark-edit.sh # Spark Edit: text and code editor
      - spark-calc.sh # Spark Calc: calculator (standard, scientific, programmer)
      - spark-archive.sh # Spark Archive: zip, tar, 7z, rar, iso; Extract/Compress in Dolphin
      - spark-scan.sh # Spark Scan: scanning with preview, crop, multi-page PDF and OCR
      - spark-run.sh # Spark Run: Windows programs on Wine (Wine is downloaded on first use)
      - spark-link.sh # Spark Link: phone link (PC side; phone side in Soot)
      - spark-store.sh # Spark Store, next to Bazaar
      - spark-update.sh # Spark Update: updater window and notification; Bazzite's uupd still downloads (after the app scripts: it lists their versions)
      - sparkos-cleanup.sh # fewer outside products: Spark Monitor takes Plasma System Monitor's keys; no Tailscale repo; no usage counting
      - sparkos-defaults.sh # Soot, FreeSuite and Spark Media as default apps; downloaded installers open the SparkOS way
      - sparkos-theme.sh # the SparkOS look: boot splash, sign-in, desktop, dock, wallpaper, fonts (rebuilds the initramfs)

  - type: default-flatpaks
    configurations:
      - scope: system # adds the Flathub remote so the Store works; installs nothing
      - scope: user # adds the Flathub user remote; installs nothing

  - type: signing # installs the signing policy so signed updates verify

  - type: script
    scripts:
      - sparkos-signing-fix.sh # lowercase the policy entry so it matches the image name (must run after signing)
