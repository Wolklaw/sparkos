---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published to ghcr.io/wolklaw/sparkos
name: sparkos
description: SparkOS, a desktop for gaming and everyday work, built on Bazzite.

# Bazzite (KDE Plasma, AMD/Intel GPUs). It already ships Steam, Lutris,
# gamescope, MangoHud, Firefox and current Mesa drivers.
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root

  - type: dnf
    install:
      packages:
        # Printing (CUPS, driverless, plasma-print-manager) is already in Bazzite.
        - skanpage # scanning app (SANE pixma and airscan backends are already in Bazzite)
        - bubblewrap # Claude Code's command sandbox (already in Bazzite for Flatpak; listed so it stays)
        - socat # Claude Code's command sandbox
        - kdialog # folder picker for sparkos-claude

  - type: script
    scripts:
      - sparkos-identity.sh # shows "SparkOS" as the system name
      - soot.sh # Soot browser, pinned release
      - freesuite.sh # FreeSuite office apps, pinned release
      - spark-snip.sh # Spark Snip: screenshots, text (OCR) and screen recording
      - sparkos-defaults.sh # Soot and FreeSuite as default apps

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # Games
          - com.heroicgameslauncher.hgl # Epic, GOG and Amazon games
          - org.prismlauncher.PrismLauncher # Minecraft, including CurseForge modpacks
          - net.runelite.RuneLite # Old School RuneScape
          - com.adamcake.Bolt # Jagex accounts launcher (replaces the Jagex Launcher)
          # Everyday
          - com.google.Chrome # also for VIA keyboard setup (WebHID) and Google sites
          - com.discordapp.Discord
          - com.spotify.Client
          - org.onlyoffice.desktopeditors # for .doc/.xls/.ppt and OpenDocument, which FreeSuite doesn't open yet
          # Create
          - com.obsproject.Studio
          - org.blender.Blender
          - org.gimp.GIMP
          - org.audacityteam.Audacity
          - org.kde.kdenlive # video editing (replaces Clipchamp)
          - org.flameshot.Flameshot # screenshots with upload and annotation (replaces ShareX)
          # Code
          - com.visualstudio.code
          - com.unity.UnityHub
          # Hardware
          - org.freedesktop.Piper # Logitech G502 DPI and buttons (replaces G HUB)
          - org.openrgb.OpenRGB # motherboard, RAM and SSD lighting (replaces SignalRGB, Aura, Patriot and Corsair tools)
          - io.missioncenter.MissionCenter # CPU, GPU, memory and temperatures (replaces Task Manager and HWiNFO)
          - org.rncbc.qpwgraph # route audio between apps (replaces VB-CABLE)
          - com.usebottles.bottles # run small Windows-only programs
      - scope: user # adds the Flathub user remote, no user apps

  - type: signing # installs the signing policy so signed updates verify
