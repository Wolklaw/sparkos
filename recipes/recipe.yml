---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published to ghcr.io/wolklaw/wolkos
name: wolkos
description: WolkOS, a desktop for gaming and everyday work, built on Bazzite.

# Bazzite (KDE Plasma, AMD/Intel GPUs). It already ships Steam, Lutris,
# gamescope, MangoHud, Firefox and current Mesa drivers.
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root

  - type: script
    scripts:
      - wolkos-identity.sh # shows "WolkOS" as the system name

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.heroicgameslauncher.hgl # Epic, GOG and Amazon games
          - org.onlyoffice.desktopeditors # documents, spreadsheets, slides
      - scope: user # adds the Flathub user remote, no user apps

  - type: signing # installs the signing policy so signed updates verify
