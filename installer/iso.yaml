label: "SparkOS-Live"
grub2:
  timeout: 5
  entries:
    - name: "Install SparkOS"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=SparkOS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Install SparkOS (basic graphics mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=SparkOS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
