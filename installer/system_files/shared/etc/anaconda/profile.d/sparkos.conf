# Anaconda configuration for the SparkOS installer (from Bazzite's, Apache-2.0).
# SparkOS's os-release has ID=fedora and VARIANT_ID=kinoite, the same as Fedora Kinoite, so
# titanoboa_hook_postrootfs.sh removes Anaconda's own Kinoite profile and this one is picked.

[Profile]
# Define the profile.
profile_id = sparkos

[Profile Detection]
# Match os-release values
os_id = fedora
variant_id = kinoite

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
