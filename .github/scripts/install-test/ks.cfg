# Test-only kickstart for installer-install-test.yml. Never on the ISO.
#
# It starts from the ISO's own /usr/share/anaconda/interactive-defaults.ks, the file the
# WebUI installer uses: the same %pre checks, %pre-install repartitioning step,
# ostreecontainer payload and %post scripts (bootc switch, Secure Boot key enrollment...).
# Then it answers what a person answers in the WebUI: language, keyboard, time zone, a
# user, and "Use free space" on one disk (no partition is deleted or formatted).
%include /usr/share/anaconda/interactive-defaults.ks

lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
timezone America/Toronto --utc
# The WebUI is a graphical install, which boots the new system to the sign-in screen;
# Anaconda in command-line mode would pick multi-user.target (a text login) instead.
xconfig --startxonboot
rootpw --lock
user --name=sparktest --gecos="Spark Test" --groups=wheel --password=sparkos-install-test --plaintext

# "Use free space": only the target disk, nothing cleared, automatic layout from the
# SparkOS profile (btrfs). @DATADISK@ is replaced with the target disk's kernel name.
ignoredisk --only-use=@DATADISK@
clearpart --none
autopart

# Test-only: a service that reports the installed system's state on the serial port once
# the sign-in screen is up. It changes nothing else.
%post --log=/tmp/anacoda_custom_logs/install-test-check.log
set -x
cat > /etc/sparkos-install-check.sh <<'CHECK_EOF'
#!/usr/bin/bash
# Test-only (installer-install-test.yml): reports this system's state on ttyS0.
out=/var/log/sparkos-install-check.txt
for _ in $(seq 1 240); do systemctl is-active -q display-manager && break; sleep 1; done
sleep 25 # let the sign-in screen draw
{
  echo "=== SPARKOS-CHECK-BEGIN"
  . /etc/os-release
  echo "CHECK name=$NAME"
  echo "CHECK pretty=$PRETTY_NAME"
  echo "CHECK id=$ID"
  echo "CHECK version=$VERSION_ID"
  echo "CHECK kernel=$(uname -r)"
  echo "CHECK dm=$(systemctl is-active display-manager) $(systemctl show -p Id --value display-manager)"
  echo "CHECK default_target=$(systemctl get-default)"
  echo "CHECK greeter=$(pgrep -a -f 'greeter|plasmalogin|sddm' | head -3 | cut -c1-80 | tr '\n' ';')"
  js=$(bootc status --json 2>/dev/null)
  echo "CHECK booted_image=$(jq -r '.status.booted.image.image.image // empty' <<<"$js")"
  echo "CHECK booted_transport=$(jq -r '.status.booted.image.image.transport // empty' <<<"$js")"
  echo "CHECK booted_digest=$(jq -r '.status.booted.image.imageDigest // empty' <<<"$js")"
  echo "CHECK sb=$(mokutil --sb-state 2>&1 | head -1)"
  cur=$(efibootmgr | sed -n 's/^BootCurrent: //p')
  echo "CHECK boot_entry=$(efibootmgr | sed -n "s/^Boot${cur}\*\{0,1\} //p" | cut -f1 | head -1)"
  echo "CHECK failed_units=$(systemctl --failed --no-legend --plain | awk '{print $1}' | tr '\n' ' ')"
  echo "CHECK autologin=$(grep -rhs '^User=' /etc/plasmalogin.conf /etc/plasmalogin.conf.d/ /usr/lib/plasmalogin/plasmalogin.conf.d/ /etc/sddm.conf /etc/sddm.conf.d/ | tr '\n' ' ')"
  echo "CHECK root_fs=$(findmnt -no FSTYPE /sysroot 2>/dev/null || findmnt -no FSTYPE /)"
  # Spark Update's "Check now", as the button runs it: reaches ghcr.io and checks the signature
  # policy accepts SparkOS's signed image. Then bootc's own check, for the log.
  timeout 600 spark-update --system-run --now check >/tmp/su.txt 2>&1
  echo "CHECK update_code=$?"
  echo "CHECK update_state=$(jq -c '{result,error,method,available_version}' /var/lib/spark-update/state.json 2>&1 | cut -c1-300)"
  timeout 600 bootc upgrade --check >/tmp/bc.txt 2>&1
  echo "CHECK bootc_check=$? $(grep -v '^\s*$' /tmp/bc.txt | tail -2 | tr '\n' ' ' | cut -c1-200)"
  echo "--- /proc/cmdline"; cat /proc/cmdline
  echo "--- bootc status"; bootc status
  echo "--- spark-update --system-run --now check"; cat /tmp/su.txt
  echo "--- bootc upgrade --check"; cat /tmp/bc.txt
  echo "--- rpm-ostree status"; rpm-ostree status -v
  echo "--- mokutil --list-enrolled (subjects)"; mokutil --list-enrolled 2>&1 | grep -E 'Subject:|Issuer:'
  echo "--- efibootmgr -v"; efibootmgr -v
  echo "--- lsblk"; lsblk -o NAME,SIZE,TYPE,FSTYPE,LABEL,PARTLABEL,MOUNTPOINTS
  echo "--- findmnt"; findmnt -l -o TARGET,SOURCE,FSTYPE | grep -vE 'cgroup|proc|sys|tmpfs|devpts|mqueue|hugetlb|tracefs|debugfs|bpf|pstore|configfs|fusectl|securityfs|efivarfs|binfmt'
  echo "--- systemctl --failed"; systemctl --failed --no-pager
  echo "--- journal errors"; journalctl -b -p err --no-pager | tail -60
  echo "=== SPARKOS-CHECK-END"
} > "$out" 2>&1
cat "$out" > /dev/ttyS0
CHECK_EOF
cat > /etc/systemd/system/sparkos-install-check.service <<'UNIT_EOF'
[Unit]
Description=Test-only: report the installed SparkOS state on the serial port
After=multi-user.target

[Service]
Type=oneshot
ExecStart=/usr/bin/bash /etc/sparkos-install-check.sh

[Install]
WantedBy=multi-user.target
UNIT_EOF
restorecon -v /etc/sparkos-install-check.sh /etc/systemd/system/sparkos-install-check.service || true
systemctl enable sparkos-install-check.service
%end
