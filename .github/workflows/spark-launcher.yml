name: spark-launcher
# Spark Launcher, SparkOS's app menu (a Plasma widget, files/spark-launcher).
#
# fedora:  QML lint and the Qt Quick tests (the search box filters a fake app list, Enter
#          opens the right app, sums go to Spark Calc, shut down asks first), with screenshots
#          of the open launcher in English and French; then the image build step
#          (files/scripts/spark-launcher.sh) in a plain Fedora container.
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), loads it in Plasma's own widget runner (plasmawindowed
#          --smoke-test, which builds the open launcher with Plasma's real models), uninstalls.
# The boot test opens it with the Meta key on a booted SparkOS.
on:
  push:
    paths:
      - "files/spark-launcher/**"
      - "files/scripts/spark-launcher.sh"
      - ".github/workflows/spark-launcher.yml"
  pull_request:
    paths:
      - "files/spark-launcher/**"
      - "files/scripts/spark-launcher.sh"
      - ".github/workflows/spark-launcher.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt Quick Test, Kirigami and Plasma
        run: |
          dnf -y install --setopt=install_weak_deps=False qt6-qtdeclarative-devel kf6-kirigami \
            kf6-kpackage plasma-workspace plasma-desktop plasma-integration libplasma \
            breeze-icon-theme cascadia-mono-fonts python3 dbus-daemon

      - name: QML lint and tests
        env:
          SHOTS: ${{ github.workspace }}/launcher-shots
          QT_QPA_PLATFORMTHEME: kde
        run: bash files/spark-launcher/tests/run.sh

      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spark-launcher-screenshots
          path: launcher-shots/
          if-no-files-found: warn

      - name: Install (the image build step, after Spark Calc's for the sums)
        run: |
          CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-calc.sh
          mkdir -p /usr/share/plasma/look-and-feel
          cp -r files/system/usr/share/plasma/look-and-feel/dev.wolklaw.sparkos.desktop /usr/share/plasma/look-and-feel/
          CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-launcher.sh

      - name: Loads in Plasma's widget runner
        # --smoke-test fails if main.qml or the open launcher (Launcher.qml) doesn't load
        run: |
          QT_QPA_PLATFORM=offscreen timeout 60 dbus-run-session plasmawindowed --smoke-test dev.wolklaw.sparklauncher

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, load in Plasma, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-launcher:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-launcher"
            chown -R tester: "$home/spark-launcher"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester XDG_RUNTIME_DIR=/tmp/xdg-tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            install -d -o tester -m 0700 /tmp/xdg-tester
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-launcher/install.sh --user"
            as "test -f ~/.local/share/plasma/plasmoids/dev.wolklaw.sparklauncher/contents/ui/Launcher.qml"

            echo "--- Plasma loads it (the open launcher included)"
            as "QT_QPA_PLATFORM=offscreen timeout 60 dbus-run-session plasmawindowed --smoke-test dev.wolklaw.sparklauncher"

            echo "--- uninstall"
            as "bash ~/spark-launcher/install.sh --user --uninstall"
            as "test ! -e ~/.local/share/plasma/plasmoids/dev.wolklaw.sparklauncher"
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, loaded and removed without root"
          '
