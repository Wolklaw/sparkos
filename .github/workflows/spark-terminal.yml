name: spark-terminal
# Spark Terminal, the SparkOS terminal (SparkOS's own), on VTE for GTK 4.
#
# fedora:  runs the image build step's install in a plain Fedora container, then the self-test,
#          the unit tests, and the window tests under Xvfb as a normal user (a tab runs echo,
#          tabs and splits open and close, --workdir, -e and --hold, search, vim and less), in
#          English and French, with screenshots, and measures start-up.
# sparkos: inside the published SparkOS image, runs files/scripts/spark-terminal.sh the way the
#          image build does (adds VTE, makes it the default terminal), then the
#          same tests on the image's own Python and GTK, and a per-user install and uninstall.
on:
  push:
    paths:
      - "files/spark-terminal/**"
      - "files/scripts/spark-terminal.sh"
      - "files/system/etc/xdg/kdeglobals"
      - "files/system/etc/xdg/*terminals.list"
      - ".github/workflows/spark-terminal.yml"
  pull_request:
    paths:
      - "files/spark-terminal/**"
      - "files/scripts/spark-terminal.sh"
      - "files/system/etc/xdg/kdeglobals"
      - "files/system/etc/xdg/*terminals.list"
      - ".github/workflows/spark-terminal.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (system-wide, as the image build does)
        run: bash files/spark-terminal/install.sh --deps

      - name: Self-test
        run: spark-terminal --self-test

      - name: Tests (Xvfb, as a normal user)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth \
            dbus-daemon mesa-dri-drivers util-linux less vim-enhanced bash
          useradd -m tester
          cp -r files/spark-terminal /home/tester/spark-terminal
          mkdir -p /home/tester/shots /home/tester/shots-fr
          chown -R tester: /home/tester
          run() {
            setpriv --reuid=tester --regid=tester --init-groups env -i HOME=/home/tester \
              USER=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 SHELL=/bin/bash \
              GSK_RENDERER=cairo "$@"
          }
          run SPARK_SHOT_DIR=/home/tester/shots bash -c 'cd ~/spark-terminal && dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 -m unittest discover -s tests -v'
          run SPARK_LANG=fr SPARK_SHOT_DIR=/home/tester/shots-fr bash -c 'cd ~/spark-terminal && dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 -m unittest discover -s tests -v'

      - name: Start-up time
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          export XDG_CONFIG_HOME=/tmp/b/config XDG_STATE_HOME=/tmp/b/state GSK_RENDERER=cairo
          for i in 1 2 3; do
            dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" spark-terminal --bench 2>/dev/null | grep '^bench' | tee -a bench.txt
          done
          { echo '### Spark Terminal start-up (GitHub runner, Fedora, Xvfb)'; echo '```'; cat bench.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spark-terminal-screenshots
          path: |
            /home/tester/shots
            /home/tester/shots-fr
          if-no-files-found: ignore

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Build step, tests and per-user install inside the image
        run: |
          sudo podman run --rm -v "$PWD:/repo:ro" "$IMAGE" \
            bash -euo pipefail /repo/files/spark-terminal/tests/image_check.sh | tee sparkos.txt
          status=${PIPESTATUS[0]}
          { echo '### Spark Terminal inside the SparkOS image'; echo '```';
            grep -E '^(image|before|bench|ok  |FAIL|self-test|Ran |OK)' sparkos.txt || true
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
