name: spark-tray
# Spark Tray ships in the SparkOS image (files/scripts/spark-tray.sh) and also installs per user
# without root.
#
# fedora:  runs the image build step in a plain Fedora container, then the self-test and the
#          tests: the services (NetworkManager, BlueZ, UPower, logind, power profiles) are
#          python-dbusmock fakes on private buses, CUPS is a fake runner, the volume is Spark
#          Audio's saved data. Window tests run under Xvfb in English and in French. Nothing
#          here talks to real hardware.
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), runs the self-test and the tests that need no mocks,
#          turns the autostart on and off, uninstalls it, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-tray/**"
      - "files/spark-audio/sparkaudio/**"
      - "files/scripts/spark-tray.sh"
      - ".github/workflows/spark-tray.yml"
  pull_request:
    paths:
      - "files/spark-tray/**"
      - "files/spark-audio/sparkaudio/**"
      - "files/scripts/spark-tray.sh"
      - ".github/workflows/spark-tray.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-tray.sh

      - name: Self-test
        run: spark-tray --self-test

      - name: Test tools
        run: dnf -y install --setopt=install_weak_deps=False python3-dbusmock dbus-daemon xorg-x11-server-Xvfb xorg-x11-xauth

      - name: Tests (Xvfb)
        run: |
          cd files/spark-tray
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr, with the text width checks)
        run: |
          cd files/spark-tray
          SPARK_LANG=fr xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/files"
            chown -R tester: "$home/files"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/files/spark-tray/install.sh --user"
            as "test -x ~/.local/bin/spark-tray"
            as "grep -q \"^Exec=$home/.local/bin/spark-tray$\" ~/.local/share/applications/dev.wolklaw.SparkTray.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkTray.png"
            # the image ships this app system-wide, in Spark-only autostart
            grep -q "^OnlyShowIn=Spark;$" /etc/xdg/autostart/dev.wolklaw.SparkTray.desktop

            echo "--- self-test, items and autostart"
            as "~/.local/bin/spark-tray --version"
            as "~/.local/bin/spark-tray --self-test"
            as "~/.local/bin/spark-tray --item printers off && ~/.local/bin/spark-tray --status | grep -q \"printers: off\""
            as "~/.local/bin/spark-tray --enable && test -f ~/.config/autostart/dev.wolklaw.SparkTray.desktop"
            as "~/.local/bin/spark-tray --status | grep -q \"autostart: on\""
            as "~/.local/bin/spark-tray --disable && grep -q Hidden=true ~/.config/autostart/dev.wolklaw.SparkTray.desktop"

            echo "--- tests that need no mocks, on the image'"'"'s Python"
            as "cd ~/files/spark-tray && python3 -m unittest discover -s tests -v"

            echo "--- uninstall"
            as "bash ~/files/spark-tray/install.sh --user --uninstall"
            as "test ! -e ~/.local/bin/spark-tray && test ! -e ~/.config/autostart/dev.wolklaw.SparkTray.desktop"
            left=$(as "find ~/.local ~/.config -iname \"*spark-tray*\" -o -iname \"*SparkTray*\" | grep -v \"/.config/spark-tray\" | grep -v \"/.local/state/spark-tray\"" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
