name: spark-fonts
# Spark Fonts is built into the image (files/scripts/spark-fonts.sh) and installs per user
# without root too, the way optional Spark apps do.
#
# fedora:  runs the image build step in a plain Fedora container, then the self-test and the
#          unit and UI tests under Xvfb, in English and in French (with the text width checks).
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), runs the self-test and the unit tests on the image's
#          Python, installs a font as that user and removes it again, uninstalls the app, and
#          checks nothing is left behind and /usr didn't change.
on:
  push:
    paths:
      - "files/spark-fonts/**"
      - "files/scripts/spark-fonts.sh"
      - ".github/workflows/spark-fonts.yml"
  pull_request:
    paths:
      - "files/spark-fonts/**"
      - "files/scripts/spark-fonts.sh"
      - ".github/workflows/spark-fonts.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (the image build step) and some fonts to look at
        run: |
          dnf -y install --setopt=install_weak_deps=False dejavu-sans-fonts dejavu-sans-mono-fonts liberation-sans-fonts google-noto-sans-cjk-fonts
          CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-fonts.sh

      - name: Self-test
        run: spark-fonts --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-fonts
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr, with the text width checks)
        run: |
          cd files/spark-fonts
          SPARK_LANG=fr xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test, install a font, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-fonts:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-fonts"
            chown -R tester: "$home/spark-fonts"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-fonts/install.sh --user"
            as "test -x ~/.local/bin/spark-fonts"
            as "grep -q \"^Exec=$home/.local/bin/spark-fonts %F$\" ~/.local/share/applications/dev.wolklaw.SparkFonts.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkFonts.png"
            echo "installed size: $(as "du -sk ~/.local/lib/spark-fonts ~/.local/share/icons/hicolor" | awk "{s+=\$1} END {print s}") KB"

            echo "--- self-test and unit tests on the image'"'"'s Python"
            as "~/.local/bin/spark-fonts --version"
            as "~/.local/bin/spark-fonts --self-test"
            as "cd ~/spark-fonts && python3 -m unittest discover -s tests -v"

            echo "--- install a font as this user, see it in fc-list, remove it"
            family=$(as "python3 ~/spark-fonts/tests/make_test_font.py ~/Zq.ttf")
            as "~/.local/bin/spark-fonts --install ~/Zq.ttf"
            as "test -f \"\$HOME/.local/share/fonts/$family/Zq.ttf\""
            as "fc-list : family | grep -q \"$family\""
            as "! ~/.local/bin/spark-fonts --install ~/Zq.ttf"       # already installed: nothing to do
            as "rm -rf ~/.local/share/fonts/$family ~/Zq.ttf && fc-cache -f ~/.local/share/fonts"
            as "! fc-list : family | grep -q \"$family\""

            echo "--- uninstall"
            as "bash ~/spark-fonts/install.sh --user --uninstall"
            # the uninstall keeps settings and logs on purpose (the README says so); clear them to see the rest
            as "rm -rf ~/.config/spark-fonts ~/.local/state/spark-fonts"
            left=$(as "find ~/.local -iname \"*spark*fonts*\" -o -iname \"*SparkFonts*\"" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
