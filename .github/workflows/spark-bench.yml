name: spark-bench
# Spark Bench is an optional Spark app: it is not in the image, it installs per user without
# root. Nothing here runs a game, Steam or a real flatpak override: the tests use a temporary
# HOME with stand-ins for flatpak and systemctl.
#
# fedora:  system-wide install with --deps, self-test, unit and UI tests under Xvfb, in English
#          and in French (with the text width checks).
# sparkos: inside the published SparkOS image, install.sh --user as a normal user, the
#          self-test and the unit tests on the image's Python, uninstall (which also removes a
#          background watcher unit Spark Bench wrote), nothing left behind, /usr unchanged.
on:
  push:
    paths:
      - "files/spark-bench/**"
      - ".github/workflows/spark-bench.yml"
  pull_request:
    paths:
      - "files/spark-bench/**"
      - ".github/workflows/spark-bench.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system-wide (with --deps)
        run: bash files/spark-bench/install.sh --deps

      - name: Self-test
        run: spark-bench --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth \
            dejavu-sans-mono-fonts bash
          cd files/spark-bench
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr, with the text width checks)
        run: |
          cd files/spark-bench
          SPARK_LANG=fr xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Uninstall
        run: |
          bash files/spark-bench/install.sh --uninstall
          test ! -e /usr/bin/spark-bench
          test ! -e /usr/lib/spark-bench

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-bench:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-bench"
            chown -R tester: "$home/spark-bench"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-bench/install.sh --user"
            as "test -x ~/.local/bin/spark-bench"
            as "grep -q \"^Exec=$home/.local/bin/spark-bench$\" ~/.local/share/applications/dev.wolklaw.SparkBench.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkBench.png"
            test ! -e /usr/bin/spark-bench

            echo "--- self-test and unit tests on the image'"'"'s Python"
            as "~/.local/bin/spark-bench --version"
            as "~/.local/bin/spark-bench --self-test"
            as "test ! -e ~/.config/MangoHud"
            as "cd ~/spark-bench && python3 -m unittest discover -s tests -v"
            as "test ! -e ~/.config/MangoHud && test ! -e ~/.var"

            echo "--- uninstall (with a background watcher unit Spark Bench wrote)"
            as "cd ~/.local/lib/spark-bench && python3 -c \"from sparkbench import core, watch; core.write_text(watch.unit_path(), watch.unit_text(watch.command()))\""
            as "head -n 1 ~/.config/systemd/user/spark-bench-watch.service"
            as "bash ~/spark-bench/install.sh --user --uninstall"
            as "test ! -e ~/.config/systemd/user/spark-bench-watch.service"
            left=$(as "find ~/.local -iname \"*spark*bench*\" -o -iname \"*SparkBench*\"" || true)
            left=$(printf "%s\n" "$left" | grep -v -e "/.local/state/spark-bench" -e "/.local/share/spark-bench" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
