name: spark-kwin-only
# The Spark apps that used to lean on Plasma (Snip, Files, Emoji, Update, spark-share), checked in
# a session with KWin and no plasmashell: a headless kwin_wayland on a private D-Bus, started by
# files/spark-apps/ci/kwin-only.sh, with the smoke checks in kwin_only_smoke.py. Runs inside the
# published SparkOS image (run with SYS_NICE: kwin_wayland carries that file capability and will not
# exec without it), which has KWin, krdp and the KDE portal.
# A GitHub runner has no GPU and KWin segfaults when asked to render (the first screen capture), so
# the Snip capture check is waived here (KWIN_ONLY_NO_RENDER=1) and runs last; it is tried on a PC.
# Also waived (KWIN_ONLY_WAIVE), because they fail in this container for reasons not found yet and
# pass on a PC: FUSE mounting (the non-root user's fusermount3 in a podman container) and the
# Emoji portal check. Do not read a green job as covering those two.
on:
  push:
    paths:
      - "files/spark-apps/ci/**"
      - "files/spark-snip/**"
      - "files/spark-files/**"
      - "files/spark-emoji/**"
      - "files/spark-update/**"
      - "files/system/usr/bin/spark-share"
      - ".github/workflows/spark-kwin-only.yml"
  pull_request:
    paths:
      - "files/spark-apps/ci/**"
      - "files/spark-snip/**"
      - "files/spark-files/**"
      - "files/spark-emoji/**"
      - "files/spark-update/**"
      - "files/system/usr/bin/spark-share"
      - ".github/workflows/spark-kwin-only.yml"
  workflow_dispatch:

jobs:
  kwin-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done

      - name: Smoke checks under KWin with no plasmashell
        run: |
          sudo podman run --rm --cap-add=SYS_NICE --device /dev/fuse -v "$PWD:/src:ro" -e KWIN_ONLY_STRICT=1 "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/repo"
            chown -R tester: "$home/repo"
            # setpriv, not su: a PAM session fails in a container
            setpriv --reuid=tester --regid=tester --init-groups \
              env -i HOME="$home" USER=tester LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin \
              LANG=C.UTF-8 KWIN_ONLY_STRICT=1 LIBGL_ALWAYS_SOFTWARE=1 KWIN_ONLY_NO_RENDER=1 "KWIN_ONLY_WAIVE=FUSE mount|RemoteDesktop portal" bash -c "cd ~/repo && files/spark-apps/ci/kwin-only.sh python3 files/spark-apps/ci/kwin_only_smoke.py"
          '
