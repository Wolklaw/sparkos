name: build
# Builds SparkOS from the Containerfile, signs it with SparkOS's key and publishes it to
# ghcr.io/wolklaw/sparkos. docs/building.md explains each step. The base is Fedora Kinoite
# (the Containerfile's BASE_IMAGE), pulled fresh on every build.
#
# Tags (the same ones BlueBuild used, so nothing that reads them changes):
#   main (push, the daily schedule, or Run workflow): <commit>-45, YYYYMMDD-45, YYYYMMDD, 45, latest
#   another branch: br-<branch>-45 (never latest), for testing with boot-test's image_tag
#   pull request: built and checked, not pushed (a PR from Dependabot or a fork has no signing key)
# The commit tag is pushed first, signed and verified; only then do the other tags, latest
# included, move to it. A PC never sees a latest whose signature isn't there yet.
on:
  schedule:
    - cron: "00 06 * * *" # 06:00 UTC every day, so Fedora's updates land within a day
  push:
    paths-ignore: # don't rebuild if only docs or the test/inventory workflows changed
      - "**.md"
      - ".github/workflows/boot-test.yml"
      - ".github/workflows/inventory.yml"
      - ".github/workflows/installer-iso.yml"
      - ".github/workflows/inspect.yml"
      - ".github/workflows/spark-*.yml"
      - "installer/**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      tag:
        description: "The commit or branch tag that was pushed and signed (empty for a pull request)"
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: "Its digest"
        value: ${{ jobs.build.outputs.digest }}

concurrency:
  # Pull requests queue by their branch, so a PR check never cancels or delays main's build.
  group: image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: sparkos
  IMAGE_REPO: ghcr.io/wolklaw/sparkos

jobs:
  build:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tags.outputs.first }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Find the base
        id: base
        run: |
          BASE=$(sed -n 's/^ARG BASE_IMAGE=//p' Containerfile | head -1)
          test -n "$BASE"
          for i in 1 2 3 4 5; do
            DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://$BASE") && break
            echo "inspect failed, retry $i"; sleep $((i*15))
          done
          test -n "$DIGEST"
          echo "$BASE is $DIGEST"
          echo "name=$BASE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          podman --version

      - name: Build the image
        env:
          BASE: ${{ steps.base.outputs.name }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          # Pulled by digest, so the base is exactly the one recorded in the labels
          for i in 1 2 3 4 5; do sudo podman pull -q "${BASE%:*}@$BASE_DIGEST" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman build \
            --file Containerfile \
            --build-arg BASE_IMAGE="${BASE%:*}@$BASE_DIGEST" \
            --build-arg BASE_DIGEST="$BASE_DIGEST" \
            --build-arg IMAGE_NAME="$IMAGE_NAME" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag localhost/sparkos:build \
            .
          sudo podman image inspect localhost/sparkos:build --format '{{.Id}} {{.Size}} bytes, {{len .RootFS.Layers}} layers'
          df -h /

      - name: Check it (bootc's own lint, for information)
        run: |
          sudo podman run --rm localhost/sparkos:build bootc container lint 2>&1 | tee lint.txt || true
          { echo "### bootc container lint"; echo '```'; tail -40 lint.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the optional Spark apps are sources only
        run: |
          # Each optional Spark app (no files/scripts/<slug>.sh installs it) is in
          # /usr/share/spark-store/sources for the Store to install per user, and not installed
          # system-wide by any build step.
          optional=$(bash files/spark-store/install.sh --optional)
          test -n "$optional"
          for slug in $optional; do
            id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "files/$slug/spark-app.json")
            sudo podman run --rm localhost/sparkos:build sh -euc "
              test -f /usr/share/spark-store/sources/$slug/install.sh
              test -f /usr/share/spark-store/sources/$slug/spark-app.json
              test ! -e /usr/lib/$slug && test ! -e /usr/bin/$slug
              test ! -e /usr/share/applications/$id.desktop
              echo '$slug: source shipped, not installed'"
          done

      - name: Work out the tags
        id: tags
        if: github.event_name != 'pull_request'
        run: |
          FEDORA=$(sudo podman image inspect localhost/sparkos:build --format '{{index .Labels "org.opencontainers.image.version"}}' | cut -d. -f1)
          # Fedora Kinoite's version label isn't always the Fedora release; ask the image then
          [[ $FEDORA =~ ^[0-9]+$ ]] || FEDORA=$(sudo podman run --rm localhost/sparkos:build rpm -E %fedora)
          [[ $FEDORA =~ ^[0-9]+$ ]] || { echo "no Fedora version in the labels ($FEDORA)"; exit 1; }
          DAY=$(date -u +%Y%m%d)
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            FIRST="${GITHUB_SHA::7}-$FEDORA"
            MORE="$DAY-$FEDORA $DAY $FEDORA latest"
          else
            BRANCH=$(echo "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9_.\n-' '-')
            FIRST="br-$BRANCH-$FEDORA"
            MORE=""
          fi
          echo "first=$FIRST" >> "$GITHUB_OUTPUT"
          echo "more=$MORE" >> "$GITHUB_OUTPUT"
          echo "Tags: $FIRST $MORE"

      - name: Push the first tag
        id: push
        if: github.event_name != 'pull_request'
        env:
          FIRST: ${{ steps.tags.outputs.first }}
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3; do
            sudo podman push --digestfile digest.txt localhost/sparkos:build "$IMAGE_REPO:$FIRST" && break
            echo "push failed, retry $i"; sleep $((i*30))
          done
          DIGEST=$(sudo cat digest.txt)
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest from the push"; exit 1; }
          echo "pushed $IMAGE_REPO:$FIRST@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # The same cosign installer, at the same commit, that BlueBuild's action used
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request'
        with:
          install-dir: /usr/bin
          use-sudo: true

      - name: Sign it with SparkOS's key
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || { echo "::error::SIGNING_SECRET isn't available to this run"; exit 1; }
          cosign version
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The classic signature format that rpm-ostree and bootc check (a sha256-<digest>.sig tag
          # next to the image, not the new bundle format), recorded in the public transparency
          # log, by digest: every tag of this digest is covered.
          COSIGN_PASSWORD="" COSIGN_YES=true cosign sign \
            --key=env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            --recursive \
            "$IMAGE_REPO@$DIGEST"

      - name: Verify the signature with the public key in the repo
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # The same check a SparkOS PC makes with /etc/pki/containers/$IMAGE_NAME.pub
          cosign verify --key=cosign.pub "$IMAGE_REPO@$DIGEST" > verify.json
          python3 -c 'import json; s = json.load(open("verify.json")); print(len(s), "signature(s):", [x["critical"]["identity"]["docker-reference"] for x in s])'

      - name: Move the other tags to it
        if: github.event_name != 'pull_request' && steps.tags.outputs.more != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          MORE: ${{ steps.tags.outputs.more }}
        run: |
          # Copies the manifest only (the layers are already there), so the digest stays the same
          # and the signature above covers every tag.
          for tag in $MORE; do
            for i in 1 2 3; do
              skopeo copy --all --preserve-digests \
                --src-creds "${{ github.actor }}:${{ github.token }}" --dest-creds "${{ github.actor }}:${{ github.token }}" \
                "docker://$IMAGE_REPO@$DIGEST" "docker://$IMAGE_REPO:$tag" && break
              echo "copy to $tag failed, retry $i"; sleep $((i*15))
            done
            GOT=$(skopeo inspect --creds "${{ github.actor }}:${{ github.token }}" --format '{{.Digest}}' "docker://$IMAGE_REPO:$tag")
            [ "$GOT" = "$DIGEST" ] || { echo "$tag is $GOT, expected $DIGEST"; exit 1; }
            echo "$tag -> $DIGEST"
          done
          cosign verify --key=cosign.pub "$IMAGE_REPO:latest" > /dev/null && echo "latest verifies"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo "\`$IMAGE_REPO@$DIGEST\`, signed and verified with cosign.pub"
            echo
            echo "Tags: ${{ steps.tags.outputs.first }} ${{ steps.tags.outputs.more }}"
            echo
            echo "Base: \`${{ steps.base.outputs.name }}\` = \`${{ steps.base.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
