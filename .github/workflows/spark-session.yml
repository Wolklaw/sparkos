name: spark-session
# The Spark session's security pieces: the polkit agent, the sign-in screen (greetd) and the lock
# screen check. Nothing here turns greetd on: the tests run in containers and `spark greeter
# enable` is only ever run with --dry-run.
#
# polkit:  the agent against a fake authority (dbusmock) and against a real polkitd, English and French.
# greeter: the sign-in screen against a fake greetd and a real greetd, `spark greeter` helper tests,
#          English and French.
# sparkos: inside the published SparkOS image: lock screen check in headless KWin, install into a
#          staging root, `spark greeter enable --dry-run`, greetd stays off.
on:
  push:
    paths:
      - "files/spark-session/**"
      - "files/scripts/spark-session.sh"
      - "files/system/usr/bin/spark"
      - "build_files/packages.sh"
      - ".github/workflows/spark-session.yml"
  pull_request:
    paths:
      - "files/spark-session/**"
      - "files/scripts/spark-session.sh"
      - "files/system/usr/bin/spark"
      - "build_files/packages.sh"
      - ".github/workflows/spark-session.yml"
  workflow_dispatch:

jobs:
  polkit:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False python3 python3-gobject python3-cairo gobject-introspection gtk4 \
            polkit polkit-libs python3-dbusmock dbus-daemon dbus-tools xorg-x11-server-Xvfb xorg-x11-xauth \
            dejavu-sans-mono-fonts procps-ng

      - name: Install and self-test
        run: bash files/spark-session/install.sh --root /tmp/stage

      - name: Fake authority tests
        run: cd files/spark-session && python3 -m unittest -v tests.test_polkit_fake_authority tests.test_polkit_flow

      - name: Real polkitd tests
        run: cd files/spark-session && python3 -m unittest -v tests.test_polkit_real

      - name: Window tests (Xvfb)
        run: |
          cd files/spark-session
          GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a -s "-screen 0 1280x800x24" python3 -m unittest -v tests.test_polkit_window

      - name: Tests in French
        run: |
          cd files/spark-session
          SPARK_LANG=fr GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a -s "-screen 0 1280x800x24" python3 -m unittest -v tests.test_polkit_window tests.test_polkit_flow tests.test_polkit_fake_authority

  greeter:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False python3 python3-gobject python3-cairo gobject-introspection gtk4 \
            greetd polkit python3-dbusmock dbus-daemon xorg-x11-server-Xvfb xorg-x11-xauth \
            dejavu-sans-mono-fonts procps-ng shadow-utils util-linux

      - name: Unit and window tests with a fake greetd (Xvfb)
        run: |
          cd files/spark-session
          GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a -s "-screen 0 1280x800x24" python3 -m unittest -v tests.test_greeter

      - name: Real greetd
        run: cd files/spark-session && SPARK_ALLOW_REAL_GREETD=1 python3 -m unittest -v tests.test_greetd_real

      - name: "spark greeter helper (enable, disable, rollback) in a fake root"
        run: cd files/spark-session && python3 -m unittest -v tests.test_greeter_ctl

      - name: Tests in French
        run: |
          cd files/spark-session
          SPARK_LANG=fr GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a -s "-screen 0 1280x800x24" python3 -m unittest -v tests.test_greeter

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Lock screen check in headless KWin
        run: |
          sudo podman run --rm --cap-add SYS_NICE -v "$PWD/files/spark-session:/src:ro" "$IMAGE" \
            bash -euo pipefail -c 'SPARK_ALLOW_LOCK_TEST=1 bash /src/tests/lock/run_lock_test.sh'

      - name: "Staging install, and the display manager stays the same"
        run: |
          sudo podman run --rm -v "$PWD/files:/tmp/files:ro" "$IMAGE" bash -euo pipefail -c '
            dm_before=$(readlink /etc/systemd/system/display-manager.service || true)
            echo "display manager before: $dm_before"
            bash /tmp/files/spark-session/install.sh --root /tmp/stage
            test -x /tmp/stage/usr/bin/spark-polkit
            test -x /tmp/stage/usr/bin/spark-greeter
            test -x /tmp/stage/usr/libexec/spark-greeter-session
            if find /etc/systemd/system -path "*.wants/*" -name greetd.service | grep -q .; then echo "greetd is enabled"; exit 1; fi
            dm_after=$(readlink /etc/systemd/system/display-manager.service || true)
            [ "$dm_before" = "$dm_after" ]
            case "$dm_after" in *greetd*) echo "display manager is greetd"; exit 1 ;; esac
            echo "ok"
          '
