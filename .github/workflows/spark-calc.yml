name: spark-calc
# Spark Calc installs per user without root, the way optional Spark apps will through the
# future Spark Portal, and has an image build step (files/scripts/spark-calc.sh) for when it
# ships in SparkOS.
#
# fedora:  runs the image build step in a plain Fedora container, then the self-test, the
#          unit and UI tests under Xvfb, and measures time to first paint in each mode.
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), runs the self-test and the unit tests on the image's
#          Python, uninstalls it, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-calc/**"
      - "files/scripts/spark-calc.sh"
      - ".github/workflows/spark-calc.yml"
  pull_request:
    paths:
      - "files/spark-calc/**"
      - "files/scripts/spark-calc.sh"
      - ".github/workflows/spark-calc.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-calc.sh

      - name: Self-test
        run: spark-calc --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-calc
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Speed (first paint in each mode)
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          for mode in standard scientific programmer; do
            # twice: the first run also writes the font cache, like a first launch
            xvfb-run -a -s "-screen 0 1920x1080x24" spark-calc --bench --mode "$mode" > /dev/null
            xvfb-run -a -s "-screen 0 1920x1080x24" spark-calc --bench --mode "$mode" | tee -a bench.txt
          done
          { echo '### Spark Calc speed (GitHub runner, Xvfb)'; echo '```'; cat bench.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-calc:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-calc"
            chown -R tester: "$home/spark-calc"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-calc/install.sh --user"
            as "test -x ~/.local/bin/spark-calc"
            as "grep -q \"^Exec=$home/.local/bin/spark-calc$\" ~/.local/share/applications/dev.wolklaw.SparkCalc.desktop"
            as "grep -q \"^X-KDE-Shortcuts=Calculator$\" ~/.local/share/kglobalaccel/dev.wolklaw.SparkCalc.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkCalc.png"
            # no "test ! -e /usr/..." here: the image ships this app system-wide; the /usr check proves the user install left /usr alone
            echo "installed size: $(as "du -sk ~/.local/lib/spark-calc ~/.local/share/icons/hicolor" | awk "{s+=\$1} END {print s}") KB"

            echo "--- self-test, sums and unit tests on the image'"'"'s Python"
            as "~/.local/bin/spark-calc --version"
            as "~/.local/bin/spark-calc --self-test"
            as "test \"\$(~/.local/bin/spark-calc --eval 0.1+0.2)\" = 0.3"
            as "cd ~/spark-calc && python3 -m unittest discover -s tests -v"

            echo "--- uninstall"
            as "bash ~/spark-calc/install.sh --user --uninstall"
            left=$(as "find ~/.local -iname \"*spark*calc*\" -o -iname \"*SparkCalc*\"" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
