name: wine-build
# The Wine that Spark Run downloads, built here from WineHQ's own source
# (files/spark-run/wine-build/build.sh), so it doesn't come from anyone else's build.
#
# build:    the build, twice, in parallel, each in the same pinned Fedora 45 container.
# compare:  both archives must be byte for byte the same (the build is reproducible); if not,
#           lists the files that differ and stops.
# publish:  (not on pull requests) creates the release (tag wine-<version>-<build>) with the
#           archive, its SHA-256 and the build info, if it doesn't exist yet. If it exists, checks
#           that this build gives exactly the published file, and changes nothing. It never
#           replaces a published file: sparkrun/sources.py pins its SHA-256.
on:
  push:
    paths:
      - "files/spark-run/wine-build/**"
      - ".github/workflows/wine-build.yml"
  pull_request:
    paths:
      - "files/spark-run/wine-build/**"
      - ".github/workflows/wine-build.yml"
  workflow_dispatch:

concurrency:
  group: wine-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fedora 45 (SparkOS's base), pinned by digest
  BUILD_IMAGE: registry.fedoraproject.org/fedora:45@sha256:f236063d5a7a15e76ff034f2be5fa6f7a8922fcb655093ad972a1f196b14a007

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        run: [a, b]
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45@sha256:f236063d5a7a15e76ff034f2be5fa6f7a8922fcb655093ad972a1f196b14a007
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build Wine from WineHQ's source
        env:
          CONTAINER_IMAGE: ${{ env.BUILD_IMAGE }}
        run: |
          start=$(date +%s)
          bash files/spark-run/wine-build/build.sh "$PWD/out" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            { echo "### Wine build ${{ matrix.run }} failed, last lines"; echo '```'; tail -80 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            text=$(tail -40 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Wine build ${{ matrix.run }}::$text"
            exit "$status"
          fi
          echo "whole job step: $(( ($(date +%s) - start) / 60 )) min" | tee -a out/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wine-${{ matrix.run }}
          path: out/
          compression-level: 0
          retention-days: 14

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: wine-a, path: a }
      - uses: actions/download-artifact@v8
        with: { name: wine-b, path: b }
      - name: The two builds must be identical
        run: |
          name=$(bash files/spark-run/wine-build/build.sh --name)
          cat a/sha256sums.txt b/sha256sums.txt
          {
            echo "### $name.tar.xz"
            echo '```'; head -8 a/build-info.txt; grep '^whole job' a/build-info.txt b/build-info.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if cmp -s "a/$name.tar.xz" "b/$name.tar.xz"; then
            echo "Two independent builds are byte for byte the same: reproducible." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "The two builds differ. Files that differ:" | tee -a "$GITHUB_STEP_SUMMARY"
          for r in a b; do mkdir "x$r" && tar -xJf "$r/$name.tar.xz" -C "x$r" && \
            (cd "x$r" && find . -type f -exec sha256sum {} + | sort -k2) > "$r.sums"; done
          diff a.sums b.sums | grep '^[<>]' | awk '{print $1, $3}' | sort -k2 | head -60 | tee diff.txt
          { echo '```'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Wine build not reproducible::$(wc -l < diff.txt) lines differ, first: $(head -3 diff.txt | tr '\n' ' ')"
          exit 1

  publish:
    needs: compare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: wine-a, path: out }
      - name: Publish the release, or check this build against it
        run: |
          name=$(bash files/spark-run/wine-build/build.sh --name)
          tag=$(bash files/spark-run/wine-build/build.sh --tag)
          version=${tag#wine-}; version=${version%-*}
          sha=$(cut -d' ' -f1 out/sha256sums.txt)
          bytes=$(stat -c %s "out/$name.tar.xz")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir published
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name.tar.xz" --dir published
            published=$(sha256sum "published/$name.tar.xz" | cut -d' ' -f1)
            echo "published: $published"; echo "this build: $sha"
            if [ "$published" = "$sha" ]; then
              echo "Release $tag exists; this build reproduces its archive exactly." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error title=Different from the published Wine::release $tag has $published, this build made $sha. Published files are never replaced; raise BUILD in build.sh for a new build."
            exit 1
          fi
          cat > notes.md <<EOF
          Wine $version for [Spark Run](https://github.com/$GITHUB_REPOSITORY/tree/main/files/spark-run), built by this repository's CI from WineHQ's own source: [wine-$version.tar.xz](https://dl.winehq.org/wine/source/${version%%.*}.x/wine-$version.tar.xz), checked against WineHQ's signature and a pinned SHA-256. No patches.

          A relocatable "wow64" Wine: 64-bit Linux code only, runs 32 and 64-bit Windows programs without 32-bit Linux libraries. Built on Fedora 45 (SparkOS's base) by [files/spark-run/wine-build/build.sh](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/files/spark-run/wine-build/build.sh) in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), twice, with byte-identical results.

          | File | Bytes | SHA-256 |
          |---|---|---|
          | \`$name.tar.xz\` | $bytes | \`$sha\` |

          Spark Run downloads it the first time someone runs a Windows program and deletes it unused if its SHA-256 isn't the one in \`sparkrun/sources.py\`. \`build-info.txt\` lists the configure options, the Linux libraries each module links to, and every package in the build container.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Wine $version for Spark Run (build ${tag##*-})" --notes-file notes.md \
            "out/$name.tar.xz" out/sha256sums.txt out/build-info.txt
          echo "Published release $tag: $name.tar.xz, $bytes bytes, sha256 $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          # --latest=false has not always been honoured: the installer must stay the latest release
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$tag" ]; then
            echo "::error title=Wine release marked latest::$tag became the repository's latest release; mark the installer release latest again (gh release edit installer --latest)"
            exit 1
          fi
