name: spark-edit
# Spark Edit, the SparkOS text and code editor. The main session decides when it goes into
# the image; files/scripts/spark-edit.sh is the build step for that.
#
# fedora:  runs the image build step in a plain Fedora container, then the self-test, the unit
#          and window tests under Xvfb as a normal user, and measures start-up and opening a
#          50 MB log file.
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), runs the self-test and the tests on the image's own
#          Python and Tk (window tests under Xvfb when the image has it), measures the same
#          50 MB file there, uninstalls it, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-edit/**"
      - "files/scripts/spark-edit.sh"
      - ".github/workflows/spark-edit.yml"
  pull_request:
    paths:
      - "files/spark-edit/**"
      - "files/scripts/spark-edit.sh"
      - ".github/workflows/spark-edit.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-edit.sh

      - name: Self-test
        run: spark-edit --self-test

      - name: Tests (Xvfb, as a normal user)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth \
            shared-mime-info util-linux
          useradd -m tester
          cp -r files/spark-edit /home/tester/spark-edit
          chown -R tester: /home/tester/spark-edit
          # a normal user, so the permission tests mean something (root can write anything)
          setpriv --reuid=tester --regid=tester --init-groups env -i HOME=/home/tester \
            USER=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
            bash -c 'cd ~/spark-edit && xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v'

      - name: Tests in French (SPARK_LANG=fr, with the text width checks)
        run: |
          setpriv --reuid=tester --regid=tester --init-groups env -i HOME=/home/tester \
            USER=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 SPARK_LANG=fr \
            bash -c 'cd ~/spark-edit && xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v'

      - name: Speed (start-up, 50 MB log file)
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          python3 files/spark-edit/tests/make_log.py /tmp/big.log 50
          export XDG_CONFIG_HOME=/tmp/b/config XDG_STATE_HOME=/tmp/b/state XDG_CACHE_HOME=/tmp/b/cache
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1920x1080x24" spark-edit --bench | tee -a bench.txt
          done
          for i in 1 2 3; do
            xvfb-run -a -s "-screen 0 1920x1080x24" spark-edit --bench /tmp/big.log | tee -a bench.txt
          done
          { echo '### Spark Edit speed (GitHub runner, Fedora, Xvfb)'; echo '```'; cat bench.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, test, measure, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-edit:/src:ro" "$IMAGE" \
            bash -euo pipefail /src/tests/user_install_check.sh | tee sparkos.txt
          { echo '### Spark Edit inside the SparkOS image'; echo '```';
            grep -A12 'bench, Python' sparkos.txt || echo "(no bench: no xvfb-run in the image)"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
