name: spark-audio
# Spark Audio ships in the SparkOS image (files/scripts/spark-audio.sh) and also installs
# per user without root, the way optional Spark apps will through the future Spark Portal.
#
# fedora:  runs the image build step in a plain Fedora container, then the self-test and the
#          unit and window tests under Xvfb, in English and in French. No sound card is needed:
#          the tests run on saved PipeWire and ALSA data.
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), runs the self-test and the unit tests on the image's
#          Python, uninstalls it, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-audio/**"
      - "files/scripts/spark-audio.sh"
      - ".github/workflows/spark-audio.yml"
  pull_request:
    paths:
      - "files/spark-audio/**"
      - "files/scripts/spark-audio.sh"
      - ".github/workflows/spark-audio.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-audio.sh

      - name: Self-test
        run: spark-audio --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-audio
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr, with the text width checks)
        run: |
          cd files/spark-audio
          SPARK_LANG=fr xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-audio:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-audio"
            chown -R tester: "$home/spark-audio"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-audio/install.sh --user"
            as "test -x ~/.local/bin/spark-audio"
            as "grep -q \"^Exec=$home/.local/bin/spark-audio$\" ~/.local/share/applications/dev.wolklaw.SparkAudio.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkAudio.png"
            # no "test ! -e /usr/..." here: the image ships this app system-wide; the /usr check proves the user install left /usr alone

            echo "--- self-test and unit tests on the image'"'"'s Python"
            as "~/.local/bin/spark-audio --version"
            as "~/.local/bin/spark-audio --self-test"
            as "cd ~/spark-audio && python3 -m unittest discover -s tests -v"

            echo "--- uninstall"
            as "bash ~/spark-audio/install.sh --user --uninstall"
            left=$(as "find ~/.local -iname \"*spark*monitor*\" -o -iname \"*SparkAudio*\"" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
