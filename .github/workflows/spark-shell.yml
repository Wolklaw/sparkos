name: spark-shell
# Spark Shell and the Spark login session (files/spark-shell).
#
# fedora:  unit tests (config, tray menu parsing, the notification model, window list, OSD
#          parsers), the launcher search vectors on the Python copy and on the widget's
#          JavaScript, and the install layout (install.sh --stage, then --uninstall).
# sparkos: inside the published SparkOS image, boots the whole session headless: KWin on
#          three virtual outputs, spark-session, the shell. session_check.py then checks the
#          panels, wallpapers, tray (a fake StatusNotifierItem), the notification server (a
#          test notification), the task list (a real window) and the launcher, and the PNGs
#          the shell renders of its own windows are uploaded. Nothing here is a real screen
#          or a real login; that is checked by hand (see the PR).
# The image gets gtk4-layer-shell added on the fly until a published image has it.
on:
  push:
    paths:
      - "files/spark-shell/**"
      - "files/spark-launcher/launcher_logic.py"
      - "files/spark-launcher/tests/**"
      - "files/scripts/spark-shell.sh"
      - ".github/workflows/spark-shell.yml"
  pull_request:
    paths:
      - "files/spark-shell/**"
      - "files/spark-launcher/launcher_logic.py"
      - "files/spark-launcher/tests/**"
      - "files/scripts/spark-shell.sh"
      - ".github/workflows/spark-shell.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Python, GTK 4, Node
        run: dnf -y install --setopt=install_weak_deps=False python3 python3-gobject python3-cairo gobject-introspection cairo-gobject gtk4 nodejs

      - name: Unit tests
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY python3 -m unittest discover -v -s files/spark-shell/tests -p 'test_units.py'

      - name: Launcher search, Python copy and JavaScript copy
        run: |
          python3 -m unittest discover -v -s files/spark-launcher/tests -p 'test_logic.py'
          node files/spark-launcher/tests/check_js.mjs

      - name: Install layout
        run: |
          d=$(mktemp -d)
          bash files/spark-shell/install.sh --stage "$d" --no-test
          test -x "$d/usr/bin/spark-session"
          test -f "$d/usr/share/wayland-sessions/spark.desktop"
          grep -q '^Exec=.*spark-session' "$d/usr/share/wayland-sessions/spark.desktop"
          env -u DISPLAY -u WAYLAND_DISPLAY python3 "$d/usr/lib/spark-shell/spark_shell.py" --self-test
          bash files/spark-shell/install.sh --stage "$d" --uninstall
          test -z "$(find "$d" -type f)"
          sh -n files/spark-shell/session/spark-session
          sh -n files/spark-shell/session/spark-session-run
          sh -n files/spark-shell/session/spark-session-polkit

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: "Add gtk4-layer-shell if the image lacks it"
        run: |
          printf 'FROM %s\nRUN rpm -q gtk4-layer-shell || dnf -y install gtk4-layer-shell\n' "$IMAGE" > Containerfile.test
          sudo podman build -q -t spark-shell-test -f Containerfile.test .

      - name: "Boot the session headless on 3 outputs and check it"
        run: |
          mkdir -p shots
          # kwin_wayland carries a file capability, so the container needs CAP_SYS_NICE
          sudo podman run --rm --cap-add=SYS_NICE \
            -v "$PWD/files:/src:ro" -v "$PWD/shots:/shots" spark-shell-test \
            sh /src/spark-shell/tests/headless.sh 3 /shots

      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spark-shell-screenshots
          path: shots/
          if-no-files-found: warn

      - name: "Image build step"
        # files/scripts/spark-shell.sh as the Containerfile runs it, in the image
        run: |
          sudo podman run --rm -v "$PWD/files:/tmp/files:ro" spark-shell-test \
            bash -euo pipefail -c 'CONFIG_DIRECTORY=/tmp/files bash /tmp/files/scripts/spark-shell.sh'
