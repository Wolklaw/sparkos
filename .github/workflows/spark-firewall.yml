name: spark-firewall
# Spark Firewall ships in the SparkOS image (files/scripts/spark-firewall.sh). It installs
# system-wide only: a root helper changes firewalld and polkit guards it.
#
# fedora: runs the image build step in a plain Fedora container (installs polkit and firewalld
#         with dnf), then the self-test and the unit tests (English and French; the window tests
#         run under Xvfb), and checks the uninstall leaves nothing in /usr. firewalld is not
#         running on a CI runner: the tests use a fake runner and recorded firewall-cmd output,
#         and nothing here changes a firewall.
on:
  push:
    paths:
      - "files/spark-firewall/**"
      - "files/scripts/spark-firewall.sh"
      - ".github/workflows/spark-firewall.yml"
  pull_request:
    paths:
      - "files/spark-firewall/**"
      - "files/scripts/spark-firewall.sh"
      - ".github/workflows/spark-firewall.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-firewall.sh

      - name: Self-test
        run: |
          spark-firewall --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-firewall
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr)
        run: |
          cd files/spark-firewall
          SPARK_LANG=fr xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Uninstall, and check nothing is left
        run: |
          bash files/spark-firewall/install.sh --uninstall
          left=$(find /usr /etc -iname '*spark-firewall*' -o -iname '*SparkFirewall*' 2>/dev/null || true)
          if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
