name: spark-clips
# Spark Clips is an optional Spark app: it is not in the image, it installs per user without
# root. CI has no game, no screen share and no GPU: every test runs on a test pattern with the
# software encoder (SPARK_CLIPS_FAKE=1) and writes only inside temporary folders.
#
# fedora:  system-wide install, self-test, unit and UI tests under Xvfb (English and French).
# sparkos: inside the published SparkOS image, install.sh --user as a normal user, the
#          self-test and the unit tests on the image's Python, uninstall, nothing left behind.
on:
  push:
    paths:
      - "files/spark-clips/**"
      - ".github/workflows/spark-clips.yml"
  pull_request:
    paths:
      - "files/spark-clips/**"
      - ".github/workflows/spark-clips.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system-wide (with --deps)
        run: bash files/spark-clips/install.sh --deps --no-test

      - name: Software encoder for the test pattern
        run: |
          dnf -y install --setopt=install_weak_deps=False --enablerepo=fedora-cisco-openh264 \
            gstreamer1-plugin-openh264 || true
          gst-inspect-1.0 openh264enc || gst-inspect-1.0 x264enc || echo "no software encoder"

      - name: Self-test
        run: spark-clips --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth \
            dejavu-sans-mono-fonts bash
          cd files/spark-clips
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr, with the text width checks)
        run: |
          cd files/spark-clips
          SPARK_LANG=fr xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-clips:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-clips"
            chown -R tester: "$home/spark-clips"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-clips/install.sh --user"
            as "test -x ~/.local/bin/spark-clips"
            as "grep -q \"^Exec=$home/.local/bin/spark-clips$\" ~/.local/share/applications/dev.wolklaw.SparkClips.desktop"
            as "grep -q \"^Exec=$home/.local/bin/spark-clips --save$\" ~/.local/share/applications/dev.wolklaw.SparkClips.desktop"
            as "test -f ~/.config/systemd/user/spark-clips.service"
            as "grep -q \"^ExecStart=$home/.local/bin/spark-clips --daemon$\" ~/.config/systemd/user/spark-clips.service"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkClips.png"
            as "test -f ~/.local/lib/spark-clips/sparkclips/app.py"
            test ! -e /usr/bin/spark-clips

            echo "--- self-test and unit tests on the image'"'"'s Python"
            as "~/.local/bin/spark-clips --version"
            as "~/.local/bin/spark-clips --self-test"
            as "cd ~/spark-clips && python3 -m unittest discover -s tests -v"

            echo "--- uninstall"
            as "bash ~/spark-clips/install.sh --user --uninstall"
            as "test ! -e ~/.config/systemd/user/spark-clips.service"
            left=$(as "find ~/.local ~/.config -iname \"*spark*clips*\" -o -iname \"*SparkClips*\"" || true)
            left=$(printf "%s\n" "$left" | grep -v "/.local/state/spark-clips" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
