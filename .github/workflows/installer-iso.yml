name: installer-iso
# Builds the SparkOS installers (live ISOs), boots each once in a VM, and uploads them to the
# "installer" release in parts under 2 GiB (GitHub's limit per release file), with join scripts
# for Windows and Linux:
#   SparkOS-installer.iso         ghcr.io/wolklaw/sparkos         AMD and Intel graphics
#   SparkOS-NVIDIA-installer.iso  ghcr.io/wolklaw/sparkos-nvidia  NVIDIA graphics (RTX 20 and newer, GTX 16)
# Each ISO is built in its own job and kept as a run artifact (installer-iso, installer-iso-nvidia)
# for installer-install-test.yml. On main, the publish job uploads SparkOS-installer.iso to the
# release, and SparkOS-NVIDIA-installer.iso too only when the repository variable
# PUBLISH_NVIDIA_INSTALLER is true (off until the owner releases the NVIDIA version). This
# workflow never creates a public release, never publishes a draft and never changes a
# release's or a package's visibility.
# Adapted from Bazzite's build_iso.yml (github.com/ublue-os/bazzite, Apache-2.0).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the installer release (main only); otherwise keep the ISOs as run artifacts
        type: boolean
        default: true
      image_tag:
        description: Image tag to build from (a branch build is br-<branch>-<Fedora version>; main publishes only latest)
        type: string
        default: latest
      variant:
        description: Which installer to build (publishing needs both)
        type: choice
        options: [both, sparkos, sparkos-nvidia]
        default: both
  schedule:
    - cron: "30 9 * * 1" # Mondays, after the daily image build

permissions:
  contents: write # publish the release
  packages: read

concurrency:
  # One queue per branch: a branch's test ISOs never wait for, or bump, main's
  group: installer-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    name: iso (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.variant != 'both' && format('["{0}"]', inputs.variant) || '["sparkos", "sparkos-nvidia"]') }}
    env:
      IMAGE: ghcr.io/wolklaw/${{ matrix.variant }}:${{ inputs.image_tag || 'latest' }}
      ISO_NAME: ${{ matrix.variant == 'sparkos-nvidia' && 'SparkOS-NVIDIA-installer.iso' || 'SparkOS-installer.iso' }}
      SUFFIX: ${{ matrix.variant == 'sparkos-nvidia' && '-nvidia' || '' }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Container storage on a compressed loopback
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Make the app list
        run: |
          # No Flatpaks: SparkOS preinstalls no third-party apps, and Bazzite's own first-boot apps
          # are deliberately left out. The installer still reads this (empty) list.
          : > installer/flatpaks
          echo "$(grep -c . installer/flatpaks || true) Flatpaks in the installer"
          cat installer/flatpaks

      - name: Build the installer image
        run: |
          # Logged in with this job's token, for the FROM pull and for the pull inside
          # installer/build.sh (the login is mounted for the build only, never in the image).
          # A private package (sparkos-nvidia before release) works too.
          sudo mkdir -p -m 700 /tmp/ghcr-auth
          echo "${{ github.token }}" | sudo podman login --authfile /tmp/ghcr-auth/auth.json ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo chmod 600 /tmp/ghcr-auth/auth.json
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --authfile /tmp/ghcr-auth/auth.json \
            --volume /tmp/ghcr-auth:/run/ghcr-auth:ro \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="$IMAGE" --build-arg INSTALL_IMAGE_PAYLOAD="$IMAGE" \
            -t localhost/payload:latest installer/
          sudo podman image inspect "$IMAGE" --format '{{.Digest}}' | tee /tmp/image-digest

      - name: Check every app is in the installer
        run: |
          sudo podman run --rm localhost/payload:latest flatpak list --system --app --columns=application,version | tee /tmp/installer-apps.txt
          missing=0
          for id in $(cat installer/flatpaks); do grep -q "^$id" /tmp/installer-apps.txt || { echo "::error::missing $id"; missing=1; }; done
          [ "$missing" = 0 ]

      - name: Build the ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ env.ISO_NAME }}

      - name: Boot the ISO once
        run: |
          ISO="${{ steps.build.outputs.iso-dest }}"
          ls -lh "$ISO"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf socat >/dev/null
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/vars.fd
          qemu-system-x86_64 -enable-kvm -cpu host -machine q35 -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -cdrom "$ISO" -vga virtio -display none -serial file:/tmp/iso-serial.log \
            -monitor unix:/tmp/qmon,server,nowait -daemonize -pidfile /tmp/qemu.pid
          mkdir -p /tmp/iso-shots
          for t in 120 240; do
            sleep 120
            echo "screendump /tmp/iso-shots/after-${t}s.png -f png" | socat - UNIX-CONNECT:/tmp/qmon
          done
          kill "$(cat /tmp/qemu.pid)" || true
          ls -l /tmp/iso-shots
          grep -aE "livesys|Reached target.*Graphical" /tmp/iso-serial.log | tail -5 || true

      - name: Upload boot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-boot${{ env.SUFFIX }}
          path: |
            /tmp/iso-shots/
            /tmp/iso-serial.log
          retention-days: 7

      - name: Split, checksum and write join scripts
        run: |
          ISO="${{ steps.build.outputs.iso-dest }}"
          mkdir -p out && mv "$ISO" "out/$ISO_NAME" && cd out
          sha256sum "$ISO_NAME" > "iso$SUFFIX.sha256"
          SHA=$(cut -d' ' -f1 "iso$SUFFIX.sha256")
          split -b 1900M -d -a 2 "$ISO_NAME" "$ISO_NAME.part"
          rm "$ISO_NAME"
          PARTS=$(ls "$ISO_NAME".part* | sort)
          sha256sum $PARTS "iso$SUFFIX.sha256" > "SHA256SUMS$SUFFIX"
          {
            echo '@echo off'
            echo "rem Joins the SparkOS installer parts into $ISO_NAME and checks it."
            echo 'cd /d "%~dp0"'
            echo "echo Joining $(echo $PARTS | wc -w) parts..."
            echo "copy /b $(echo $PARTS | sed 's/ /+/g') $ISO_NAME >nul || goto failed"
            echo "certutil -hashfile $ISO_NAME SHA256 | findstr /i $SHA >nul || goto failed"
            echo "echo OK: $ISO_NAME is complete and its SHA-256 matches."
            echo 'echo Write it to a USB stick with Fedora Media Writer (Custom image) or Rufus (DD mode).'
            echo 'pause & exit /b 0'
            echo ':failed'
            echo 'echo Something is wrong: a part is missing or damaged. Download the parts again.'
            echo 'pause & exit /b 1'
          } | sed 's/$/\r/' > "join-iso$SUFFIX.cmd"
          {
            echo '#!/bin/sh'
            echo 'set -e; cd "$(dirname "$0")"'
            # $PARTS is one name per line; unquoted $(echo) puts them on one line
            echo "cat $(echo $PARTS) > $ISO_NAME"
            echo "echo '$SHA  $ISO_NAME' | sha256sum -c -"
          } > "join-iso$SUFFIX.sh"
          chmod +x "join-iso$SUFFIX.sh"
          cp /tmp/image-digest image-digest.txt
          cp /tmp/installer-apps.txt installer-apps.txt
          echo "$IMAGE" > image.txt
          ls -lh

      # Every build keeps its ISO as a run artifact: installer-install-test.yml installs it, and
      # the publish job below uploads it to the release
      - name: Keep the ISO as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-iso${{ env.SUFFIX }}
          path: out/
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish to the installer release
    needs: iso
    # Runs even when one ISO job failed: each installer it publishes must have its artifact
    # (the download fails otherwise), so an unpublished NVIDIA build never holds up the other
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.publish && inputs.image_tag == 'latest' && inputs.variant == 'both')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The NVIDIA installer goes to the release only once the owner sets the repository
      # variable PUBLISH_NVIDIA_INSTALLER to true (after making ghcr.io/wolklaw/sparkos-nvidia
      # public, which its installed PCs need for updates). Until then it's built and tested
      # every week, and kept as a run artifact only.
      NVIDIA: ${{ vars.PUBLISH_NVIDIA_INSTALLER == 'true' }}
    steps:
      - name: Make room
        run: sudo mkdir -p /mnt/out && sudo chown "$USER" /mnt/out && df -h / /mnt

      - uses: actions/download-artifact@v4
        with:
          name: installer-iso
          path: /mnt/out/sparkos

      - uses: actions/download-artifact@v4
        if: env.NVIDIA == 'true'
        with:
          name: installer-iso-nvidia
          path: /mnt/out/sparkos-nvidia

      - name: Check the ISOs
        run: |
          cd /mnt/out
          (cd sparkos && sha256sum -c SHA256SUMS)
          if [ "$NVIDIA" = true ]; then
            (cd sparkos-nvidia && sha256sum -c SHA256SUMS-nvidia)
            # Its PCs update from the image: it must be public before its installer is
            curl -fs "https://ghcr.io/token?scope=repository:wolklaw/sparkos-nvidia:pull" | grep -q '"token"' || \
              { echo "::error::ghcr.io/wolklaw/sparkos-nvidia is private: make it public first"; exit 1; }
          else
            echo "NVIDIA installer not published (PUBLISH_NVIDIA_INSTALLER isn't true)"
          fi
          ls -lR

      - name: Upload and write the notes
        run: |
          cd /mnt/out
          size() { awk '{s+=$1} END {printf "%.1f", s/1024/1024/1024}' < <(stat -c %s "$1"/*.part*); }
          files() { (cd "$1" && ls *.part* join-iso*.cmd join-iso*.sh SHA256SUMS*); }
          VARIANTS="sparkos"; [ "$NVIDIA" = true ] && VARIANTS="sparkos sparkos-nvidia"
          {
            if [ "$NVIDIA" = true ]; then
              echo "The SparkOS installers, built $(date -u +%Y-%m-%d). There are two: pick the one for your graphics card."
            else
              echo "The SparkOS installer, built $(date -u +%Y-%m-%d), for AMD and Intel graphics. An NVIDIA version is built and tested in CI but not published yet."
            fi
            echo
            echo "**AMD or Intel graphics:** \`SparkOS-installer.iso\` ($(size sparkos) GiB), from \`$(cat sparkos/image.txt)\` (\`$(cat sparkos/image-digest.txt)\`)."
            echo "Download the files without \`NVIDIA\` or \`nvidia\` in their name: \`SparkOS-installer.iso.part*\`, \`join-iso.cmd\`, \`join-iso.sh\`, \`SHA256SUMS\`."
            echo
            if [ "$NVIDIA" = true ]; then
              echo "**NVIDIA graphics (GeForce RTX 20 series and newer, GTX 16 series):** \`SparkOS-NVIDIA-installer.iso\` ($(size sparkos-nvidia) GiB), from \`$(cat sparkos-nvidia/image.txt)\` (\`$(cat sparkos-nvidia/image-digest.txt)\`), with NVIDIA's driver."
              echo "Download the files with \`NVIDIA\` or \`nvidia\` in their name: \`SparkOS-NVIDIA-installer.iso.part*\`, \`join-iso-nvidia.cmd\`, \`join-iso-nvidia.sh\`, \`SHA256SUMS-nvidia\`."
              echo "Not tested on NVIDIA hardware yet: CI installs it in a VM, which has no NVIDIA card. GeForce GTX 10 series and older cards don't work with this driver; on those, use the AMD and Intel installer (the card then runs on nouveau, the open driver, which is slow for games)."
              echo
            fi
            echo "Then run the join script (\`.cmd\` on Windows, \`.sh\` on Linux). It joins the parts into the ISO and checks its SHA-256."
            echo "Write the ISO to a USB stick (16 GB or larger) with Fedora Media Writer (Custom image) or Rufus (DD mode)."
            echo "The parts exist because GitHub limits each release file to 2 GiB."
            echo
            echo "**Apps:** SparkOS ships only its own apps, as part of the system: Soot, FreeSuite, Spark Snip, Spark Media, Spark Welcome, Spark Games, Spark Monitor, Spark Edit, Spark Calc, Spark Archive, Spark Scan, Spark Run, Spark Link, Spark Store and Spark Update."
            echo "Everything else installs from the Store (Bazaar), or by double-clicking a downloaded .exe, .AppImage or .rpm."
            [ "$NVIDIA" = true ] && echo "The NVIDIA installer adds only NVIDIA's driver and its tools."
            for v in $VARIANTS; do
              if grep -q . "$v/installer-apps.txt"; then
                echo; echo "Extra Flatpaks carried by the $v installer:"; echo '```'; cat "$v/installer-apps.txt"; echo '```'
              fi
            done
          } > notes.md
          cat notes.md
          gh release view installer >/dev/null 2>&1 || \
            gh release create installer --draft --target main --title "SparkOS installer" --notes "Building..." --latest=false
          for v in $VARIANTS; do
            (cd "$v" && gh release upload installer $(files .) --clobber)
          done
          gh release edit installer --notes-file notes.md --title "SparkOS installer ($(date -u +%Y-%m-%d))"
          # Remove parts left over from an older, larger ISO (and nothing of an installer not
          # published here)
          keep=$(for v in $VARIANTS; do files "$v"; done | xargs -n1 basename)
          gh release view installer --json assets --jq '.assets[].name' | while read -r a; do
            grep -qxF "$a" <<<"$keep" || gh release delete-asset installer "$a" --yes
          done
