name: installer-iso
# Builds the SparkOS installer (live ISO), boots it once in a VM,
# and uploads it to the "installer" release in parts under 2 GiB (GitHub's limit per
# release file), with a join script for Windows and Linux. The release is a draft (not
# public) until the owner publishes it by hand; this workflow never publishes it.
# Adapted from Bazzite's build_iso.yml (github.com/ublue-os/bazzite, Apache-2.0).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the installer release (main only); otherwise keep the ISO as a run artifact
        type: boolean
        default: true
      image:
        description: Which image the installer installs (sparkos-nvidia publishes to the installer-nvidia release)
        type: choice
        options: [sparkos, sparkos-nvidia]
        default: sparkos
  schedule:
    - cron: "30 9 * * 1" # Mondays, after the daily image build

permissions:
  contents: write # publish the release
  packages: read

concurrency:
  group: installer-iso-${{ inputs.image || 'sparkos' }}
  cancel-in-progress: false

env:
  # The Monday build is the main image's; the Nvidia one is built by hand (Run workflow, image)
  IMAGE: ghcr.io/wolklaw/${{ inputs.image || 'sparkos' }}:latest
  ISO_NAME: ${{ inputs.image == 'sparkos-nvidia' && 'SparkOS-Nvidia-installer.iso' || 'SparkOS-installer.iso' }}
  RELEASE: ${{ inputs.image == 'sparkos-nvidia' && 'installer-nvidia' || 'installer' }}
  NVIDIA: ${{ inputs.image == 'sparkos-nvidia' }}

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Container storage on a compressed loopback
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true
          df -h / /mnt

      - uses: actions/checkout@v7

      - name: Make the app list
        run: |
          # No Flatpaks: SparkOS preinstalls no third-party apps, and Bazzite's own first-boot apps
          # are deliberately left out. The installer still reads this (empty) list.
          : > installer/flatpaks
          echo "$(grep -c . installer/flatpaks || true) Flatpaks in the installer"
          cat installer/flatpaks

      - name: Build the installer image
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="$IMAGE" --build-arg INSTALL_IMAGE_PAYLOAD="$IMAGE" \
            -t localhost/payload:latest installer/
          sudo podman image inspect "$IMAGE" --format '{{.Digest}}' | tee /tmp/image-digest

      - name: Check every app is in the installer
        run: |
          sudo podman run --rm localhost/payload:latest flatpak list --system --app --columns=application,version | tee /tmp/installer-apps.txt
          missing=0
          for id in $(cat installer/flatpaks); do grep -q "^$id" /tmp/installer-apps.txt || { echo "::error::missing $id"; missing=1; }; done
          [ "$missing" = 0 ]

      - name: Build the ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ env.ISO_NAME }}

      - name: Boot the ISO once
        run: |
          ISO="${{ steps.build.outputs.iso-dest }}"
          ls -lh "$ISO"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf socat >/dev/null
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/vars.fd
          qemu-system-x86_64 -enable-kvm -cpu host -machine q35 -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -cdrom "$ISO" -vga virtio -display none -serial file:/tmp/iso-serial.log \
            -monitor unix:/tmp/qmon,server,nowait -daemonize -pidfile /tmp/qemu.pid
          mkdir -p /tmp/iso-shots
          for t in 120 240; do
            sleep 120
            echo "screendump /tmp/iso-shots/after-${t}s.png -f png" | socat - UNIX-CONNECT:/tmp/qmon
          done
          kill "$(cat /tmp/qemu.pid)" || true
          ls -l /tmp/iso-shots
          grep -aE "livesys|Reached target.*Graphical" /tmp/iso-serial.log | tail -5 || true

      - name: Upload boot screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-boot
          path: |
            /tmp/iso-shots/
            /tmp/iso-serial.log
          retention-days: 7

      - name: Split, checksum and write join scripts
        run: |
          ISO="${{ steps.build.outputs.iso-dest }}"
          mkdir -p out && mv "$ISO" "out/$ISO_NAME" && cd out
          sha256sum "$ISO_NAME" > iso.sha256
          SHA=$(cut -d' ' -f1 iso.sha256)
          split -b 1900M -d -a 2 "$ISO_NAME" "$ISO_NAME.part"
          rm "$ISO_NAME"
          PARTS=$(ls "$ISO_NAME".part* | sort)
          sha256sum $PARTS iso.sha256 > SHA256SUMS
          {
            echo '@echo off'
            echo 'rem Joins the SparkOS installer parts into SparkOS-installer.iso and checks it.'
            echo 'cd /d "%~dp0"'
            echo "echo Joining $(echo $PARTS | wc -w) parts..."
            echo "copy /b $(echo $PARTS | sed 's/ /+/g') $ISO_NAME >nul || goto failed"
            echo "certutil -hashfile $ISO_NAME SHA256 | findstr /i $SHA >nul || goto failed"
            echo "echo OK: $ISO_NAME is complete and its SHA-256 matches."
            echo 'echo Write it to a USB stick with Fedora Media Writer (Custom image) or Rufus (DD mode).'
            echo 'pause & exit /b 0'
            echo ':failed'
            echo 'echo Something is wrong: a part is missing or damaged. Download the parts again.'
            echo 'pause & exit /b 1'
          } | sed 's/$/\r/' > join-iso.cmd
          {
            echo '#!/bin/sh'
            echo 'set -e; cd "$(dirname "$0")"'
            # $PARTS is one name per line; unquoted $(echo) puts them on one line
            echo "cat $(echo $PARTS) > $ISO_NAME"
            echo "echo '$SHA  $ISO_NAME' | sha256sum -c -"
          } > join-iso.sh
          chmod +x join-iso.sh
          cp /tmp/image-digest image-digest.txt
          ls -lh

      # Builds from other branches (and publish=false) are kept as an artifact for
      # installer-install-test.yml instead of replacing the release
      - name: Keep the ISO as a run artifact
        if: github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.image == 'sparkos-nvidia' && 'installer-iso-nvidia' || 'installer-iso' }}
          path: out/
          compression-level: 0
          retention-days: 3

      - name: Publish to the installer release
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          SIZE=$(awk '{s+=$1} END {printf "%.1f", s/1024/1024/1024}' < <(stat -c %s "$ISO_NAME".part*))
          {
            echo "The SparkOS installer, built $(date -u +%Y-%m-%d) from \`$IMAGE\` (\`$(cat /tmp/image-digest)\`)."
            echo
            echo "**Download all the files below**, then run \`join-iso.cmd\` (Windows) or \`join-iso.sh\` (Linux)."
            echo "It joins the parts into \`$ISO_NAME\` ($SIZE GiB) and checks its SHA-256."
            echo "Write the ISO to a USB stick (16 GB or larger) with Fedora Media Writer (Custom image) or Rufus (DD mode)."
            echo "The parts exist because GitHub limits each release file to 2 GiB."
            echo
            echo "**Apps:** SparkOS ships only its own apps, as part of the system: Soot, FreeSuite, Spark Files, Spark Terminal, Spark Snip, Spark Media, Spark Welcome, Spark Games, Spark Monitor, Spark Edit, Spark Calc, Spark Archive, Spark Scan, Spark Run, Spark Link, Spark Store and Spark Update."
            echo "Everything else installs from Spark Store, or by double-clicking a downloaded .exe, .AppImage or .rpm."
            if grep -q . /tmp/installer-apps.txt; then
              echo; echo "Extra Flatpaks carried by this installer:"; echo '```'; cat /tmp/installer-apps.txt; echo '```'
            fi
            echo
            echo "**Install guide:** [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install.md). It installs next to Windows, which stays; you pick the system at power-on. Back up first."
            echo
            if [ "$NVIDIA" = true ]; then
              echo "**Graphics:** this is the NVIDIA version: Nvidia's own driver, for GeForce GTX 16, RTX 20 and newer. Older Nvidia cards and AMD or Intel graphics: use the main SparkOS installer. Not yet tested on a real Nvidia PC."
            else
              echo "**Graphics:** AMD and Intel. For an Nvidia card (GTX 16, RTX 20 and newer), use the SparkOS NVIDIA installer."
            fi
            echo
            echo "**Tested:** every installer build is installed next to a Windows disk in a VM (separate disks, a shared boot partition, and Secure Boot on), then booted. SparkOS has been installed on one real PC so far, so expect rough edges."
            echo
            echo "SparkOS is source-available, not open source: see [LICENSE](https://github.com/$GITHUB_REPOSITORY/blob/main/LICENSE)."
          } > notes.md
          TITLE="SparkOS installer"
          [ "$NVIDIA" = true ] && TITLE="SparkOS NVIDIA installer"
          gh release view "$RELEASE" >/dev/null 2>&1 || \
            gh release create "$RELEASE" --draft --target main --title "$TITLE" --notes "Building..." --latest=false
          gh release upload "$RELEASE" "$ISO_NAME".part* join-iso.cmd join-iso.sh SHA256SUMS --clobber
          gh release edit "$RELEASE" --notes-file notes.md --title "$TITLE ($(date -u +%Y-%m-%d))"
          # Point the tag at the commit this ISO was built from, and if the release is already
          # public, publish it again so GitHub shows this build's date instead of the first one's.
          # A draft stays a draft: the owner publishes it by hand.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          if [ "$(gh release view "$RELEASE" --json isDraft --jq .isDraft)" = false ]; then
            gh release edit "$RELEASE" --draft=true
            # Only the main installer is marked as the repository's latest release
            if [ "$NVIDIA" = true ]; then gh release edit "$RELEASE" --draft=false
            else gh release edit "$RELEASE" --draft=false --latest; fi
          fi
          # Remove parts left over from an older, larger ISO
          keep=$(ls "$ISO_NAME".part* join-iso.cmd join-iso.sh SHA256SUMS)
          gh release view "$RELEASE" --json assets --jq '.assets[].name' | while read -r a; do
            grep -qxF "$a" <<<"$keep" || gh release delete-asset "$RELEASE" "$a" --yes
          done
