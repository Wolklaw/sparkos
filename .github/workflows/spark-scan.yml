name: spark-scan
# Spark Scan: scanning for SparkOS. Tested with SANE's own `test` scanner (sane-backends'
# libsane-test), through the real scanimage, since CI has no scanner.
#
# fedora:  runs the image build step (files/scripts/spark-scan.sh) in a plain Fedora
#          container, then the unit tests, the SANE test-scanner tests (scan, crop, 150/300/
#          600 dpi, colour/grey/B&W, the feeder, scanner errors, Cancel, multi-page PDF, a
#          scan turned and measured for straightening), the page edits on generated tilted
#          pages, the searchable-PDF tests with tesseract (one on a straightened page), and
#          the window tests under Xvfb; then --scan-to with --rotate, --straighten, --whiten.
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), runs the self-test, scans with the test scanner to a
#          searchable PDF and to a turned, straightened, whitened one, runs the tests on the image's own Python and SANE, uninstalls it,
#          and checks nothing is left behind and /usr is untouched.
on:
  push:
    paths:
      - "files/spark-scan/**"
      - "files/scripts/spark-scan.sh"
      - ".github/workflows/spark-scan.yml"
  pull_request:
    paths:
      - "files/spark-scan/**"
      - "files/scripts/spark-scan.sh"
      - ".github/workflows/spark-scan.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-scan.sh

      - name: Self-test
        run: spark-scan --self-test

      - name: Tests (SANE test scanner, tesseract, Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth \
            poppler-utils qpdf
          cd files/spark-scan
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v 2>&1 \
            | tee tests.log
          grep -q '^OK' tests.log
          # the scanner, OCR and window tests must have run here, not been skipped
          if grep -E "skipped .needs" tests.log; then echo "tests were skipped"; exit 1; fi

      - name: Scan with the test scanner from the command line
        run: |
          conf=$(mktemp -d); printf 'test\n' > "$conf/dll.conf"
          export SANE_CONFIG_DIR="$conf"
          spark-scan --list
          spark-scan --scan-to /tmp/two-pages.pdf --device test:0 --pages 2 --dpi 300 \
            --mode color --area 0,0,0.5,0.5 --sane-option test-picture=Grid
          pdfinfo /tmp/two-pages.pdf
          qpdf --check /tmp/two-pages.pdf
          spark-scan --scan-to /tmp/feeder.pdf --device test:0 --source feeder --dpi 150 \
            --mode bw --sane-option test-picture=Grid
          pdfinfo /tmp/feeder.pdf | grep -q '^Pages: *10$'
          # page edits: 100 x 50 mm turned a quarter comes out 50 wide, 100 tall (141.6 x 283.2 pt)
          spark-scan --scan-to /tmp/turned.pdf --device test:0 --dpi 150 --mode color \
            --area 0,0,0.5,0.25 --rotate 90 --straighten --whiten \
            --sane-option test-picture=Grid | tee /tmp/turned.log
          grep -q 'turned 90, already straight, paper whitened' /tmp/turned.log
          pdfinfo /tmp/turned.pdf | grep -Eq '^Page size: +14[0-9](\.[0-9]+)? x 28[0-9]'
          { echo '### Spark Scan with SANE'"'"'s test scanner'; echo '```'; pdfinfo /tmp/two-pages.pdf; \
            ls -l /tmp/two-pages.pdf /tmp/feeder.pdf; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, scan, test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-scan:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-scan"
            chown -R tester: "$home/spark-scan"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester LOGNAME=tester \
                    PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 ${SANE:+SANE_CONFIG_DIR=$SANE} \
                    bash -c "$1"); }
            echo "--- what the image has"
            rpm -q sane-backends sane-backends-drivers-scanners sane-airscan tesseract \
                   tesseract-langpack-fra python3-pillow-tk poppler-utils
            # after rpm, which touches its database under /usr/lib/sysimage
            find /usr -newer /etc/hostname 2>/dev/null | sort > /tmp/usr-before

            echo "--- install --user"
            as "bash ~/spark-scan/install.sh --user"
            as "test -x ~/.local/bin/spark-scan"
            as "grep -q \"^Exec=$home/.local/bin/spark-scan$\" ~/.local/share/applications/dev.wolklaw.SparkScan.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkScan.png"
            # no "test ! -e /usr/..." here: the image ships this app system-wide; the /usr check proves the user install left /usr alone

            echo "--- with only SANE'"'"'s test scanner enabled (the container has no D-Bus, and"
            echo "    some of the image'"'"'s backends abort scanimage without it)"
            SANE=$(mktemp -d); printf "test\n" > "$SANE/dll.conf"; chmod -R a+rX "$SANE"
            as "~/.local/bin/spark-scan --self-test --device test:0"
            as "mkdir -p ~/out && ~/.local/bin/spark-scan --scan-to ~/out/scan.pdf --device test:0 \
                --pages 2 --dpi 150 --area 0,0,0.5,0.5 --ocr --sane-option test-picture=Grid"
            as "pdfinfo ~/out/scan.pdf | grep -q \"^Pages: *2$\""
            as "~/.local/bin/spark-scan --scan-to ~/out/turned.pdf --device test:0 --dpi 150 \
                --area 0,0,0.5,0.25 --rotate 90 --straighten --whiten \
                --sane-option test-picture=Grid > ~/turned.log"
            as "grep -q \"turned 90, already straight, paper whitened\" ~/turned.log"
            as "pdfinfo ~/out/turned.pdf | grep -Eq \"^Page size: +14[0-9](\.[0-9]+)? x 28[0-9]\""
            as "cd ~/spark-scan && python3 -m unittest discover -s tests -v 2>&1 | tee ~/tests.log; grep -q ^OK ~/tests.log"
            as "! grep -E \"skipped .needs (scanimage|tesseract)\" ~/tests.log"
            unset SANE

            echo "--- uninstall"
            as "bash ~/spark-scan/install.sh --user --uninstall"
            # the log in ~/.local/state stays, like settings and scans (see install.sh)
            left=$(as "find ~/.local -path ~/.local/state -prune -o \( -iname \"*spark*scan*\" -o -iname \"*SparkScan*\" \) -print" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            find /usr -newer /etc/hostname 2>/dev/null | sort > /tmp/usr-after
            diff /tmp/usr-before /tmp/usr-after || { echo "/usr changed"; exit 1; }
            echo "installed, scanned, tested and removed without root"
          '
