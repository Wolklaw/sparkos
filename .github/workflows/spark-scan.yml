name: spark-scan
on:
  push:
    paths:
      - "files/spark-scan/**"
      - "files/scripts/spark-scan.sh"
      - ".github/workflows/spark-scan.yml"
  workflow_dispatch:

jobs:
  probe-fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - run: |
          dnf -y install --setopt=install_weak_deps=False sane-backends sane-backends-drivers-scanners tesseract python3-pillow python3-tkinter || true
          rpm -qf /usr/bin/scanimage || true
          rpm -ql sane-backends-drivers-scanners | grep -E "test|pixma" || true
          grep -n "test\|pixma\|airscan" /etc/sane.d/dll.conf || true
          ls /etc/sane.d/dll.d || true
          scanimage --version || true
          scanimage -L || true
          scanimage -d test -A || true
          scanimage -d test:0 --help 2>&1 | tail -60 || true
          cat /etc/sane.d/test.conf || true
          tesseract --version; tesseract --list-langs || true
          dnf repoquery python3-sane img2pdf 2>/dev/null || true
  probe-sparkos:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read }
    steps:
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3; do sudo podman pull -q ghcr.io/wolklaw/sparkos:latest && break; sleep 30; done
          sudo podman run --rm ghcr.io/wolklaw/sparkos:latest bash -c '
            rpm -q sane-backends sane-backends-drivers-scanners sane-airscan python3-sane tesseract tesseract-langpack-fra python3-pillow python3-pillow-tk python3-tkinter xdg-user-dirs img2pdf python3-img2pdf python3-pypdf ghostscript qpdf poppler-utils || true
            command -v scanimage xdg-user-dir tesseract gs qpdf pdfunite || true
            python3 --version; python3 -c "import tkinter, PIL; print(tkinter.TkVersion, PIL.__version__)"
            python3 -c "import sane" || true
            python3 -c "from PIL import ImageTk; print(\"imagetk ok\")" || true
            ls /usr/lib64/sane | tr "\n" " "; echo
            grep -n "^test\|^#test\|pixma\|airscan" /etc/sane.d/dll.conf /etc/sane.d/dll.d/* || true
            scanimage --version || true
            scanimage -L || true
            scanimage -d test -A || true
            tesseract --version; tesseract --list-langs || true
          '
