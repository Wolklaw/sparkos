name: spark-games
# Spark Games is optional (the future Spark Portal will list it); it is not in the image.
#
# fedora:  installs it system-wide in a plain Fedora container, runs the self-test and the unit
#          and UI tests under Xvfb, then installs and removes it for a normal user.
# sparkos: inside the published SparkOS image, as a normal user with no root: install.sh --user,
#          --self-test, then --uninstall, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-games/**"
      - ".github/workflows/spark-games.yml"
  pull_request:
    paths:
      - "files/spark-games/**"
      - ".github/workflows/spark-games.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install (system-wide, with --deps)
        run: bash files/spark-games/install.sh --deps

      - name: Self-test
        run: spark-games --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-games
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Install and remove for a normal user
        run: |
          dnf -y install --setopt=install_weak_deps=False shadow-utils util-linux
          bash files/spark-games/install.sh --uninstall
          useradd -m tester
          cp -r files/spark-games /home/tester/src && chown -R tester: /home/tester/src
          runuser -u tester -- bash -euxc '
            bash ~/src/install.sh --user
            ~/.local/bin/spark-games --self-test
            bash ~/src/install.sh --user --uninstall
            test ! -e ~/.local/bin/spark-games && test ! -e ~/.local/lib/spark-games
            left=$(find ~/.local -type f)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi'

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test and uninstall as a normal user (no root, no network)
        run: |
          sudo podman run --rm --network=none -v "$PWD/files/spark-games:/src:ro" "$IMAGE" bash -euxc '
            # it must not be in the image: it is optional
            test ! -e /usr/bin/spark-games
            useradd -m tester
            runuser -u tester -- bash -euxc "
              cp -r /src ~/spark-games-src
              bash ~/spark-games-src/install.sh --user
              test -x ~/.local/bin/spark-games
              test -f ~/.local/share/applications/dev.wolklaw.SparkGames.desktop
              ~/.local/bin/spark-games --version
              ~/.local/bin/spark-games --self-test
              bash ~/spark-games-src/install.sh --user --uninstall
              test ! -e ~/.local/bin/spark-games
              test ! -e ~/.local/lib/spark-games
              test ! -e ~/.local/share/applications/dev.wolklaw.SparkGames.desktop
              left=\$(find ~/.local -type f)
              if [ -n \"\$left\" ]; then echo left behind:; echo \"\$left\"; exit 1; fi
            "'
