name: spark-controller
# Spark Controller ships in the SparkOS image (files/scripts/spark-controller.sh). It installs
# system-wide only: a root service sets the fan speeds and polkit guards saving a curve.
#
# fedora: runs the image build step in a plain Fedora container (installs liquidctl, OpenRGB,
#         polkit and fwupd with dnf), then the self-test and the unit tests (English and French;
#         the window tests run under Xvfb), and checks the uninstall leaves nothing in /usr.
#         There is no fan, lighting controller or firmware on a CI runner: the tests use a fake
#         /sys/class/hwmon tree, a fake liquidctl and recorded fwupd output.
on:
  push:
    paths:
      - "files/spark-controller/**"
      - "files/scripts/spark-controller.sh"
      - ".github/workflows/spark-controller.yml"
  pull_request:
    paths:
      - "files/spark-controller/**"
      - "files/scripts/spark-controller.sh"
      - ".github/workflows/spark-controller.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-controller.sh

      - name: Self-test
        run: |
          spark-controller --self-test
          spark-controller-daemon --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-controller
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr)
        run: |
          cd files/spark-controller
          SPARK_LANG=fr xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Uninstall, and check nothing is left
        run: |
          bash files/spark-controller/install.sh --uninstall
          left=$(find /usr /etc -iname '*spark-controller*' -o -iname '*SparkController*' 2>/dev/null || true)
          if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
          test ! -e /usr/lib/modules-load.d/sparkos-nct6775.conf
