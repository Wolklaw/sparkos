name: boot-test
# Boots the published SparkOS image in a real VM (QEMU + KVM) and checks it.
#
# Quick run (after every image build): system name and update signing, only SparkOS's own apps
# present, Spark Media, and boot/idle measurements.
# Full run (Sundays, or by hand with "full"): everything, including the checks that have passed
# many times (Soot/FreeSuite, printing, startup sound, Claude Code, Spark Snip, Windows-style
# installs), so a Fedora update that breaks one is still caught within the week.
# Update test (by hand, "update_from"): installs that tag, updates it to the tested one the way
# a PC does (signed rebase, reboot), then runs the checks on the updated system.
#
# SparkOS is built on Fedora's base-atomic (since 2026-11-26; Fedora Kinoite and Bazzite before
# that), with no KDE (files/scripts/sparkos-no-kde.sh): no Plasma, KWin or KDE apps.
# greetd with the Spark Greeter signs in, and the Spark session (spark-compositor + Spark Shell)
# is the desktop.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 10 * * 0" # Sundays, after the daily image build
  workflow_call:
    inputs:
      image:
        type: string
        default: sparkos
      image_tag:
        type: string
        default: latest
      full:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Run every check, not just the quick set
        type: boolean
        default: true
      image:
        description: Which image (sparkos-nvidia boots without an Nvidia GPU in the VM, so its driver isn't exercised)
        type: choice
        options: [sparkos, sparkos-nvidia]
        default: sparkos
      image_tag:
        description: Image tag to test (a branch build is br-<branch>-<Fedora version>)
        type: string
        default: latest
      update_from:
        description: Install this tag first, then update to the tested one the way a PC does (empty = install the tested tag directly)
        type: string
        default: ""
      spark_update_test:
        description: At the end, let Spark Update download, stage and boot the real latest (test a branch image; the VM thinks it runs an older latest)
        type: boolean
        default: false

concurrency:
  # One queue per branch: main's runs (after builds, Sundays) never cancel a branch test waiting
  # in line, or the other way round
  group: boot-test-${{ github.ref }}-${{ inputs.image || 'sparkos' }}
  cancel-in-progress: false # a newer build waits for the running test instead of killing it

jobs:
  boot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      # inputs.* are empty after a build (workflow_run) and on Sundays (schedule): sparkos:latest
      REPO: ghcr.io/wolklaw/${{ inputs.image || 'sparkos' }}
      IMAGE: ghcr.io/wolklaw/${{ inputs.image || 'sparkos' }}:${{ inputs.image_tag || 'latest' }}
      UPDATE_FROM: ${{ inputs.update_from || '' }}
      SPARK_UPDATE_TEST: ${{ inputs.spark_update_test == true }}
      WORK: /mnt/boot-test
      FULL: ${{ inputs.full == true || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      # Runners since 2026-11-22 have one 72 GB disk (no separate /mnt). The pulled image,
      # image-builder's working tree and the qcow2 need more than the 45 GB left free, so the
      # same cleanup installer-iso.yml uses (large packages and the swap file too)
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Make the work folder
        run: |
          # What the action above leaves: toolchains this test never uses
          sudo rm -rf /usr/lib/jvm /usr/local/lib/node_modules /usr/local/julia* /usr/share/miniconda \
                      /opt/az /opt/microsoft /opt/google /opt/pipx /usr/local/share/chromium \
                      /usr/local/share/powershell /usr/local/aws-cli /usr/local/share/vcpkg
          sudo docker system prune -af >/dev/null || true
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt

      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf socat >/dev/null
          ls -l /dev/kvm

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'
          # Update test: the disk is installed from UPDATE_FROM, then updated to IMAGE
          INSTALL=$IMAGE
          if [ -n "$UPDATE_FROM" ]; then
            INSTALL=$REPO:$UPDATE_FROM
            for i in 1 2 3 4 5; do sudo podman pull -q "$INSTALL" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
            sudo podman image inspect "$INSTALL" --format '{{.Digest}} {{.Created}}'
          fi
          # Spark Update test: install the tested image under the name latest (only in this
          # runner's storage), so the VM follows latest like a real PC and the real latest in
          # the registry is an update for it
          if [ "$SPARK_UPDATE_TEST" = true ]; then
            [ -z "$UPDATE_FROM" ] || { echo "::error::use update_from or spark_update_test, not both"; exit 1; }
            [ "$IMAGE" != "$REPO:latest" ] || { echo "::error::spark_update_test needs a branch image (image_tag)"; exit 1; }
            sudo podman tag "$IMAGE" "$REPO:latest"
            INSTALL=$REPO:latest
          fi
          echo "INSTALL=$INSTALL" >> "$GITHUB_ENV"
          echo "Installing $INSTALL, testing $IMAGE"

      - name: Build a test disk image
        run: |
          ssh-keygen -q -t ed25519 -N "" -C sparkos-boot-test -f "$WORK/id"
          cat > "$WORK/blueprint.toml" <<EOF
          [[customizations.user]]
          name = "spark"
          key = "$(cat "$WORK/id.pub")"
          # Throwaway test disk only: a password so the checks can use sudo
          password = "sparkos-boot-test"
          groups = ["wheel"]

          # SparkOS ships with sshd off. Start it on this
          # test disk only, through a kernel argument.
          [customizations.kernel]
          append = "systemd.wants=sshd.service rhgb quiet"
          EOF
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$WORK/blueprint.toml":/blueprint.toml:ro \
            -v "$WORK/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build --blueprint /blueprint.toml --output-dir /output \
            --bootc-ref "$INSTALL" --bootc-default-fs btrfs qcow2
          sudo chown -R "$USER" "$WORK/output"
          DISK=$(find "$WORK/output" -name '*.qcow2' | head -1)
          test -n "$DISK" || { echo "no qcow2 produced"; find "$WORK/output"; exit 1; }
          echo "DISK=$DISK" >> "$GITHUB_ENV"
          ls -lh "$DISK"
          # SparkOS's firewall zone doesn't allow SSH, and QEMU's port forward arrives on the
          # network like any other device. Open it for this boot only (runtime, not saved), before
          # sshd starts, through a sshd drop-in passed as a systemd credential (SMBIOS type 11).
          # Nothing is added to the disk or the zone files, so the firewall checks see SparkOS as shipped.
          printf '%s\n' '[Unit]' 'Wants=firewalld.service' 'After=firewalld.service' \
            '[Service]' 'ExecStartPre=-/usr/bin/firewall-cmd --add-service=ssh' > "$WORK/sshd-dropin.conf"
          echo "SSH_DROPIN=$(base64 -w0 "$WORK/sshd-dropin.conf")" >> "$GITHUB_ENV"

      - name: Build a Windows test drive
        # GPT with NTFS C: (registry file naming the letters, a Claude Code profile), D: "Scrap", E: "Games" (a Git repository);
        # sparkos-windows-drives must mount it at /var/mnt/<letter>. Built here, attached to the VM below
        run: |
          sudo bash .github/scripts/windows-drives/make_disk.sh "$WORK/windows.img"
          sudo chown "$USER" "$WORK/windows.img"

      - name: Boot it
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$WORK/vars.fd"
          qemu-system-x86_64 -enable-kvm -cpu host -machine q35 -smp 4 -m 8192 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="$WORK/vars.fd" \
            -drive file="$DISK",if=virtio,format=qcow2 \
            -drive file="$WORK/windows.img",if=virtio,format=raw \
            -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22 \
            -smbios "type=11,value=io.systemd.credential.binary:systemd.unit-dropin.sshd.service=$SSH_DROPIN" \
            -vga virtio -display none \
            -serial file:"$WORK/serial.log" \
            -monitor unix:"$WORK/qmon",server,nowait \
            -daemonize -pidfile "$WORK/qemu.pid"
          echo "QEMU started"
          mkdir -p "$WORK/shots"
          # If the first boot restarts, watch the serial log for GRUB's second "Booting `SparkOS" and photograph the
          # next 15 s, once a second.
          # Not a check: the pictures are for looking at the splash. Runs in the background.
          nohup bash -c '
            booted() { [ "$(grep -ac "Booting .SparkOS" "$WORK/serial.log" 2>/dev/null)" -ge 2 ]; }
            for i in $(seq 1 1800); do booted && break; sleep 0.5; done
            booted || { echo "no second boot within 15 minutes"; exit 0; }
            echo "second boot seen at $(date +%T)"
            for n in $(seq 1 15); do
              sleep 1
              echo "screendump $WORK/shots/0b-boot2-${n}s.png -f png" | socat - UNIX-CONNECT:"$WORK/qmon" || true
            done
            echo "done at $(date +%T)"' > "$WORK/boot2-shots.txt" 2>&1 &
          # Try to catch the first boot's splash (firmware and boot menu take the first seconds)
          for t in $(seq 2 2 30); do
            sleep 2
            echo "screendump $WORK/shots/0-boot-${t}s.png -f png" | socat - UNIX-CONNECT:"$WORK/qmon" || true
          done

      - name: Wait for SSH
        id: ssh
        run: |
          SSH="ssh -i $WORK/id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR -p 2222 spark@127.0.0.1"
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if $SSH true 2>/dev/null; then echo "SSH up after ~$((i*10))s"; exit 0; fi
            sleep 10
          done
          echo "SSH never came up"; tail -50 "$WORK/serial.log"; exit 1

      - name: Update to the image under test
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.UPDATE_FROM != '' }}
        run: |
          $SSH 'rpm-ostree status --booted; df -h /sysroot'
          # The same transport and signature check a SparkOS PC uses for its updates (rebase
          # instead of upgrade only because the tested image has another tag)
          ok=0
          for i in 1 2 3 4 5 6; do
            if $SSH "echo sparkos-boot-test | sudo -S -p '' rpm-ostree rebase ostree-image-signed:docker://$IMAGE"; then ok=1; break; fi
            echo "rebase failed (another transaction running?), retry $i"; sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::the update to $IMAGE failed"; exit 1; }
          $SSH "echo sparkos-boot-test | sudo -S -p '' systemctl reboot" || true
          sleep 30
          up=0
          for i in $(seq 1 90); do if $SSH true 2>/dev/null; then up=1; echo "back after the update, ~$((i*10+30))s"; break; fi; sleep 10; done
          [ "$up" = 1 ] || { echo "::error::no SSH after rebooting into the update"; tail -50 "$WORK/serial.log"; exit 1; }
          $SSH 'rpm-ostree status --booted' | tee "$WORK/after-update.txt"
          grep -q "ostree-image-signed:docker://$IMAGE" "$WORK/after-update.txt"
          WANT=$(sudo podman image inspect "$IMAGE" --format '{{.Digest}}')
          grep -q "$WANT" "$WORK/after-update.txt" || { echo "::error::the booted image isn't $WANT"; exit 1; }
          echo "Updated from $UPDATE_FROM to $IMAGE ($WANT) and booted it"

      - name: Screenshot after boot
        if: always()
        run: |
          mkdir -p "$WORK/shots"
          sleep 30
          echo "screendump $WORK/shots/1-after-boot.png -f png" | socat - UNIX-CONNECT:"$WORK/qmon" || true

      - name: Check system name, image and signing
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          $SSH 'cat /etc/os-release' | tee "$WORK/os-release.txt"
          grep -q '^NAME="SparkOS"$' "$WORK/os-release.txt"
          $SSH 'rpm-ostree status' | tee "$WORK/rpm-ostree-status.txt"
          grep -q "$REPO" "$WORK/rpm-ostree-status.txt"
          grep -q "ostree-image-signed:docker://$REPO" "$WORK/rpm-ostree-status.txt"
          # The policy entry must match the (lowercase) image name exactly, or updates aren't verified
          $SSH "jq -c '.transports.docker[\"$REPO\"]' /etc/containers/policy.json; ls -l /etc/pki/containers/" | tee "$WORK/policy.txt"
          grep -q '"sigstoreSigned"' "$WORK/policy.txt"
          grep -q "${REPO##*/}.pub" "$WORK/policy.txt"
          # rpm-ostree and bootc refuse signed updates while the default accepts anything
          $SSH "jq -c '.default' /etc/containers/policy.json" | tee -a "$WORK/policy.txt" | grep -q '"reject"'
          $SSH "jq -e '.transports.docker[\"\"][0].type == \"insecureAcceptAnything\"' /etc/containers/policy.json"
          $SSH "echo sparkos-boot-test | sudo -S -p '' rpm-ostree upgrade --check" 2>&1 | tee "$WORK/upgrade-check.txt" || true
          ! grep -q 'refusing usage' "$WORK/upgrade-check.txt"
          $SSH 'rpm -q steam lutris gamescope mangohud 2>&1; flatpak --version'

      - name: Check Soot and FreeSuite
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.FULL == 'true' }}
        run: |
          # Installed, with no missing libraries
          $SSH 'set -e; ls -l /usr/bin/soot /usr/bin/freesuite; readlink -f /usr/bin/soot /usr/bin/freesuite; ls -l /var/opt/freesuite'
          # The engine's own libraries (libmozsandbox, libgkcodecs, ...) sit next to libxul.so with
          # no RPATH: the firefox binary loads them from its folder first (dependentlibs.list), so
          # ldd looks there too. Anything still missing would be missing at run time.
          $SSH 'LD_LIBRARY_PATH=/usr/lib/soot/engine ldd /usr/lib/soot/engine/libxul.so | grep "not found" || echo "soot: no missing libraries"' | tee "$WORK/soot-ldd.txt"
          $SSH 'ldd /usr/lib/opt/freesuite/freesuite-bin | grep "not found" || echo "freesuite: no missing libraries"' | tee "$WORK/freesuite-ldd.txt"
          # (a bare "! grep" doesn't stop a bash -e step, so fail explicitly)
          if grep -q 'not found' "$WORK/soot-ldd.txt" "$WORK/freesuite-ldd.txt"; then
            echo "::error::Soot or FreeSuite is missing a library"; exit 1
          fi
          $SSH 'stat -c "%A %U %n" /usr/lib/opt/freesuite/chrome-sandbox'
          # Default apps, as the user sees them
          $SSH 'for m in x-scheme-handler/https text/html x-scheme-handler/mailto application/pdf application/vnd.openxmlformats-officedocument.wordprocessingml.document application/msword application/vnd.ms-excel application/vnd.ms-powerpoint application/vnd.oasis.opendocument.text; do printf "%s -> " $m; xdg-mime query default $m; done' | tee "$WORK/defaults.txt"
          grep -q 'x-scheme-handler/https -> dev.wolklaw.Soot.desktop' "$WORK/defaults.txt"
          grep -q 'application/pdf -> freesuite-pdf.desktop' "$WORK/defaults.txt"
          grep -q 'application/vnd.ms-excel -> freesuite-sheets.desktop' "$WORK/defaults.txt"
          grep -q 'application/msword -> freesuite-writer.desktop' "$WORK/defaults.txt"
          grep -q 'application/vnd.ms-powerpoint -> freesuite-slides.desktop' "$WORK/defaults.txt"
          # FreeSuite's own desktop entries claim the old formats too (0.4.1+)
          $SSH 'grep -l "application/vnd.ms-excel" /usr/share/applications/freesuite-sheets.desktop'
          # Soot's own headless smoke test, from the same pinned commit
          SOOT_RELEASE=$($SSH 'cat /usr/lib/soot/SOOT_RELEASE')
          echo "Soot in the image: $SOOT_RELEASE"
          curl -fsSL -o "$WORK/smoke-test.py" "https://raw.githubusercontent.com/Wolklaw/Soot/$SOOT_RELEASE/linux/smoke-test.py"
          scp -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 "$WORK/smoke-test.py" spark@127.0.0.1:/tmp/smoke-test.py
          $SSH 'python3 /tmp/smoke-test.py --soot /usr/bin/soot' 2>&1 | tee "$WORK/soot-smoke-test.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::Soot's smoke test failed"; exit 1; }

      - name: Check printing, scanning and devices
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.FULL == 'true' }}
        run: |
          $SSH 'rpm -q cups cups-browsed ipp-usb sane-airscan sane-backends-drivers-scanners libratbag-ratbagd fuse-sshfs rclone' | tee "$WORK/devices.txt"
          if grep -q 'not installed' "$WORK/devices.txt"; then
            echo "::error::a printing, scanning or device package is not installed"; exit 1
          fi
          # One unit at a time: with several, is-enabled succeeds when any one of them is enabled
          $SSH 'set -e; ls /usr/lib/cups/backend/driverless; for u in cups.socket avahi-daemon.service bluetooth.service; do s=$(systemctl is-enabled $u); echo "$u: $s"; done'
          $SSH 'test -f /usr/lib/udev/rules.d/60-sparkos-via-keyboards.rules && test -x /usr/bin/sparkos-dev-setup && echo "VIA rule and sparkos-dev-setup present"'

      - name: Check the out-of-tree kernel modules
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.FULL == 'true' }}
        run: |
          # build_files/kmods.sh builds them for the image's
          # kernel. The ones loaded at boot must be loaded (the VM boots without Secure Boot, like
          # the owner's PC), and the others must load by hand.
          $SSH 'uname -r; systemctl is-failed systemd-modules-load.service; lsmod' | tee "$WORK/kmods.txt"
          for m in v4l2loopback vhba ryzen_smu hid_fanatec hid_logitech_new hid_tmff_new; do
            grep -q "^$m " "$WORK/kmods.txt" || { echo "::error::$m is not loaded at boot"; exit 1; }
          done
          # Nothing in SparkOS's list may fail to load
          if grep -qx 'failed' "$WORK/kmods.txt"; then
            echo "::error::systemd-modules-load failed"; exit 1
          fi
          $SSH 'echo sparkos-boot-test | sudo -S -p "" sh -c "modprobe -a xone_dongle xone_gip_gamepad hid-tminit-new usb-tminit-new && lsmod"' | tee "$WORK/kmods-by-hand.txt"
          for m in xone_dongle xone_gip_gamepad hid_tminit_new usb_tminit_new; do
            grep -q "^$m " "$WORK/kmods-by-hand.txt" || { echo "::error::$m doesn't load"; exit 1; }
          done
          # zenergy only loads on a Ryzen it knows (the runner's CPU may not be one): check it's
          # there and for this kernel
          $SSH 'test "$(modinfo -F vermagic zenergy | cut -d" " -f1)" = "$(uname -r)" && echo "zenergy is for $(uname -r)"'
          $SSH 'set -e; ls /dev/video* /dev/vhba_ctl; ls /usr/lib/firmware/ | grep -E "^(xone|xow)_dongle"'

      - name: Check the startup sound
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.FULL == 'true' }}
        run: |
          $SSH 'test -s /usr/share/sounds/sparkos/startup.wav && test -x /usr/bin/sparkos-startup-sound && test -f /etc/xdg/autostart/sparkos-startup-sound.desktop && echo "startup sound present"'
          $SSH 'test -s /usr/share/pipewire/pipewire.conf.d/10-sparkos-sample-rates.conf && grep -q "default.clock.allowed-rates" /usr/share/pipewire/pipewire.conf.d/10-sparkos-sample-rates.conf && fc-match "Noto Sans CJK SC" family | grep -q "Noto Sans CJK" && echo "sample rates and CJK fonts present"'
          $SSH 'sparkos-startup-sound --off && test -e ~/.config/sparkos/startup-sound-off && sparkos-startup-sound --on && test ! -e ~/.config/sparkos/startup-sound-off && echo "off/on switch works"'

      - name: Check Claude Code setup
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.FULL == 'true' }}
        run: |
          $SSH 'rpm -q socat bubblewrap vte291-gtk4 && test -x /usr/bin/spark-terminal && test -x /usr/bin/spark-ask' | tee "$WORK/claude-deps.txt"
          if [ "${PIPESTATUS[0]}" != 0 ] || grep -q 'not installed' "$WORK/claude-deps.txt"; then
            echo "::error::a package Claude Code needs is not installed, or Spark Terminal or spark-ask is missing"; exit 1
          fi
          $SSH 'set -e; for f in /usr/bin/sparkos-claude /usr/bin/sparkos-claude-import /usr/bin/sparkos-dev-setup; do test -x $f || { echo "missing $f"; exit 1; }; done
                test -f /usr/share/applications/sparkos-claude-code.desktop
                command -v desktop-file-validate >/dev/null && desktop-file-validate /usr/share/applications/sparkos-claude-code.desktop
                echo "launchers present"'
          # Install Claude Code the way a user would, then run it (no sign-in needed for --version)
          $SSH 'sparkos-dev-setup --claude && ~/.local/bin/claude --version' 2>&1 | tee "$WORK/claude-install.txt"
          $SSH '~/.local/bin/claude --version' | grep -qiE '[0-9]+\.[0-9]+'

      - name: Check the Windows drives
        # sparkos-windows-drives mounted the test drive at /var/mnt/c, d, e at boot: letters from the registry file, owned by
        # the user, D: read-only by the shipped conf, and /run/sparkos/windows-drives.json (what Nova reads) lists them
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          $SSH 'state=$(systemctl is-active sparkos-windows-drives.service); echo "$state"; journalctl -b -u sparkos-windows-drives --no-pager -o cat; [ "$state" = active ]' \
            | tee "$WORK/windows-drives.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::sparkos-windows-drives.service is not active"; exit 1; }
          $SSH 'bash -s spark' < .github/scripts/windows-drives/check_mounts.sh 2>&1 | tee -a "$WORK/windows-drives.txt"
          test "${PIPESTATUS[0]}" = 0

      - name: Check Spark Snip
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.FULL == 'true' }}
        run: |
          # Installed, shortcuts registered (Spark's own entries, read by the compositor), Spectacle gone
          $SSH 'set -e; spark-snip --version; ls -l /usr/bin/spark-snip /usr/share/kglobalaccel/dev.wolklaw.SparkSnip.desktop'
          $SSH 'grep -H "^X-KDE-Shortcuts=" /usr/share/applications/dev.wolklaw.SparkSnip.desktop' | tee "$WORK/shortcuts.txt"
          grep -q 'SparkSnip.desktop:X-KDE-Shortcuts=Print,Meta+Shift+S' "$WORK/shortcuts.txt"
          if $SSH 'rpm -q spectacle'; then echo "::error::Spectacle is back in the image"; exit 1; fi
          # OCR in English and French, and a test video through each installed encoder
          $SSH 'spark-snip --self-test' 2>&1 | tee "$WORK/spark-snip-self-test.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::Spark Snip's self-test failed"; exit 1; }

      - name: Check Spark Media
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Photos, videos and music open in Spark Media out of the box
          $SSH 'set -e; spark-media --version; ls -l /usr/bin/spark-media /usr/share/applications/dev.wolklaw.SparkMedia.desktop'
          $SSH 'for m in image/jpeg image/png image/heic image/webp video/mp4 video/x-matroska video/webm audio/mpeg audio/flac audio/mp4 audio/ogg; do printf "%s -> " $m; xdg-mime query default $m; done' | tee "$WORK/media-defaults.txt"
          if grep -v -- '-> dev.wolklaw.SparkMedia.desktop$' "$WORK/media-defaults.txt"; then
            echo "::error::these types don't open in Spark Media"; exit 1
          fi
          # Photo formats, H.264/H.265/AAC/MP3 decoders, test files played to the end, a video thumbnail
          $SSH 'spark-media --self-test --require h264,h265,aac,mp3' 2>&1 | tee "$WORK/spark-media-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-media-self-test.txt"

      - name: Check Spark Welcome
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Opens once at each new user's first login (autostart), then stays in the menu
          $SSH 'set -e; spark-welcome --version; ls -l /usr/bin/spark-welcome /usr/share/applications/dev.wolklaw.SparkWelcome.desktop /etc/xdg/autostart/dev.wolklaw.SparkWelcome.desktop'
          $SSH 'spark-welcome --self-test' 2>&1 | tee "$WORK/spark-welcome-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-welcome-self-test.txt"

      - name: Check Spark Games
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          $SSH 'set -e; spark-games --version; ls -l /usr/bin/spark-games /usr/share/applications/dev.wolklaw.SparkGames.desktop'
          $SSH 'spark-games --self-test' 2>&1 | tee "$WORK/spark-games-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-games-self-test.txt"

      - name: Check Spark Monitor
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Task manager on Ctrl+Shift+Esc; the self-test reads the live /proc and /sys
          $SSH 'set -e; spark-monitor --version; ls -l /usr/bin/spark-monitor; grep -H "^X-KDE-Shortcuts=" /usr/share/applications/dev.wolklaw.SparkMonitor.desktop'
          $SSH 'spark-monitor --self-test' 2>&1 | tee "$WORK/spark-monitor-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-monitor-self-test.txt"

      - name: Check Spark Controller
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Fans, RGB and firmware: the files, the fan service unit, the sensor-chip module list;
          # the self-test reads the VM's /sys (no real fans there, so it checks it finds none
          # without failing)
          $SSH 'set -e; spark-controller --version; ls -l /usr/bin/spark-controller /usr/bin/spark-controller-daemon /usr/libexec/spark-controller-helper /usr/share/applications/dev.wolklaw.SparkController.desktop /usr/share/polkit-1/actions/dev.wolklaw.SparkController.policy'
          $SSH 'set -e; grep -qx nct6775 /usr/lib/modules-load.d/sparkos-nct6775.conf; systemctl is-enabled spark-controller.service; systemctl cat spark-controller.service >/dev/null; python3 -c "import liquidctl"; test -x /usr/bin/openrgb'
          $SSH 'spark-controller --self-test' 2>&1 | tee "$WORK/spark-controller-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-controller-self-test.txt"
          # Nothing is saved on a fresh system, so the service stays idle and no fan is touched
          $SSH 'test ! -e /etc/spark-controller/fans.json; ! systemctl is-active --quiet spark-controller.service'

      - name: Check Spark Firewall
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # The firewall in plain words, in firewall-config's place: the files, the polkit action,
          # a self-test that only reads firewalld, a helper that refuses a bad operation without
          # running anything, and firewall-config gone from the image
          $SSH 'set -e; spark-firewall --version; ls -l /usr/bin/spark-firewall /usr/libexec/spark-firewall-helper /usr/share/applications/dev.wolklaw.SparkFirewall.desktop /usr/share/polkit-1/actions/dev.wolklaw.SparkFirewall.policy'
          $SSH 'spark-firewall --self-test' 2>&1 | tee "$WORK/spark-firewall-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-firewall-self-test.txt"
          $SSH 'echo "{\"ops\": [{\"op\": \"service\", \"zone\": \"--reload\", \"name\": \"ssh\", \"add\": true}]}" | /usr/libexec/spark-firewall-helper apply; echo "exit $?"' 2>&1 | tee "$WORK/spark-firewall-refuse.txt"
          grep -q 'refused' "$WORK/spark-firewall-refuse.txt"
          grep -qx 'exit 2' "$WORK/spark-firewall-refuse.txt"
          $SSH 'rpm -q firewalld >/dev/null; ! rpm -q firewall-config; test ! -e /usr/share/applications/firewall-config.desktop'

      - name: Check Spark Backup
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Snapshots of /home: the files, the service and timer units, the polkit action; the
          # self-test only reads (it never creates or deletes a snapshot)
          $SSH 'set -e; spark-backup --version; ls -l /usr/bin/spark-backup /usr/libexec/spark-backup-helper /usr/share/applications/dev.wolklaw.SparkBackup.desktop /usr/share/polkit-1/actions/dev.wolklaw.SparkBackup.policy'
          $SSH 'set -e; systemctl cat spark-backup.service >/dev/null; systemctl cat spark-backup.timer >/dev/null'
          $SSH 'spark-backup --self-test' 2>&1 | tee "$WORK/spark-backup-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-backup-self-test.txt"
          # Nothing is saved on a fresh system, so the timer stays off and nothing is copied
          $SSH 'test ! -e /etc/spark-backup/config.json; ! systemctl is-enabled --quiet spark-backup.timer; ! systemctl is-active --quiet spark-backup.timer'

      - name: Check Spark Disks
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Drives and partitions: the files, then the self-test (lists the VM's drives, checks
          # the safety rules on made-up ones; it changes nothing), and GNOME Disks gone from the image
          $SSH 'set -e; spark-disks --version; ls -l /usr/bin/spark-disks /usr/share/applications/dev.wolklaw.SparkDisks.desktop; command -v udisksctl smartctl lsblk'
          $SSH 'spark-disks --self-test' 2>&1 | tee "$WORK/spark-disks-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-disks-self-test.txt"
          $SSH '! rpm -q gnome-disk-utility; test ! -e /usr/share/applications/org.gnome.DiskUtility.desktop'

      - name: Check Spark Files
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # The file manager: installed, self-test passes, the only org.freedesktop.FileManager1
          # provider ("Show in folder"), folders open in it, and Dolphin is not in the image
          $SSH 'set -e; spark-files --version; ls -l /usr/bin/spark-files /usr/share/applications/dev.wolklaw.SparkFiles.desktop /usr/share/dbus-1/services/dev.wolklaw.SparkFiles*.service'
          $SSH 'spark-files --self-test' 2>&1 | tee "$WORK/spark-files-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-files-self-test.txt"
          $SSH 'grep -lx "Name=org.freedesktop.FileManager1" /usr/share/dbus-1/services/*.service; xdg-mime query default inode/directory; rpm -q dolphin >/dev/null 2>&1 && echo dolphin-installed; test -e /usr/share/applications/org.kde.dolphin.desktop && echo dolphin-entry; true' | tee "$WORK/spark-files-takeover.txt"
          [ "$(grep -c 'FileManager1' "$WORK/spark-files-takeover.txt")" = 1 ] || { echo "::error::more than one FileManager1 provider"; exit 1; }
          grep -qx '/usr/share/dbus-1/services/dev.wolklaw.SparkFiles.FileManager1.service' "$WORK/spark-files-takeover.txt"
          if grep -q '^dolphin-' "$WORK/spark-files-takeover.txt"; then echo "::error::Dolphin is still in the image"; exit 1; fi
          grep -qx 'dev.wolklaw.SparkFiles.desktop' "$WORK/spark-files-takeover.txt" || { echo "::error::folders don't open in Spark Files"; exit 1; }

      - name: Check Spark Settings
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # The settings app: installed, self-test passes with every tool each page runs, and
          # KDE's System Settings is gone with its stand-ins (sparkos-no-kde.sh removes them)
          $SSH 'set -e; spark-settings --version; spark-settings --self-test --strict' 2>&1 | tee "$WORK/spark-settings-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-settings-self-test.txt"
          $SSH 'for f in /usr/bin/systemsettings /usr/bin/kcmshell6 /usr/libexec/sparkos/kde-settings /usr/share/applications/systemsettings.desktop; do test -e $f && echo "left: $f"; done; rpm -q plasma-systemsettings >/dev/null 2>&1 && echo "left: plasma-systemsettings"; true' | tee "$WORK/spark-settings-takeover.txt"
          if grep -q '^left: ' "$WORK/spark-settings-takeover.txt"; then echo "::error::KDE's System Settings is still in the image"; exit 1; fi

      - name: Check the SparkOS icon theme
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # installed, over Breeze Dark's artwork, and the default for a new user
          # (files/scripts/sparkos-icons.sh; no kreadconfig6 without KDE, so the file is read directly)
          $SSH 'sed -n "/^\[Icons\]/,/^\[/s/^Theme=//p" /etc/xdg/kdeglobals; sed -n "s/^Inherits=//p" /usr/share/icons/SparkOS/index.theme; test -s /usr/share/icons/SparkOS/places/scalable/folder.svg && echo folder' | tee "$WORK/icons.txt"
          diff <(printf 'SparkOS\nbreeze-dark,hicolor\nfolder\n') "$WORK/icons.txt" || { echo "::error::SparkOS is not the icon theme"; exit 1; }

      - name: Check the other Spark apps
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Edit, Calc, Fonts, Archive, Scan, Run, Link, Store, Terminal, Emoji, Notes, Boxes, Audio and Tray: installed system-wide, each self-test passes
          for app in spark-edit spark-calc spark-fonts spark-archive spark-scan spark-run spark-link spark-store spark-terminal spark-emoji spark-notes spark-boxes spark-audio spark-tray; do
            echo "== $app"
            $SSH "set -e; $app --version; $app --self-test" 2>&1 | tee "$WORK/$app-self-test.txt"
            grep -q '^self-test passed' "$WORK/$app-self-test.txt" || { echo "::error::$app self-test failed"; exit 1; }
          done
          # spark-share (Spark Connect's Take control): spark-rdp, openssl, loginctl and Tk are there
          echo "== spark-share"
          $SSH "set -e; spark-share --version; spark-share --self-test" 2>&1 | tee "$WORK/spark-share-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-share-self-test.txt" || { echo "::error::spark-share self-test failed"; exit 1; }
          # Optional Spark apps: only their sources ship, for the Store to install per user
          grep -q '(not installed, can install from /usr/share/spark-store/sources/spark-space)$' "$WORK/spark-store-self-test.txt" || { echo "::error::Spark Space's source isn't in the image"; exit 1; }
          $SSH 'test ! -e /usr/bin/spark-space && echo "Spark Space: source only, not installed"'
          # Extract/Compress right-click entries (SparkOS's own files in the kio servicemenus folder)
          $SSH 'ls /usr/share/kio/servicemenus/ | grep -i -E "spark"' | tee "$WORK/servicemenus.txt"
          grep -q 'dev.wolklaw.SparkArchive.extract.desktop' "$WORK/servicemenus.txt"
          grep -q 'dev.wolklaw.SparkArchive.compress.desktop' "$WORK/servicemenus.txt"
          # Spark Terminal is the default terminal; Konsole is gone
          $SSH 'sed -n "/^\[General\]/,/^\[/s/^TerminalApplication=//p" /etc/xdg/kdeglobals; xdg-terminal-exec --print-id; ! rpm -q konsole >/dev/null; test ! -e /usr/share/applications/org.kde.konsole.desktop' | tee "$WORK/terminal.txt"
          diff <(printf 'spark-terminal\ndev.wolklaw.SparkTerminal.desktop\n') "$WORK/terminal.txt"
          # Spark Emoji has Meta+. and no other entry claims it
          $SSH 'grep -c "^X-KDE-Shortcuts=Meta+\.$" /usr/share/applications/dev.wolklaw.SparkEmoji.desktop; test -L /usr/share/kglobalaccel/dev.wolklaw.SparkEmoji.desktop && echo linked; grep -l "^X-KDE-Shortcuts=\(.*,\)\?Meta+\.\(,\|$\)" /usr/share/applications/*.desktop | grep -v SparkEmoji | wc -l; test -e /usr/share/applications/org.kde.plasma.emojier.desktop && echo emojier-left; true' | tee "$WORK/emoji.txt"
          diff <(printf '1\nlinked\n0\n') "$WORK/emoji.txt" || { echo "::error::Meta+. is not Spark Emoji's"; exit 1; }
          # Spark Notes has Meta+V and its watcher is enabled for every login 
          $SSH 'grep -c "^X-KDE-Shortcuts=Meta+V$" /usr/share/applications/dev.wolklaw.SparkNotes.Clipboard.desktop; test -L /usr/share/kglobalaccel/dev.wolklaw.SparkNotes.Clipboard.desktop && echo linked; test -L /usr/lib/systemd/user/graphical-session.target.wants/spark-notes-clipboard.service && echo watcher-enabled; test -x /usr/bin/wl-paste && echo wl-paste' | tee "$WORK/notes.txt"
          diff <(printf '1\nlinked\nwatcher-enabled\nwl-paste\n') "$WORK/notes.txt" || { echo "::error::Meta+V is not Spark Notes'"; exit 1; }
          # Text and code open in Spark Edit, archives in Spark Archive
          $SSH 'for m in text/plain text/markdown application/json text/x-python application/zip application/x-7z-compressed application/x-compressed-tar application/vnd.rar application/x-cd-image; do printf "%s -> " $m; xdg-mime query default $m; done' | tee "$WORK/edit-archive-defaults.txt"
          for m in text/plain text/markdown application/json text/x-python; do
            grep -qx "$m -> dev.wolklaw.SparkEdit.desktop" "$WORK/edit-archive-defaults.txt" || { echo "::error::$m doesn't open in Spark Edit"; exit 1; }
          done
          for m in application/zip application/x-7z-compressed application/x-compressed-tar application/vnd.rar application/x-cd-image; do
            grep -qx "$m -> dev.wolklaw.SparkArchive.desktop" "$WORK/edit-archive-defaults.txt" || { echo "::error::$m doesn't open in Spark Archive"; exit 1; }
          done

      - name: Check Spark Update
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # updates never stop: Spark Update's own timer on, and the notification timer on
          $SSH 'set -e; spark-update --version; systemctl is-enabled spark-update.timer; systemctl is-active spark-update.timer; systemctl --global is-enabled spark-update-user.timer'
          $SSH 'spark-update --self-test' 2>&1 | tee "$WORK/spark-update-self-test.txt"
          grep -q '^self-test passed' "$WORK/spark-update-self-test.txt"
          grep -q '^updater:   Spark Update' "$WORK/spark-update-self-test.txt"
          grep -qF "image:     $REPO (from rpm-ostree status)" "$WORK/spark-update-self-test.txt"
          grep -q '^others:    no other automatic updater is on' "$WORK/spark-update-self-test.txt"
          $SSH 'spark-update --status'

      - name: Check the Release 2 cleanup
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Spark Monitor has Ctrl+Shift+Esc, Meta+Esc and Ctrl+Esc, and Plasma System Monitor is not there
          $SSH 'rpm -q plasma-systemmonitor 2>&1; grep -H "^X-KDE-Shortcuts=" /usr/share/kglobalaccel/*.desktop' | tee "$WORK/cleanup-monitor.txt"
          grep -q 'package plasma-systemmonitor is not installed' "$WORK/cleanup-monitor.txt" || { echo "::error::plasma-systemmonitor is installed"; exit 1; }
          grep -q 'dev.wolklaw.SparkMonitor.desktop:X-KDE-Shortcuts=Ctrl+Shift+Esc,Meta+Esc,Ctrl+Esc$' "$WORK/cleanup-monitor.txt"
          if grep -v 'SparkMonitor' "$WORK/cleanup-monitor.txt" | grep -E 'X-KDE-Shortcuts=(.*,)?(Ctrl\+Shift\+Esc|Meta\+Esc|Ctrl\+Esc)(,|$)'; then
            echo "::error::another app claims Spark Monitor's keys"; exit 1
          fi
          # No Tailscale: no package, no repository, no units
          $SSH 'rpm -q tailscale 2>&1; ls /etc/yum.repos.d/; echo "== units"; systemctl list-unit-files --no-legend "tailscale*"' | tee "$WORK/cleanup-tailscale.txt"
          grep -q 'package tailscale is not installed' "$WORK/cleanup-tailscale.txt" || { echo "::error::tailscale is installed"; exit 1; }
          if grep -i 'tailscale' "$WORK/cleanup-tailscale.txt" | grep -v 'is not installed'; then echo "::error::Tailscale leftovers"; exit 1; fi
          # No calling home: usage counting off (timer and DNF), Get New Stuff off in SparkOS's
          # kdeglobals (KDE is gone, but Qt apps still read the file).
          # The connectivity check is printed only: it stays until the owner decides.
          $SSH 'echo "countme timer: $(systemctl is-enabled rpm-ostree-countme.timer 2>&1)"
                echo "countme last run: $(systemctl show -P LastTriggerUSec rpm-ostree-countme.timer)"
                echo "dnf countme on: $(grep -l "^countme=1" /usr/share/dnf5/repos.d/*.repo /etc/yum.repos.d/*.repo 2>/dev/null | wc -l)"
                echo "ghns: $(sed -n "/^\[KDE Action Restrictions\]/,/^\[/s/^ghns=//p" /etc/xdg/kdeglobals)"
                echo "== connectivity check"; grep -h "^uri=" /usr/lib/NetworkManager/conf.d/*.conf /etc/NetworkManager/conf.d/*.conf 2>/dev/null; nmcli networking connectivity
                echo "== enabled timers"; systemctl list-unit-files --type=timer --state=enabled --no-legend --no-pager
                echo "== active timers"; systemctl list-timers --no-pager' | tee "$WORK/cleanup-calls.txt"
          grep -qx 'countme timer: disabled' "$WORK/cleanup-calls.txt" || { echo "::error::rpm-ostree-countme.timer is not disabled"; exit 1; }
          grep -qx 'dnf countme on: 0' "$WORK/cleanup-calls.txt" || { echo "::error::DNF countme is on"; exit 1; }
          grep -qx 'ghns: false' "$WORK/cleanup-calls.txt" || { echo "::error::Get New Stuff is not hidden"; exit 1; }
          # Homebrew's update timers off until sparkos-dev-setup --brew; no COPR repository on
          $SSH 'for t in brew-update.timer brew-upgrade.timer; do echo "$t: $(systemctl is-enabled $t 2>&1)"; done
                echo "copr on: $(grep -l "^enabled=1" /etc/yum.repos.d/_copr* 2>/dev/null | wc -l)"' | tee "$WORK/cleanup-brew.txt"
          grep -qx 'brew-update.timer: disabled' "$WORK/cleanup-brew.txt" || { echo "::error::brew-update.timer isn't installed and off"; exit 1; }
          grep -qx 'brew-upgrade.timer: disabled' "$WORK/cleanup-brew.txt" || { echo "::error::brew-upgrade.timer isn't installed and off"; exit 1; }
          grep -qx 'copr on: 0' "$WORK/cleanup-brew.txt" || { echo "::error::a COPR repository is on"; exit 1; }
          # SparkOS's own Homebrew shell setup (a no-op here, no Homebrew installed), the everyday
          # tools, umu-run from Terra, and no Terra repository left behind
          $SSH 'for f in /etc/profile.d/brew.sh /etc/profile.d/brew-bash-completion.sh /usr/share/fish/vendor_conf.d/sparkos-brew.fish; do
                  test -f $f && echo "$f: yes" || echo "$f: no"; done
                bash -lc "echo brew prefix: \${HOMEBREW_PREFIX:-none}"
                for c in umu-run distrobox btop sensors tmux fzf cabextract; do command -v $c >/dev/null && echo "$c: yes" || echo "$c: no"; done
                echo "terra repos: $(dnf repolist --all 2>/dev/null | grep -ci terra)"' | tee "$WORK/fedora-tools.txt"
          grep -qx 'brew prefix: none' "$WORK/fedora-tools.txt" || { echo "::error::Homebrew setup isn't a no-op without Homebrew"; exit 1; }
          if grep -q ': no$' "$WORK/fedora-tools.txt"; then echo "::error::a tool is missing"; exit 1; fi
          grep -qx 'terra repos: 0' "$WORK/fedora-tools.txt" || { echo "::error::a Terra repository is configured"; exit 1; }

      - name: Check SparkOS's own AppImage handling
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # .AppImage opens in sparkos-open-package, which adds it to the menu itself (no Gear Lever)
          $SSH 'xdg-mime query default application/vnd.appimage; rpm -q fuse fuse-libs; grep -ci gearlever /usr/bin/sparkos-open-package || true' | tee "$WORK/appimage.txt"
          grep -qx 'sparkos-open-package.desktop' "$WORK/appimage.txt"
          if grep -q 'not installed' "$WORK/appimage.txt"; then
            echo "::error::fuse or fuse-libs (the AppImage runtime) is not installed"; exit 1
          fi
          tail -1 "$WORK/appimage.txt" | grep -qx 0 || { echo "::error::sparkos-open-package still mentions Gear Lever"; exit 1; }
          # A real AppImage with the FUSE 2 runtime (AppImageKit 12's appimagetool, pinned by checksum):
          # add it to the menu, run it (through FUSE), then remove it
          curl -fsSL --retry 5 -o "$WORK/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage
          echo "d918b4df547b388ef253f3c9e7f6529ca81a885395c31f619d9aaf7030499a13  $WORK/appimagetool-x86_64.AppImage" | sha256sum -c -
          scp -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 \
            "$WORK/appimagetool-x86_64.AppImage" spark@127.0.0.1:/tmp/appimagetool-x86_64.AppImage
          $SSH 'set -e
            mkdir -p ~/Downloads && mv /tmp/appimagetool-x86_64.AppImage ~/Downloads/
            entry=$(sparkos-open-package --add-appimage ~/Downloads/appimagetool-x86_64.AppImage)
            echo "== entry $entry"; cat "$entry"
            desktop-file-validate "$entry" && echo "entry valid"
            test ! -e ~/Downloads/appimagetool-x86_64.AppImage && test -x ~/Applications/appimagetool-x86_64.AppImage && echo "moved to ~/Applications"
            icon=$(sed -n "s/^Icon=//p" "$entry" | head -1); test -s "$icon" && echo "icon $icon"
            echo "== run (FUSE)"; ~/Applications/appimagetool-x86_64.AppImage --version 2>&1 | tail -2
            echo "== remove"; sparkos-open-package --remove-appimage "$entry" --yes
            test ! -e "$entry" && test ! -e ~/Applications/appimagetool-x86_64.AppImage && test ! -e "$icon" && echo "all removed"' 2>&1 | tee "$WORK/appimage-run.txt"
          grep -q 'Name=appimagetool' "$WORK/appimage-run.txt"
          grep -q '^entry valid' "$WORK/appimage-run.txt"
          grep -q '^moved to ~/Applications' "$WORK/appimage-run.txt"
          grep -q '^icon ' "$WORK/appimage-run.txt"
          grep -q '^appimagetool, ' "$WORK/appimage-run.txt" || { echo "::error::the AppImage didn't run"; exit 1; }
          grep -q '^all removed' "$WORK/appimage-run.txt"
          # The double-click path itself, with a stand-in spark-ask that gives set answers (exit 0 is
          # the first button, 1 the second, 2 Cancel) and stand-in AppImages that leave a mark when run
          cat > "$WORK/appimage-dialogs.sh" <<'EOF'
          #!/bin/bash
          set -u
          fail=0
          check() { if eval "$2"; then echo "ok: $1"; else echo "FAIL: $1"; fail=1; fi; }
          mkdir -p /tmp/fakebin ~/Downloads
          cat > /tmp/fakebin/spark-ask <<'K'
          #!/bin/sh
          echo "spark-ask $*" >> /tmp/spark-ask.log
          code=$(head -1 /tmp/answers); sed -i 1d /tmp/answers
          exit "${code:-2}"
          K
          chmod +x /tmp/fakebin/spark-ask
          make_app() { # like a fresh download: not executable
          cat > "$1" <<'A'
          #!/bin/sh
          if [ "$1" = --appimage-extract ]; then
            mkdir -p squashfs-root
            case "$2" in
              '*.desktop') printf '[Desktop Entry]\nType=Application\nName=Dialog Test\nIcon=dialogtest\nCategories=Utility;\n' > squashfs-root/dialogtest.desktop ;;
              dialogtest.png) cp /usr/share/icons/hicolor/48x48/apps/sparkos.png squashfs-root/dialogtest.png ;;
            esac
            exit 0
          fi
          echo "ran $0" >> /tmp/appimage-ran
          A
          chmod -x "$1"
          }
          open() { printf '%s\n' "$@" > /tmp/answers; PATH=/tmp/fakebin:$PATH sparkos-open-package "$F"; sleep 2; }
          entry=~/.local/share/applications/sparkos-appimage-Dialog_Test.desktop
          rm -f /tmp/appimage-ran /tmp/spark-ask.log

          echo "== Add to the app menu, then Open it now"
          F=~/Downloads/Dialog_Test.AppImage; make_app "$F"; open 0 0
          check "moved to ~/Applications, executable" '[ ! -e "$F" ] && [ -x ~/Applications/Dialog_Test.AppImage ]'
          check "menu entry named from inside" 'grep -qx "Name=Dialog Test" "$entry"'
          check "icon from inside" '[ -s ~/.local/share/sparkos/appimage-icons/Dialog_Test.png ]'
          check "opened after adding" 'grep -q "^ran .*/Applications/Dialog_Test.AppImage$" /tmp/appimage-ran'

          echo "== Opened again from ~/Applications: runs with no question"
          n=$(wc -l < /tmp/spark-ask.log); F=~/Applications/Dialog_Test.AppImage; open
          check "no new question" '[ "$(wc -l < /tmp/spark-ask.log)" = "$n" ]'
          check "ran again" '[ "$(grep -c Dialog_Test /tmp/appimage-ran)" = 2 ]'

          echo "== Remove from this PC (the menu entry's action), answered Remove"
          act=$(sed -n '/^\[Desktop Action SparkOSRemove\]/,$s/^Exec=//p' "$entry")
          printf '0\n' > /tmp/answers; PATH=/tmp/fakebin:$PATH eval "$act"
          check "file, icon and entry deleted" '[ ! -e ~/Applications/Dialog_Test.AppImage ] && [ ! -e "$entry" ] && [ -z "$(ls -A ~/.local/share/sparkos/appimage-icons)" ]'

          echo "== Run once"
          F=~/Downloads/Once.AppImage; make_app "$F"; open 1
          check "ran where it is" 'grep -q "^ran .*/Downloads/Once.AppImage$" /tmp/appimage-ran'
          check "not added" '[ -e "$F" ] && [ ! -e ~/.local/share/applications/sparkos-appimage-Once.desktop ]'

          echo "== Cancel"
          F=~/Downloads/Cancel.AppImage; make_app "$F"; open 2
          check "nothing ran or moved" '! grep -q Cancel /tmp/appimage-ran && [ -e "$F" ] && [ ! -x "$F" ]'

          echo "== questions asked"; cat /tmp/spark-ask.log
          [ "$fail" = 0 ] && echo "ALL PASSED"
          EOF
          scp -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 \
            "$WORK/appimage-dialogs.sh" spark@127.0.0.1:/tmp/appimage-dialogs.sh
          $SSH 'bash /tmp/appimage-dialogs.sh' 2>&1 | tee "$WORK/appimage-dialogs.txt"
          grep -qx 'ALL PASSED' "$WORK/appimage-dialogs.txt" || { echo "::error::the AppImage double-click path failed"; exit 1; }

      - name: Check no third-party apps are preinstalled
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # SparkOS ships only its own apps: no Flatpak apps, no third-party apps
          $SSH 'echo "== system Flatpak apps"; flatpak list --system --app --columns=application
                echo "== third-party packages"; rpm -q steam lutris waydroid kate kwrite filelight 2>&1' | tee "$WORK/apps.txt"
          APPS=$(sed -n '/^== system Flatpak apps/,/^== third-party packages/p' "$WORK/apps.txt" | grep -v '^==' || true)
          [ -z "$APPS" ] || { echo "::error::preinstalled Flatpaks found:"; echo "$APPS"; exit 1; }
          if grep -E '^(steam|lutris|waydroid|kate|kwrite|filelight)-[0-9]' "$WORK/apps.txt"; then
            echo "::error::a third-party app is installed"; exit 1
          fi
          # Other projects' apps and tools that stay installed are out of the app menu
          # (sparkos-cleanup.sh): every visible desktop entry must be in this list
          $SSH 'cd /usr/share/applications; for f in *.desktop; do
                  sed -n "/^\[Desktop Entry\]/,/^\[/p" "$f" | grep -qE "^(NoDisplay|Hidden)=true" || echo "$f"
                done' | tee "$WORK/menu.txt"
          SHOWN=$(grep -vE '^(dev\.wolklaw\.|soot|freesuite|sparkos-)' "$WORK/menu.txt" || true)
          [ -z "$SHOWN" ] || echo "::warning::in the app menu but not SparkOS's own: $(echo $SHOWN)"
          for id in btop nvtop; do
            if grep -qx "$id.desktop" "$WORK/menu.txt"; then echo "::error::$id is still in the app menu"; exit 1; fi
          done
          # The hidden apps are gone from the image, not just from the menu (stage 1 of replacing KDE)
          $SSH 'for p in konsole konsole-part ark ark-libs kde-connect kde-connect-libs kdeconnectd plasma-discover plasma-discover-libs plasma-discover-flatpak plasma-discover-rpm-ostree plasma-discover-kns plasma-discover-notifier kinfocenter kjournald gnome-disk-utility btrfs-assistant firewall-config spectacle plasma-systemmonitor; do if rpm -q $p >/dev/null 2>&1; then echo "$p is still installed"; exit 1; fi; done; echo "removed apps are gone"'
          # No KDE at all (sparkos-no-kde.sh): no Plasma, KWin, Plasma Login Manager, KDE Frameworks,
          # Dolphin, Konsole or KWallet; greetd with the Spark Greeter signs in; spark-wl is the
          # only session; GNOME Keyring keeps passwords
          $SSH 'set -u
                rpm -qa --qf "%{NAME}\n" | grep -E "^(plasma|kwin|kf6-|kde|kwallet|kscreen|dolphin|konsole|plasmalogin|kdialog|xdg-desktop-portal-kde|polkit-kde)" | sed "s/^/kde package: /"
                for f in /usr/bin/plasmashell /usr/bin/kwin_wayland /usr/bin/plasmalogin /usr/bin/kwalletd6 /usr/bin/kreadconfig6 /usr/bin/kdialog /usr/share/plasma; do test -e $f && echo "kde file: $f"; done
                echo "display manager: $(basename "$(readlink /etc/systemd/system/display-manager.service)")"
                grep -qx "command = \"/usr/libexec/spark-greeter-session\"" /etc/greetd/config.toml && echo "greeter: spark"
                echo "sessions: $(ls /usr/share/wayland-sessions/ /usr/share/xsessions/ 2>/dev/null | grep "\.desktop$" | paste -sd,)"
                rpm -q gnome-keyring pinentry-gnome3 >/dev/null && echo "keyring: gnome-keyring"
                grep -qx "org.freedesktop.impl.portal.Secret=gnome-keyring" /usr/share/xdg-desktop-portal/sparkwl-portals.conf && echo "secret portal: gnome-keyring"
                test -x /usr/libexec/spark-wl-windows && command -v grim spark-compositor spark-shell spark-greeter >/dev/null && echo "session tools present"' | tee "$WORK/no-kde.txt"
          if grep -q '^kde ' "$WORK/no-kde.txt"; then echo "::error::KDE is still in the image"; exit 1; fi
          grep -qx 'display manager: greetd.service' "$WORK/no-kde.txt" || { echo "::error::greetd is not the display manager"; exit 1; }
          grep -qx 'greeter: spark' "$WORK/no-kde.txt" || { echo "::error::greetd does not run the Spark Greeter"; exit 1; }
          grep -qx 'sessions: spark-wl.desktop' "$WORK/no-kde.txt" || { echo "::error::spark-wl is not the only session"; exit 1; }
          grep -qx 'keyring: gnome-keyring' "$WORK/no-kde.txt" || { echo "::error::GNOME Keyring or pinentry-gnome3 is missing"; exit 1; }
          grep -qx 'secret portal: gnome-keyring' "$WORK/no-kde.txt" || { echo "::error::the Secret portal is not GNOME Keyring"; exit 1; }
          grep -qx 'session tools present' "$WORK/no-kde.txt" || { echo "::error::a Spark session program is missing"; exit 1; }
          # What stays: SparkOS's own apps and the owner's
          $SSH 'test -x /usr/bin/soot && test -x /usr/bin/freesuite && test -x /usr/bin/spark-snip && test -x /usr/bin/spark-media && test -x /usr/bin/spark-welcome && test -x /usr/bin/spark-games && test -x /usr/bin/spark-monitor && test -x /usr/bin/spark-controller && test -x /usr/bin/spark-disks && test -x /usr/bin/spark-emoji && test -x /usr/bin/spark-notes && test -x /usr/bin/spark-boxes && test -x /usr/bin/spark-audio && test -x /usr/bin/spark-backup && for a in spark-edit spark-calc spark-fonts spark-archive spark-scan spark-run spark-link spark-store spark-files spark-terminal spark-update spark-settings; do test -x /usr/bin/$a || exit 1; done && echo "platform and SparkOS apps present"'

      - name: Check installing apps the Windows way
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.FULL == 'true' }}
        run: |
          # Double-clicked downloads open in the SparkOS helper, which hands .exe/.msi to Spark Run,
          # adds AppImages itself, or guides .rpm and .deb files
          $SSH 'for m in application/x-ms-dos-executable application/x-msi application/vnd.appimage application/vnd.flatpak.ref application/x-rpm application/vnd.debian.binary-package; do printf "%s -> " $m; xdg-mime query default $m; done' | tee "$WORK/install-defaults.txt"
          grep -q 'application/x-ms-dos-executable -> sparkos-open-package.desktop' "$WORK/install-defaults.txt"
          grep -q 'application/vnd.appimage -> sparkos-open-package.desktop' "$WORK/install-defaults.txt"
          # Flatpak links open in Spark Store (sparkos-defaults.sh)
          STORE=dev.wolklaw.SparkStore
          grep -q "application/vnd.flatpak.ref -> $STORE.desktop" "$WORK/install-defaults.txt"
          grep -q 'application/x-rpm -> sparkos-open-package.desktop' "$WORK/install-defaults.txt"
          grep -q 'application/vnd.debian.binary-package -> sparkos-open-package.desktop' "$WORK/install-defaults.txt"
          # The Store and the guided package installer are there, and what the installer uses exists
          $SSH "ls /usr/share/applications/$STORE.desktop /var/lib/flatpak/exports/share/applications/$STORE.desktop 2>/dev/null | head -1 | grep -q . && echo 'Store ($STORE) present'"
          $SSH 'test -x /usr/bin/sparkos-open-package && test -f /usr/share/applications/sparkos-open-package.desktop && command -v rpm-ostree pkexec spark-ask spark-terminal gio flatpak >/dev/null && flatpak remotes --system | grep -q flathub && echo "installer helper ready, Flathub set up for the Store"'
          $SSH 'grep -A2 "\*.exe|\*.msi)" /usr/bin/sparkos-open-package | grep -q "exec spark-run" && command -v spark-run && echo ".exe and .msi open in Spark Run"'

      # SparkOS's own Flathub setup (build_files/flathub.sh): Flathub for the system 30 s after
      # boot, and for each user at login, so the Store works
      - name: Check the Flathub setup services
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Both are oneshot services started by timers; wait until each has run once
          ran() { $SSH "systemctl $1 show -p ExecMainExitTimestampMonotonic --value $2" | grep -qv '^0$'; }
          for i in $(seq 1 18); do
            ran "" system-flatpak-setup.service && ran --user user-flatpak-setup.service && break
            sleep 10
          done
          $SSH 'for u in system-flatpak-setup user-flatpak-setup; do
                  [ $u = user-flatpak-setup ] && s=--user || s=
                  echo "$u: $(systemctl $s show -p Result,ExecMainStatus,ExecMainExitTimestamp $u.service | tr "\n" " ")"
                done
                journalctl -b --no-pager -u system-flatpak-setup.service --user-unit user-flatpak-setup.service | tail -8
                echo "== system remotes"; flatpak remotes --system --columns=name
                echo "== user remotes"; flatpak remotes --user --columns=name' 2>&1 | tee "$WORK/flathub.txt"
          grep '^system-flatpak-setup: ' "$WORK/flathub.txt" | grep 'Result=success' | grep -q 'ExecMainStatus=0 '
          grep '^user-flatpak-setup: ' "$WORK/flathub.txt" | grep 'Result=success' | grep -q 'ExecMainStatus=0 '
          sed -n '/== system remotes/,/== user remotes/p' "$WORK/flathub.txt" | grep -qx flathub
          sed -n '/== user remotes/,$p' "$WORK/flathub.txt" | grep -qx flathub

      - name: Measure boot time and idle load
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          # Not this PC's real numbers (nested VM, no GPU), but a change that makes boot or idle
          # heavier shows up here between builds. Measured after first-boot work has finished.
          sleep 10
          $SSH 'echo "== boot"; systemd-analyze; echo; echo "== slowest services"; systemd-analyze blame --no-pager | head -12
                echo; echo "== memory"; free -m
                echo; echo "== load"; uptime
                echo; echo "== busiest processes"; ps -eo pcpu,pmem,rss,comm --sort=-pcpu --no-headers | head -12
                echo; echo "== running services"; systemctl list-units --type=service --state=running --no-legend --no-pager | wc -l' | tee "$WORK/performance.txt"
          {
            echo "### Boot and idle (test VM)"
            echo '```'
            grep -A1 "== boot" "$WORK/performance.txt" | tail -1
            grep -A2 "== memory" "$WORK/performance.txt" | tail -2
            grep -A1 "== load" "$WORK/performance.txt" | tail -1
            echo "running services: $(tail -1 "$WORK/performance.txt")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the SparkOS look
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          $SSH 'set -e
            echo "== fonts"; fc-list : family | grep -E "^(Chakra Petch|Inter)$" | sort -u
            echo "== wallpaper"; ls -l /usr/share/wallpapers/SparkOS/contents/images/
            echo "== boot splash"; grep "^Theme=" /etc/plymouth/plymouthd.conf
            echo "== about"; grep -E "^(NAME|LOGO)=" /etc/os-release
            echo "== kernel options"; cat /proc/cmdline
            echo "== boots"; journalctl --list-boots --no-pager | tail -3
            echo "== plymouth this boot"; journalctl -b -o short-monotonic --no-pager 2>/dev/null | grep -i plymouth | head -25' | tee "$WORK/look.txt"
          grep -qx "Chakra Petch" "$WORK/look.txt"
          grep -qx "Inter" "$WORK/look.txt"
          # Chakra Petch is the copy kept in this repo (files/sparkos-theme/fonts), not a build-time download
          (cd files/sparkos-theme/fonts && sha256sum ChakraPetch-*.ttf OFL.txt) | tee "$WORK/fonts-repo.txt"
          $SSH 'cd /usr/share/fonts/chakra-petch && sha256sum ChakraPetch-*.ttf OFL.txt' > "$WORK/fonts-image.txt"
          diff "$WORK/fonts-repo.txt" "$WORK/fonts-image.txt" || { echo "::error::the image's Chakra Petch differs from the repo's"; exit 1; }
          if grep -nwE 'curl|wget' files/scripts/sparkos-theme.sh; then echo "::error::sparkos-theme.sh downloads something"; exit 1; fi
          grep -q "Theme=sparkos" "$WORK/look.txt"
          grep -q '^NAME="\?SparkOS"\?$' "$WORK/look.txt"
          grep -q '^LOGO=sparkos$' "$WORK/look.txt"

      # Sign in as the test user the way a person does: greetd shows the Spark Greeter (on its own
      # spark-compositor, as the greetd user) with the only user picked and the password box
      # focused, so the password is typed through QEMU's keyboard and the real PAM stack runs
      # (pam_gnome_keyring unlocks the keyring). greetd autologin ([initial_session]) only if that
      # fails, because the keyring stays locked then.
      - name: Sign in to the Spark session
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          sendkeys() { for k in "$@"; do echo "sendkey $k" | socat - UNIX-CONNECT:"$WORK/qmon" >/dev/null; sleep 0.2; done; }
          shot() { echo "screendump $WORK/shots/$1.png -f png" | socat - UNIX-CONNECT:"$WORK/qmon" >/dev/null || true; sleep 1; }
          # -f with ^ so the pattern never matches the remote shell running pgrep
          session_up() { $SSH 'pgrep -u spark -f "^(/usr/bin/)?spark-compositor" >/dev/null && pgrep -u spark -f "[s]park_shell.py" >/dev/null'; }
          # The greeter is up: greetd active, the greeter's compositor running as greetd
          for i in $(seq 1 24); do
            $SSH 'systemctl is-active --quiet greetd && pgrep -u greetd -f "^(/usr/bin/)?spark-compositor" >/dev/null' && break
            sleep 5
          done
          $SSH 'systemctl status greetd --no-pager -l | head -20; pgrep -a -u greetd; /usr/libexec/spark-greeter-ctl status' 2>&1 | tee "$WORK/greeter.txt" || true
          grep -q 'spark-greeter' "$WORK/greeter.txt" || { echo "::error::the Spark Greeter is not running (see greeter.txt)"; shot 3a-sign-in; exit 1; }
          sleep 5
          shot 3a-sign-in
          sendkeys s p a r k o s minus b o o t minus t e s t ret
          SIGNIN=password
          for i in $(seq 1 24); do session_up && break; sleep 5; done
          if ! session_up; then
            echo "::warning::signing in with the password at the Spark Greeter didn't start the Spark session; using greetd autologin (the keyring stays locked then)"
            shot 3b-sign-in-failed
            $SSH 'journalctl -b --no-pager -o cat -u greetd | tail -30' 2>&1 | tee "$WORK/greeter-journal.txt" || true
            SIGNIN=autologin
            $SSH 'echo sparkos-boot-test | sudo -S -p "" sh -c "printf \"\n[initial_session]\ncommand = \\\"/usr/bin/spark-wl-session\\\"\nuser = \\\"spark\\\"\n\" >> /etc/greetd/config.toml && systemctl restart greetd"'
            for i in $(seq 1 24); do session_up && break; sleep 5; done
          fi
          echo "SIGNIN=$SIGNIN" >> "$GITHUB_ENV"
          echo "Signed in by $SIGNIN"
          session_up || { echo "::error::the Spark session did not start for the test user"; $SSH 'cat ~/.local/state/spark-wl/*.log 2>/dev/null | tail -40; journalctl -b --no-pager -o cat --user | tail -40' || true; exit 1; }
          # How the later steps reach the session from SSH: the shell's environment (the compositor
          # sets WAYLAND_DISPLAY with setenv, so its own /proc environ doesn't show it)
          cat > "$WORK/session-env.sh" <<'EOF'
          pid=$(pgrep -u "$(id -u)" -f '[s]park_shell.py' | head -1)
          if [ -n "$pid" ]; then
            while IFS= read -r -d '' kv; do
              case "$kv" in
                WAYLAND_DISPLAY=*|DISPLAY=*|XDG_RUNTIME_DIR=*|DBUS_SESSION_BUS_ADDRESS=*|XDG_CURRENT_DESKTOP=*|XDG_SESSION_TYPE=*|XDG_DATA_DIRS=*) export "$kv" ;;
              esac
            done < /proc/$pid/environ
          fi
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          export DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unix:path=$XDG_RUNTIME_DIR/bus}
          if [ -z "${WAYLAND_DISPLAY:-}" ]; then
            WAYLAND_DISPLAY=$(cd "$XDG_RUNTIME_DIR" && ls wayland-* 2>/dev/null | grep -v '\.lock$' | head -1)
            export WAYLAND_DISPLAY
          fi
          EOF
          scp -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 \
            "$WORK/session-env.sh" spark@127.0.0.1:/tmp/session-env.sh
          sleep 20
          shot 3-desktop
          # The session: compositor and Spark Shell for the test user, the desktop and the startup
          # environment, GNOME Keyring for secrets
          $SSH '. /tmp/session-env.sh
                echo "compositor: $(pgrep -u spark -a -f "^(/usr/bin/)?spark-compositor")"
                echo "shell: $(pgrep -u spark -a -f "[s]park_shell.py")"
                echo "desktop: ${XDG_CURRENT_DESKTOP:-}"
                echo "display: ${WAYLAND_DISPLAY:-none}"
                echo "secrets: $(busctl --user status org.freedesktop.secrets 2>&1 | grep -m1 -E "^(Comm|PID)=" || echo none)"
                echo "keyrings: $(ls ~/.local/share/keyrings/ 2>&1 | tr "\n" " ")"
                echo "== windows"; (sleep 2) | timeout 10 /usr/libexec/spark-wl-windows | head -1
                echo "== screenshot"; grim /tmp/session.png && echo "grim ok"' 2>&1 | tee "$WORK/session.txt"
          grep -q '^desktop: sparkwl' "$WORK/session.txt" || { echo "::error::the session is not the Spark session (XDG_CURRENT_DESKTOP)"; exit 1; }
          grep -qx 'grim ok' "$WORK/session.txt" || { echo "::error::grim could not capture the Spark session (wlr-screencopy)"; exit 1; }
          $SSH 'cat /tmp/session.png' > "$WORK/shots/4-session-grim.png" || true

      # The Meta key, pressed on QEMU's keyboard, must open Spark Shell's launcher (the compositor
      # runs a lone Super tap's bind, like the Windows key). .github/scripts/launcher-open.py
      # compares the screen before and after (the open launcher fills at least 640x520 with its
      # background colour, #04090b, the same in Spark Shell's theme). Then a sum typed into it,
      # answered by Spark Calc. Screenshots: 5-launcher-*.png
      - name: Open the launcher with the Meta key
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          sendkeys() { for k in "$@"; do echo "sendkey $k" | socat - UNIX-CONNECT:"$WORK/qmon" >/dev/null; sleep 0.2; done; }
          shot() { echo "screendump $WORK/shots/$1.png -f png" | socat - UNIX-CONNECT:"$WORK/qmon" >/dev/null; sleep 1; }
          for i in $(seq 1 24); do $SSH 'pgrep -u spark -f "[s]park_shell.py"' >/dev/null 2>&1 && break; sleep 5; done
          sleep 5
          shot 5a-launcher-closed
          sendkeys meta_l
          sleep 4
          shot 5b-launcher-meta
          if python3 .github/scripts/launcher-open.py "$WORK/shots/5a-launcher-closed.png" "$WORK/shots/5b-launcher-meta.png"; then
            echo "The Meta key opened the launcher" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the Meta key did not open the launcher (see 5b-launcher-meta.png)"
            exit 1
          fi
          # A sum: Spark Calc answers it in the launcher
          sendkeys 1 2 kp_multiply 3 kp_add 0 dot 5
          sleep 3
          shot 5c-launcher-sum
          sendkeys esc esc
          sleep 2
          shot 5d-launcher-closed-again
          if python3 .github/scripts/launcher-open.py "$WORK/shots/5a-launcher-closed.png" "$WORK/shots/5d-launcher-closed-again.png"; then
            echo "::error::Escape did not close the launcher (see 5d-launcher-closed-again.png)"; exit 1
          fi

      # Every preinstalled app opened in the Spark session the sign-in step started: launched
      # from its menu entry (gio launch), a new window must show up in the compositor's window
      # list (spark-wl-windows, wlr-foreign-toplevel), no Python traceback, a screenshot through
      # grim, then closed through the same list. Spark apps once more in French.
      - name: Open every app on the desktop
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          scp -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 \
            .github/scripts/desktop-smoke.py spark@127.0.0.1:/tmp/desktop-smoke.py
          # Apps that keep passwords (FreeSuite) use GNOME Keyring; say what the session has
          $SSH '. /tmp/session-env.sh
                echo "signed in by: '"$SIGNIN"'"
                echo "secret service: $(busctl --user status org.freedesktop.secrets 2>&1 | grep -m1 "^Comm=" || echo none)"
                echo "keyring files: $(ls ~/.local/share/keyrings/ 2>&1 | tr "\n" " ")"
                journalctl -b --no-pager -o cat 2>/dev/null | grep -i -E "gnome-keyring|pam_gnome_keyring" | tail -8' 2>&1 | tee "$WORK/keyring.txt" || true
          EXPECT=dev.wolklaw.SparkSnip,dev.wolklaw.SparkMedia,dev.wolklaw.SparkWelcome,dev.wolklaw.SparkGames,dev.wolklaw.SparkMonitor,dev.wolklaw.SparkEdit,dev.wolklaw.SparkCalc,dev.wolklaw.SparkArchive,dev.wolklaw.SparkScan,dev.wolklaw.SparkRun,dev.wolklaw.SparkLink,dev.wolklaw.SparkStore,dev.wolklaw.SparkFiles,dev.wolklaw.SparkUpdate,dev.wolklaw.SparkSettings,dev.wolklaw.SparkController,dev.wolklaw.SparkDisks,dev.wolklaw.SparkBackup,dev.wolklaw.Soot,freesuite
          set +e
          timeout 900 $SSH ". /tmp/session-env.sh; rm -rf /tmp/desktop-smoke; python3 /tmp/desktop-smoke.py --out /tmp/desktop-smoke --passes en,fr --expect $EXPECT" 2>&1 | tee "$WORK/desktop-smoke.txt"
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$WORK/desktop-screenshots"
          $SSH 'tar -C /tmp/desktop-smoke -cf - .' | tar -C "$WORK/desktop-screenshots" -xf - || true
          python3 - "$WORK/desktop-screenshots/results.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF' || true
          import json, sys
          data = json.load(open(sys.argv[1]))
          cell = lambda s: str(s).replace('|', '\\|').replace('\n', ' ')
          print('### Apps opened in the Spark session (test VM)')
          print(f"Started from their menu entries with {data['launcher']}; screenshots in the desktop-screenshots artifact.\n")
          print('| App | Language | Window title | Seconds to open | Result |')
          print('|---|---|---|---|---|')
          for r in data['results']:
              result = 'OK' if r['ok'] else 'fail: ' + r['reason']
              notes = '; '.join(r.get('notes', []))
              if notes:
                  result += f' ({notes})'
              print(f"| {cell(r['name'])} | {r['pass']} | {cell(r['title'])} | {r['seconds'] if r['seconds'] is not None else '-'} | {cell(result)} |")
          EOF
          echo "Signed in to the Spark session by $SIGNIN. $(grep '^secret service' "$WORK/keyring.txt" 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            grep -E '^-- |^   FAIL' "$WORK/desktop-smoke.txt" | grep -B1 '^   FAIL' | grep '^-- ' | sed 's/^-- /::error::did not open cleanly on the desktop: /' || true
            echo "::error::desktop app check failed (exit $status); see desktop-smoke.txt and the summary"
            exit 1
          fi

      # In the signed-in session: folders, xdg-open and "Show in folder" reach Spark Files
      - name: Check Spark Files is the file manager
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          scp -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 \
            .github/scripts/spark-files-check.sh spark@127.0.0.1:/tmp/spark-files-check.sh
          $SSH 'bash /tmp/spark-files-check.sh' 2>&1 | tee "$WORK/spark-files-session.txt"
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::Spark Files is not the file manager in the session (see spark-files-session.txt)"; exit 1; }

      - name: Upload the desktop screenshots
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          path: /mnt/boot-test/desktop-screenshots/
          if-no-files-found: warn

      - name: Check Caps Lock turns on and off when pressed
        # sparkos-capslock runs for the VM's PS/2 keyboard (started by udev) and the desktop reads its
        # copy. QEMU presses Caps Lock and holds it 1.5 s, twice; .github/scripts/caps-lock/caps_test.py
        # in the VM watches the copy and the keyboard's Caps Lock light, which spark-compositor sets
        # in the Spark session (not yet seen passing there): the light
        # must be on during the first hold and off during the second (Linux alone turns it off only
        # when the key comes up). The sign-in above typed the password through the same keyboard.
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' }}
        run: |
          $SSH 'systemctl list-units --no-legend --all "sparkos-capslock@*"; journalctl -b -o cat --no-pager -u "sparkos-capslock@*" | tail -20; grep -A4 -E "AT Translated" /proc/bus/input/devices' \
            | tee "$WORK/caps-lock.txt"
          grep -qE '^ *sparkos-capslock@event[0-9]+\.service +loaded active running' "$WORK/caps-lock.txt" \
            || { echo "::error::sparkos-capslock isn't running for the keyboard"; exit 1; }
          scp -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222 \
            .github/scripts/caps-lock/caps_test.py spark@127.0.0.1:/tmp/caps_test.py
          $SSH 'echo sparkos-boot-test | sudo -S -p "" python3 /tmp/caps_test.py vm --seconds 12' > "$WORK/caps-lock-vm.txt" 2>&1 &
          watcher=$!
          for i in $(seq 1 30); do grep -q '^READY' "$WORK/caps-lock-vm.txt" 2>/dev/null && break; sleep 0.5; done
          sleep 1
          echo "sendkey caps_lock 1500" | socat - UNIX-CONNECT:"$WORK/qmon" >/dev/null
          sleep 4
          echo "sendkey caps_lock 1500" | socat - UNIX-CONNECT:"$WORK/qmon" >/dev/null
          set +e; wait "$watcher"; status=$?; set -e
          cat "$WORK/caps-lock-vm.txt" | tee -a "$WORK/caps-lock.txt"
          [ "$status" = 0 ] || { echo "::error::Caps Lock didn't turn on and off at the press (see caps-lock.txt)"; exit 1; }
          # The documented way back to Linux's behaviour masks every keyboard's instance
          $SSH 'echo sparkos-boot-test | sudo -S -p "" systemctl mask sparkos-capslock@.service >/dev/null 2>&1
                echo "masked: $(systemctl show -P LoadState sparkos-capslock@event99.service)"
                echo sparkos-boot-test | sudo -S -p "" systemctl unmask sparkos-capslock@.service >/dev/null 2>&1
                echo "unmasked: $(systemctl show -P LoadState sparkos-capslock@event99.service)"' | tee -a "$WORK/caps-lock.txt"
          grep -qx 'masked: masked' "$WORK/caps-lock.txt" || { echo "::error::systemctl mask sparkos-capslock@.service doesn't turn it off"; exit 1; }

      - name: Check Spark Update installs a real update
        if: ${{ !cancelled() && steps.ssh.outcome == 'success' && env.SPARK_UPDATE_TEST == 'true' }}
        run: |
          # The VM follows latest but runs the tested image, so the real latest is an update.
          # Spark Update's own engine must find it, download it, check its signature, stage it,
          # and the PC must start it after a restart.
          WANT=$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://$REPO:latest")
          echo "latest in the registry: $WANT"
          $SSH 'rpm-ostree status --booted; df -h /sysroot'
          # what the Spark Update window's "Check now" starts (the signed-in user needs no password;
          # SSH isn't a seat at the PC, so sudo here)
          $SSH 'echo sparkos-boot-test | sudo -S -p "" systemctl start --wait spark-update-now@stage.service; echo "exit $?"; cat /var/lib/spark-update/state.json; echo; journalctl -b -u spark-update-now@stage.service --no-pager | tail -20' 2>&1 | tee "$WORK/spark-update-stage.txt"
          grep -q '"result": *"staged"' "$WORK/spark-update-stage.txt" || { echo "::error::Spark Update didn't stage the update"; exit 1; }
          $SSH 'rpm-ostree status' | tee "$WORK/spark-update-staged.txt"
          grep -q "$WANT" "$WORK/spark-update-staged.txt" || { echo "::error::the staged image isn't latest ($WANT)"; exit 1; }
          $SSH "echo sparkos-boot-test | sudo -S -p '' systemctl reboot" || true
          sleep 30
          up=0
          for i in $(seq 1 90); do if $SSH true 2>/dev/null; then up=1; echo "back after the update, ~$((i*10+30))s"; break; fi; sleep 10; done
          [ "$up" = 1 ] || { echo "::error::no SSH after restarting into the update"; tail -50 "$WORK/serial.log"; exit 1; }
          $SSH 'rpm-ostree status --booted' | tee "$WORK/spark-update-booted.txt"
          grep -q "$WANT" "$WORK/spark-update-booted.txt" || { echo "::error::the PC didn't start the update"; exit 1; }
          grep -qF "ostree-image-signed:docker://$REPO:latest" "$WORK/spark-update-booted.txt"
          echo "Spark Update downloaded, staged and started $WANT"

      - name: Screenshot at the end
        if: always()
        run: |
          echo "screendump $WORK/shots/2-end.png -f png" | socat - UNIX-CONNECT:"$WORK/qmon" || true
          $SSH 'journalctl -b --no-pager -p warning' > "$WORK/journal-warnings.txt" 2>/dev/null || true
          ls -l "$WORK/shots" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-results
          path: |
            /mnt/boot-test/shots/
            /mnt/boot-test/*.txt
            /mnt/boot-test/serial.log
          if-no-files-found: warn
