name: spark-store
# Spark Store, SparkOS's own app store (files/spark-store; image build step
# files/scripts/spark-store.sh, not wired into the recipe yet).
#
# fedora:  runs the image build step in a plain Fedora container, the self-test, the unit and
#          UI tests under Xvfb (installs, removals and updates run through the queue against a
#          fake flatpak), then downloads the real Flathub catalog with flatpak, installs and
#          removes one real app through the Store's window, and measures the time to first
#          paint and to the catalog on screen, cold and cached.
# sparkos: inside the published SparkOS image: runs the image build step as root, then, as a
#          normal user, install.sh --user (no root), the self-test and the unit tests on the
#          image's Python; has that user's flatpak download the Flathub catalog, self-tests
#          against it, installs, updates and removes one real app through the Store's queue,
#          uninstalls the Store, and checks nothing is left behind.
#
# The real app is the first of $APPS in the catalog: small apps on the freedesktop runtime.
on:
  push:
    paths:
      - "files/spark-store/**"
      - "files/scripts/spark-store.sh"
      - ".github/workflows/spark-store.yml"
  pull_request:
    paths:
      - "files/spark-store/**"
      - "files/scripts/spark-store.sh"
      - ".github/workflows/spark-store.yml"
  workflow_dispatch:

env:
  APPS: com.github.rkoesters.xkcd-gtk ch.imatt.ClipQR dev.edfloreshz.Calculator

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged          # flatpak install runs its triggers in bubblewrap
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-store.sh

      - name: Self-test
        run: spark-store --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-store
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -W error::ResourceWarning \
            -m unittest discover -s tests -v

      - name: Real Flathub catalog, through flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          for i in 1 2 3; do flatpak update --user --appstream flathub && break; sleep $((i*20)); done
          SPARK_STORE_REQUIRE_CATALOG=1 spark-store --self-test

      - name: Install and remove a real app through the window (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python3 files/spark-store/tests/real_flatpak_check.py --ui $APPS

      - name: Speed (first paint, catalog on screen, idle CPU)
        run: |
          set -o pipefail
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          rm -rf ~/.cache/spark-store
          timeout 180 xvfb-run -a -s "-screen 0 1920x1080x24" spark-store --bench 10 | tee bench-cold.txt
          timeout 180 xvfb-run -a -s "-screen 0 1920x1080x24" spark-store --bench 10 | tee bench-cached.txt
          SPARK_STORE_REDUCED_MOTION=1 timeout 180 xvfb-run -a -s "-screen 0 1920x1080x24" \
            spark-store --bench 10 | tee bench-still.txt
          { echo '### Spark Store speed (GitHub runner, Xvfb, real Flathub catalog)'
            echo 'First run (index built):'; echo '```'; cat bench-cold.txt; echo '```'
            echo 'Every run after:'; echo '```'; cat bench-cached.txt; echo '```'
            echo 'With animations off (no glitch):'; echo '```'; cat bench-still.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: The image build step, as root, in the SparkOS image
        run: |
          sudo podman run --rm -v "$PWD/files:/src:ro" "$IMAGE" bash -euo pipefail -c '
            CONFIG_DIRECTORY=/src bash /src/scripts/spark-store.sh
            spark-store --self-test
          '

      - name: Install, self-test, a real app, uninstall as a normal user
        run: |
          sudo podman run --rm --privileged -e APPS="$APPS" -v "$PWD/files:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            # an image ships /var empty; a booted SparkOS has /var/tmp, which flatpak needs
            mkdir -p /var/tmp && chmod 1777 /var/tmp
            # and a machine ID, which flatpak uninstall needs for its D-Bus session
            [ -s /etc/machine-id ] || systemd-machine-id-setup || dbus-uuidgen --ensure=/etc/machine-id
            home=$(getent passwd tester | cut -d: -f6)
            mkdir "$home/files"
            for d in /src/spark-*; do cp -r "$d" "$home/files/"; done
            chown -R tester: "$home/files"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- what the image has"
            python3 --version; flatpak --version
            ls /usr/lib/spark-*/spark-app.json || true

            echo "--- install --user"
            as "bash ~/files/spark-store/install.sh --user"
            as "test -x ~/.local/bin/spark-store"
            as "grep -q \"^Exec=$home/.local/bin/spark-store %U$\" ~/.local/share/applications/dev.wolklaw.SparkStore.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkStore.png"
            as "ls ~/.local/lib/spark-store/spark-apps/*/spark-app.json"
            test ! -e /usr/bin/spark-store
            test ! -e /usr/share/applications/dev.wolklaw.SparkStore.desktop

            echo "--- self-test and unit tests on the image'"'"'s Python"
            as "~/.local/bin/spark-store --version"
            as "~/.local/bin/spark-store --self-test"
            as "cd ~/files/spark-store && python3 -m unittest discover -s tests -v"

            echo "--- the real Flathub catalog, downloaded by this user'"'"'s flatpak"
            as "flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"
            ok=0
            for i in 1 2 3; do as "flatpak update --user --appstream flathub" && { ok=1; break; }; sleep $((i*20)); done
            [ "$ok" = 1 ]
            as "SPARK_STORE_REQUIRE_CATALOG=1 ~/.local/bin/spark-store --self-test"

            echo "--- install, update and remove a real app through the queue"
            as "python3 ~/files/spark-store/tests/real_flatpak_check.py $APPS"

            echo "--- uninstall"
            as "bash ~/files/spark-store/install.sh --user --uninstall"
            left=$(as "find ~/.local -iname \"*spark*store*\" -o -iname \"*SparkStore*\"" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
