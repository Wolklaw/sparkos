name: spark-update
# Spark Update ships in the SparkOS image (files/scripts/spark-update.sh) and replaces Bazzite's
# updater (uupd). It also installs per user without root, like the other Spark apps.
#
# fedora:  runs the image build step in a plain Fedora container, the self-test, the unit and
#          UI tests under Xvfb, and a background check where no image is booted (it must fail
#          plainly and record why, not crash).
# sparkos: inside the published SparkOS image: (1) as root, the image build step itself, so
#          switching off Bazzite's updater is proven against Bazzite's real files; (2) as a
#          normal user (setpriv), install.sh --user, the self-test (it must find the image
#          name ghcr.io/wolklaw/sparkos), the unit tests on the image's Python, uninstall.
# Real upgrades, rollbacks and restarts need a booted SparkOS PC; CI can't do those.
on:
  push:
    paths:
      - "files/spark-update/**"
      - "files/scripts/spark-update.sh"
      - ".github/workflows/spark-update.yml"
  pull_request:
    paths:
      - "files/spark-update/**"
      - "files/scripts/spark-update.sh"
      - ".github/workflows/spark-update.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-update.sh

      - name: Self-test
        run: spark-update --self-test

      - name: A background check with no booted image fails plainly
        run: |
          set +e
          spark-update --system-run --now check
          code=$?
          set -e
          [ "$code" = 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          python3 - <<'EOF'
          import json
          st = json.load(open('/var/lib/spark-update/state.json'))
          print(st)
          assert st['result'] == 'failed' and "can't read the system status" in st['error'], st
          assert st['running'] is False
          EOF
          grep -q "manual run" /var/log/spark-update/spark-update.log
          cat /var/log/spark-update/spark-update.log

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-update
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests as a normal user (the helper refuses without root)
        run: |
          useradd -m tester
          cp -r files/spark-update /home/tester/spark-update
          chown -R tester: /home/tester/spark-update
          setpriv --reuid=tester --regid=tester --init-groups env -i HOME=/home/tester \
            PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
            bash -c 'cd ~/spark-update && python3 -m unittest discover -s tests'

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: The image build step on SparkOS (root), with each updater
        run: |
          # uupd: the default (Bazzite's updater stays on, Spark Update notifies and rolls
          # back). spark: Spark Update downloads itself and uupd is switched off.
          # The published image has no uupd since 2026-11-20 (SparkOS removes it), so the uupd
          # engine is only tested on an image that still has it.
          engines=spark
          if sudo podman run --rm "$IMAGE" rpm -q uupd; then engines="uupd spark"; fi
          for engine in $engines; do
          echo "=============== SPARK_UPDATE_ENGINE=$engine"
          sudo podman run --rm -e SPARK_UPDATE_ENGINE=$engine -v "$PWD/files:/files:ro" "$IMAGE" bash -euo pipefail -c '
            echo "--- before: Bazzite updater"
            ls -l /etc/systemd/system/timers.target.wants/ | grep -E "uupd|spark" || true
            CONFIG_DIRECTORY=/files bash /files/scripts/spark-update.sh

            echo "--- after"
            ls -l /etc/systemd/system/timers.target.wants/ | grep -E "uupd|spark" || true
            test -e /etc/systemd/user/timers.target.wants/spark-update-user.timer
            if [ "$SPARK_UPDATE_ENGINE" = uupd ]; then
              # updates must never stop: the Bazzite timer untouched, ours off, no drop-ins
              test -e /etc/systemd/system/timers.target.wants/uupd.timer
              test ! -e /etc/systemd/system/timers.target.wants/spark-update.timer
              test ! -e /usr/lib/systemd/system/uupd.service.d/50-sparkos.conf
              grep -q "^ExecStart=/usr/bin/uupd" /usr/lib/systemd/system/uupd.service
            else
              test ! -e /etc/systemd/system/timers.target.wants/uupd.timer
              test -e /etc/systemd/system/timers.target.wants/spark-update.timer
              if [ -f /usr/lib/systemd/system/uupd.service ]; then
                grep -q "^ExecStart=/usr/bin/spark-update --system-run --now stage$" \
                  /usr/lib/systemd/system/uupd.service.d/50-sparkos.conf
                cat /usr/lib/systemd/system/uupd.service.d/50-sparkos.conf
              elif [ -x /usr/bin/ujust ]; then
                # no uupd: `ujust update` runs Spark Update
                grep -q "spark-update-now@stage.service" /usr/libexec/uupd-update
              fi
            fi
            d=/usr/share/applications/io.github.rfrench3.bazzite-updater.desktop
            if [ -f "$d" ]; then grep -q "^NoDisplay=true" "$d"; fi
            out=$(bazzite-rollback-helper list || true)
            echo "$out"
            grep -q "Spark Update" <<<"$out"
            ! grep -q "ublue-os" <<<"$out"
            grep -q "AutomaticUpdatePolicy=none" /etc/rpm-ostreed.conf

            echo "--- what this image holds"
            cat /usr/share/sparkos/release.json
            python3 - <<EOF
          import json
          r = json.load(open("/usr/share/sparkos/release.json"))
          names = {c["id"]: c["version"] for c in r["components"]}
          print(names)
          for want in ("soot", "freesuite", "spark-monitor", "spark-update"):
              assert want in names, want
          assert r["image"] == "ghcr.io/wolklaw/sparkos"
          plat = {p["id"]: p["version"] for p in r["platform"]}
          assert set(plat) >= {"kernel", "mesa", "plasma"}, plat
          import re
          for key, version in plat.items():
              assert re.fullmatch(r"[0-9][0-9A-Za-z.~+_-]*", version), (key, version)
          EOF

            echo "--- self-test (root)"
            report=$(spark-update --self-test)
            echo "$report"
            grep -q "^image:     ghcr.io/wolklaw/sparkos (from /usr/share/sparkos/release.json)" <<<"$report"
            grep -q "^self-test passed" <<<"$report"
            if [ "$SPARK_UPDATE_ENGINE" = uupd ]; then
              grep -q "^updater:   Universal Blue.s uupd" <<<"$report"
            else
              grep -q "^updater:   Spark Update" <<<"$report"
            fi
            spark-update --status || true
          '
          done

      - name: Install, self-test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-update:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-update"
            chown -R tester: "$home/spark-update"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-update/install.sh --user --no-test"
            as "test -x ~/.local/bin/spark-update"
            as "grep -q \"^Exec=$home/.local/bin/spark-update$\" ~/.local/share/applications/dev.wolklaw.SparkUpdate.desktop"
            as "grep -q \"^ExecStart=$home/.local/bin/spark-update --user-run$\" ~/.config/systemd/user/spark-update-user.service"
            as "test -L ~/.config/systemd/user/timers.target.wants/spark-update-user.timer"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkUpdate.png"
            # no "test ! -e /usr/..." here: the image ships this app system-wide; the /usr check proves the user install left /usr alone

            echo "--- self-test: reads the real status and finds the image name"
            report=$(as "~/.local/bin/spark-update --self-test")
            echo "$report"
            grep -q "^status:    " <<<"$report"
            grep -q "^image:     ghcr.io/wolklaw/sparkos " <<<"$report"
            grep -q "^self-test passed" <<<"$report"
            as "~/.local/bin/spark-update --version"

            echo "--- unit tests on the image'"'"'s Python"
            as "cd ~/spark-update && python3 -m unittest discover -s tests -v"

            echo "--- uninstall"
            as "bash ~/spark-update/install.sh --user --uninstall"
            left=$(as "find ~/.local ~/.config -iname \"*spark*update*\" -o -iname \"*SparkUpdate*\"" | grep -Ev "/(\.config|\.local/state)/spark-update$" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
