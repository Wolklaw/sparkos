name: spark-settings
# Spark Settings, SparkOS's settings app (in place of KDE System Settings).
# files/scripts/spark-settings.sh is the image build step.
#
# fedora:  runs the image build step in a plain Fedora container, with stand-ins for KDE's
#          systemsettings and kcmshell6 so the takeover is tested too, then the self-test and
#          the unit and window tests under Xvfb as a normal user, in English and in French.
#          Every tool is a fake (tests/fixtures/bin); no real setting is touched.
# sparkos: inside the published SparkOS image, checks the stand-ins and the
#          image's tools (self-test --strict), installs it for a normal user with
#          install.sh --user (no root), runs the tests on the image's own Python and Tk,
#          uninstalls it, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-settings/**"
      - "files/scripts/spark-settings.sh"
      - ".github/workflows/spark-settings.yml"
  pull_request:
    paths:
      - "files/spark-settings/**"
      - "files/scripts/spark-settings.sh"
      - ".github/workflows/spark-settings.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (the image build step)
        run: |
          # stand-ins for KDE's two tools and the menu entry (the real ones are in the images;
          # installing Plasma here would pull in half of KDE)
          printf '#!/bin/sh\necho "real systemsettings $*"\n' > /usr/bin/systemsettings
          printf '#!/bin/sh\necho "real kcmshell6 $*"\ncase "$1" in --list) echo "kcm_fake - Fake";; esac\n' > /usr/bin/kcmshell6
          chmod 0755 /usr/bin/systemsettings /usr/bin/kcmshell6
          mkdir -p /usr/share/applications
          printf '[Desktop Entry]\nType=Application\nName=System Settings\nExec=systemsettings\n' \
            > /usr/share/applications/systemsettings.desktop
          CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-settings.sh
          grep -q 'spark-settings --route systemsettings' /usr/bin/systemsettings
          grep -q 'spark-settings --route kcmshell6' /usr/bin/kcmshell6
          test "$(/usr/libexec/sparkos/kde-settings/kcmshell6 x)" = "real kcmshell6 x"
          grep -q '^NoDisplay=true' /usr/share/applications/systemsettings.desktop
          # a module Spark Settings has no page for reaches the real tool; --kde too
          test "$(kcmshell6 kcm_colors)" = "real kcmshell6 kcm_colors"
          test "$(systemsettings kcm_colors)" = "real systemsettings kcm_colors"
          spark-settings --kde | grep -q "^real systemsettings"
          # run again: the build step must not wrap its own stand-in
          CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-settings.sh
          test "$(kcmshell6 kcm_colors)" = "real kcmshell6 kcm_colors"

      - name: Self-test
        run: spark-settings --self-test

      - name: Tests (Xvfb, as a normal user)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth util-linux
          useradd -m tester
          cp -r files/spark-settings /home/tester/spark-settings
          chown -R tester: /home/tester/spark-settings
          for lang in en fr; do
            echo "::group::SPARK_LANG=$lang"
            setpriv --reuid=tester --regid=tester --init-groups env -i HOME=/home/tester \
              USER=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 SPARK_LANG=$lang \
              bash -c 'cd ~/spark-settings && xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v'
            echo "::endgroup::"
          done

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [ghcr.io/wolklaw/sparkos:latest]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, test and uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-settings:/src:ro" "$IMAGE" \
            bash -euo pipefail /src/tests/user_install_check.sh
