name: spark-settings
# Spark Settings, SparkOS's settings app.
# files/scripts/spark-settings.sh is the image build step.
#
# fedora:  runs the image build step in a plain Fedora container, then the self-test and
#          the unit and window tests under Xvfb as a normal user, in English and in French.
#          Every tool is a fake (tests/fixtures/bin); no real setting is touched.
# sparkos: inside the published SparkOS image, checks KDE is gone and the
#          image's tools (self-test --strict), installs it for a normal user with
#          install.sh --user (no root), runs the tests on the image's own Python and Tk,
#          uninstalls it, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-settings/**"
      - "files/scripts/spark-settings.sh"
      - ".github/workflows/spark-settings.yml"
  pull_request:
    paths:
      - "files/spark-settings/**"
      - "files/scripts/spark-settings.sh"
      - ".github/workflows/spark-settings.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (the image build step)
        run: |
          CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-settings.sh
          test -x /usr/bin/spark-settings

      - name: Self-test
        run: spark-settings --self-test

      - name: Tests (Xvfb, as a normal user)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth util-linux python3-dbusmock python3-dbus dbus-daemon systemd
          useradd -m tester
          cp -r files/spark-settings /home/tester/spark-settings
          chown -R tester: /home/tester/spark-settings
          for lang in en fr; do
            echo "::group::SPARK_LANG=$lang"
            setpriv --reuid=tester --regid=tester --init-groups env -i HOME=/home/tester \
              USER=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 SPARK_LANG=$lang \
              bash -c 'cd ~/spark-settings && xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v'
            echo "::endgroup::"
          done

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [ghcr.io/wolklaw/sparkos:latest]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, test and uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-settings:/src:ro" "$IMAGE" \
            bash -euo pipefail /src/tests/user_install_check.sh
