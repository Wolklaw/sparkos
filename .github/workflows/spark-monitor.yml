name: spark-monitor
# Spark Monitor ships in the SparkOS image (files/scripts/spark-monitor.sh) and also installs
# per user without root, the way optional Spark apps will through the future Spark Portal.
#
# fedora:  runs the image build step in a plain Fedora container, then the self-test, the unit
#          and UI tests under Xvfb (End task against real processes included), and measures
#          time to first paint and CPU use with 400 processes running.
# sparkos: inside the published SparkOS image, installs it for a normal user with
#          install.sh --user (no root), runs the self-test and the unit tests on the image's
#          Python, uninstalls it, and checks nothing is left behind.
on:
  push:
    paths:
      - "files/spark-monitor/**"
      - "files/scripts/spark-monitor.sh"
      - ".github/workflows/spark-monitor.yml"
  pull_request:
    paths:
      - "files/spark-monitor/**"
      - "files/scripts/spark-monitor.sh"
      - ".github/workflows/spark-monitor.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install (the image build step)
        run: CONFIG_DIRECTORY="$PWD/files" bash files/scripts/spark-monitor.sh

      - name: Self-test
        run: spark-monitor --self-test

      - name: Tests (Xvfb)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth
          cd files/spark-monitor
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Speed (first paint, CPU with 400 processes)
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          for tab in apps details performance; do
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              spark-monitor --bench 30 --fill 400 --tab "$tab" | tee -a bench.txt
          done
          { echo '### Spark Monitor speed (GitHub runner, Xvfb)'; echo '```'; cat bench.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Install, self-test, uninstall as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-monitor:/src:ro" "$IMAGE" bash -euo pipefail -c '
            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-monitor"
            chown -R tester: "$home/spark-monitor"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester \
                    LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 bash -c "$1"); }
            usr_before=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)

            echo "--- install --user"
            as "bash ~/spark-monitor/install.sh --user"
            as "test -x ~/.local/bin/spark-monitor"
            as "grep -q \"^Exec=$home/.local/bin/spark-monitor$\" ~/.local/share/applications/dev.wolklaw.SparkMonitor.desktop"
            as "grep -q \"^X-KDE-Shortcuts=Ctrl+Shift+Esc$\" ~/.local/share/kglobalaccel/dev.wolklaw.SparkMonitor.desktop"
            as "test -f ~/.local/share/icons/hicolor/256x256/apps/dev.wolklaw.SparkMonitor.png"
            test ! -e /usr/bin/spark-monitor
            test ! -e /usr/share/applications/dev.wolklaw.SparkMonitor.desktop

            echo "--- self-test and unit tests on the image'"'"'s Python"
            as "~/.local/bin/spark-monitor --version"
            as "~/.local/bin/spark-monitor --self-test"
            as "cd ~/spark-monitor && python3 -m unittest discover -s tests -v"

            echo "--- uninstall"
            as "bash ~/spark-monitor/install.sh --user --uninstall"
            left=$(as "find ~/.local -iname \"*spark*monitor*\" -o -iname \"*SparkMonitor*\"" || true)
            if [ -n "$left" ]; then echo "left behind:"; echo "$left"; exit 1; fi
            usr_after=$(find /usr -newer /etc/hostname 2>/dev/null | wc -l)
            [ "$usr_before" = "$usr_after" ] || { echo "/usr changed"; exit 1; }
            echo "installed, tested and removed without root"
          '
