name: spark-snip
# Spark Snip reads the screen itself (KWin's ScreenShot2 D-Bus interface, then the XDG portal)
# and records through the ScreenCast portal, so neither job has Spectacle installed.
#
# fedora:  installs Spark Snip in a plain Fedora container and checks it there: the install
#          script, the self-test (OCR in English and French, capture without Spectacle, a test
#          video through each encoder), the unit and UI tests under Xvfb, and the D-Bus capture
#          tests against a stand-in KWin and portal on a private bus.
# sparkos: the same inside the published SparkOS image, with Spectacle removed first: installs
#          this version over the image's copy, then runs the self-test and every test as a
#          normal user on the image's own Python.
on:
  push:
    paths:
      - "files/spark-snip/**"
      - "files/scripts/spark-snip.sh"
      - ".github/workflows/spark-snip.yml"
  pull_request:
    paths:
      - "files/spark-snip/**"
      - "files/scripts/spark-snip.sh"
      - ".github/workflows/spark-snip.yml"
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: bash files/spark-snip/install.sh --deps

      - name: Spectacle is not installed
        run: |
          if rpm -q spectacle || command -v spectacle; then echo "Spectacle is installed"; exit 1; fi
          echo "no Spectacle"

      - name: Self-test
        run: |
          spark-snip --self-test | tee self-test.json
          python3 -c 'import json,sys; c=json.load(open("self-test.json"))["capture"]; sys.exit(0 if c["passed"] and not c["spectacle_installed"] and c["desktop_entries"] else 1)'

      - name: Tests (Xvfb, private D-Bus)
        env:
          SPARK_SNIP_REQUIRE_DBUS_TESTS: "1"
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon
          cd files/spark-snip
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

      - name: Tests in French (SPARK_LANG=fr, with the text width checks)
        env:
          SPARK_SNIP_REQUIRE_DBUS_TESTS: "1"
          SPARK_LANG: fr
        run: |
          cd files/spark-snip
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Without Spectacle, install and test as a normal user
        run: |
          sudo podman run --rm -v "$PWD/files/spark-snip:/src:ro" "$IMAGE" bash -euo pipefail -c '
            echo "--- remove Spectacle, as the next SparkOS image will"
            if rpm -q spectacle; then rpm -e --nodeps spectacle; fi
            if command -v spectacle; then echo "Spectacle is still there"; exit 1; fi

            echo "--- test tools the image does not ship (Xvfb, a private D-Bus daemon)"
            need=()
            command -v xvfb-run >/dev/null || need+=(xorg-x11-server-Xvfb)
            command -v xauth >/dev/null || need+=(xorg-x11-xauth)
            command -v dbus-daemon >/dev/null || need+=(dbus-daemon)
            if [ ${#need[@]} -gt 0 ]; then
              dnf -y install --setopt=install_weak_deps=False "${need[@]}"
            fi

            echo "--- install this version over the image'"'"'s copy (runs the self-test as root)"
            bash /src/install.sh
            grep -q "^X-KDE-DBUS-Restricted-Interfaces=org.kde.KWin.ScreenShot2$" \
              /usr/share/applications/dev.wolklaw.SparkSnip.desktop
            test -L /usr/share/kglobalaccel/dev.wolklaw.SparkSnip.desktop

            useradd -m tester
            home=$(getent passwd tester | cut -d: -f6)
            cp -r /src "$home/spark-snip"
            chown -R tester: "$home/spark-snip"
            # setpriv, not su or runuser: those open a PAM session, which fails in a container
            as() { (cd "$home" && setpriv --reuid=tester --regid=tester --init-groups \
                    env -i HOME="$home" USER=tester LOGNAME=tester \
                    PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
                    SPARK_SNIP_REQUIRE_DBUS_TESTS=1 bash -c "$1"); }

            echo "--- self-test as a normal user"
            as "set -o pipefail; spark-snip --self-test | tee ~/self-test.json"
            python3 -c "import json,sys; c=json.load(open(sys.argv[1]))[\"capture\"]; sys.exit(0 if c[\"passed\"] and not c[\"spectacle_installed\"] else 1)" "$home/self-test.json"

            echo "--- unit, UI and D-Bus tests on the image'"'"'s Python"
            as "cd ~/spark-snip && xvfb-run -a -s \"-screen 0 1920x1080x24\" python3 -m unittest discover -s tests -v"
            echo "Spark Snip works on SparkOS with no Spectacle installed"
          '
