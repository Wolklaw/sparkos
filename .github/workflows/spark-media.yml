name: spark-media
# fedora:  installs Spark Media in a plain Fedora container and checks it there: the install
#          script, the self-test (photo formats, decoders, test files played to the end, a video
#          thumbnail) and the unit and UI tests under Xvfb, with tagged songs, a playlist and a
#          small DNG made on the spot. Much faster than the full image build.
# sparkos: inside the published SparkOS image: what it has for tags and camera RAW, then the
#          same tests on the image's own Python, Pillow and GStreamer. The boot test runs the
#          self-test again in the real image, where H.264, H.265 and AAC are required.
on:
  push:
    paths:
      - "files/spark-media/**"
      - "files/scripts/spark-media.sh"
      - ".github/workflows/spark-media.yml"
  pull_request:
    paths:
      - "files/spark-media/**"
      - "files/scripts/spark-media.sh"
      - ".github/workflows/spark-media.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: bash files/spark-media/install.sh --deps

      - name: Self-test
        run: spark-media --self-test

      - name: Tests (Xvfb)
        shell: bash
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers
          cd files/spark-media
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests -v 2>&1 \
            | tee /tmp/tests.txt
          rc=${PIPESTATUS[0]}
          { echo "### Tests in Fedora: $(tail -n 1 /tmp/tests.txt)"
            grep -E '^(index|scan|raw|speed):' /tmp/tests.txt | sed 's/^/    /'
            if [ "$rc" != 0 ]; then echo '```'; sed -n '/^=====/,$p' /tmp/tests.txt | head -300; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: What the image has for tags and camera RAW (for the PR)
        run: |
          sudo podman run --rm -v "$PWD/files/spark-media/tests:/t:ro" "$IMAGE" bash /t/image_report.sh \
            | tee /tmp/image.txt
          { echo '<details><summary>What the SparkOS image has for tags and camera RAW</summary>'; echo
            echo '```'; cat /tmp/image.txt; echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
