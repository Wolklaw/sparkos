name: spark-emoji
# Spark Emoji, the SparkOS emoji and symbol picker.
#
# fedora:  runs the image build step's install in a plain Fedora container, then the self-test,
#          the unit tests, the portal tests (a fake XDG portal on a private D-Bus) and the window
#          tests under Xvfb as a normal user, in English and French, with a screenshot.
# sparkos: inside the published SparkOS image, runs files/scripts/spark-emoji.sh the way the
#          image build does (installs the app and gives it Meta+.), then the same tests on the image's own Python and GTK, and a per-user
#          install and uninstall.
on:
  push:
    paths:
      - "files/spark-emoji/**"
      - "files/scripts/spark-emoji.sh"
      - ".github/workflows/spark-emoji.yml"
  pull_request:
    paths:
      - "files/spark-emoji/**"
      - "files/scripts/spark-emoji.sh"
      - ".github/workflows/spark-emoji.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install (system-wide, as the image build does)
        run: bash files/spark-emoji/install.sh --deps

      - name: Self-test
        run: spark-emoji --self-test

      - name: Tests (Xvfb, as a normal user)
        run: |
          dnf -y install --setopt=install_weak_deps=False xorg-x11-server-Xvfb xorg-x11-xauth \
            dbus-daemon mesa-dri-drivers util-linux bash
          useradd -m tester
          cp -r files/spark-emoji /home/tester/spark-emoji
          mkdir -p /home/tester/shots /home/tester/shots-fr
          chown -R tester: /home/tester
          run() {
            setpriv --reuid=tester --regid=tester --init-groups env -i HOME=/home/tester \
              USER=tester PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 SHELL=/bin/bash \
              GSK_RENDERER=cairo "$@"
          }
          run bash -c 'cd ~/spark-emoji && python3 -m unittest tests.test_core -v'
          run bash -c 'cd ~/spark-emoji && bash tests/run_paste_tests.sh' 2>&1 | tee paste.txt
          grep -qx 'OK' paste.txt
          run SPARK_SHOT_DIR=/home/tester/shots bash -c 'cd ~/spark-emoji && dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 -m unittest tests.test_ui -v'
          run SPARK_LANG=fr SPARK_SHOT_DIR=/home/tester/shots-fr bash -c 'cd ~/spark-emoji && dbus-run-session -- xvfb-run -a -s "-screen 0 1600x1000x24" python3 -m unittest tests.test_ui -v'

      - name: Screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spark-emoji-screenshots
          path: |
            /home/tester/shots
            /home/tester/shots-fr
          if-no-files-found: ignore

  sparkos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/wolklaw/sparkos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af >/dev/null || true
          df -h /

      - name: Pull the SparkOS image
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for i in 1 2 3 4 5; do sudo podman pull -q "$IMAGE" && break; echo "pull failed, retry $i"; sleep $((i*30)); done
          sudo podman image inspect "$IMAGE" --format '{{.Digest}} {{.Created}}'

      - name: Build step, tests and per-user install inside the image
        run: |
          sudo podman run --rm -v "$PWD:/repo:ro" "$IMAGE" \
            bash -euo pipefail /repo/files/spark-emoji/tests/image_check.sh | tee sparkos.txt
          status=${PIPESTATUS[0]}
          { echo '### Spark Emoji inside the SparkOS image'; echo '```';
            grep -E '^(image|emojier|ok  |FAIL|self-test|Ran |OK)' sparkos.txt || true
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
