<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="SparkOS: a small robot striking an anvil with a hammer, throwing sparks">
  <!-- SparkOS mark (static). Original artwork for SparkOS. Colours: wolklaw house tokens. -->
  <defs>
    <filter id="tint-magenta" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#ff2e88"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="tint-cyan" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#22d8ff"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <g id="bot">
      <!-- antenna with a spark on top -->
      <line x1="116" y1="26" x2="116" y2="16" stroke="#9be8b8" stroke-width="2.5"/>
      <rect x="113" y="10" width="6" height="6" fill="#f4c95d"/>
      <!-- head and visor -->
      <rect x="96" y="26" width="40" height="30" rx="3" fill="#141233" stroke="#9be8b8" stroke-width="2.5"/>
      <rect x="101" y="35" width="30" height="11" rx="2" fill="#9be8b8"/>
      <rect x="108" y="38.5" width="5" height="4" fill="#0a0919"/>
      <rect x="120" y="38.5" width="5" height="4" fill="#0a0919"/>
      <!-- neck and body, with a spark bolt on the chest -->
      <rect x="110" y="56" width="12" height="5" fill="#1b1948" stroke="#9be8b8" stroke-width="2"/>
      <rect x="100" y="61" width="32" height="44" rx="3" fill="#141233" stroke="#9be8b8" stroke-width="2.5"/>
      <path d="M121 70 H112 L109 76 L121 80 L118 87 H109" fill="none" stroke="#9be8b8" stroke-width="2"/>
      <!-- hammer arm, at the moment of the blow -->
      <g>
        <line x1="100" y1="67" x2="91" y2="81" stroke="#9be8b8" stroke-width="6" stroke-linecap="square"/>
        <line x1="91" y1="81" x2="88" y2="88" stroke="#b3b0d2" stroke-width="3.5"/>
        <rect x="74" y="88" width="24" height="12" rx="1.5" fill="#f1efff" stroke="#9be8b8" stroke-width="1.5"/>
      </g>
      <!-- glowing work piece, and the anvil in front -->
      <rect x="66" y="101" width="40" height="5" fill="#f4c95d"/>
      <path d="M22 112 L40 106 H128 V120 L110 124 L104 136 L122 148 V152 H58 V148 L76 136 L70 124 H46 Z" fill="#1b1948" stroke="#9be8b8" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- the house glitch: magenta and cyan copies slipped out of register behind the bot -->
  <use href="#bot" filter="url(#tint-magenta)" transform="translate(-3 0)" opacity="0.7"/>
  <use href="#bot" filter="url(#tint-cyan)" transform="translate(3 0)" opacity="0.7"/>
  <use href="#bot"/>

  <!-- sparks flying out from both sides of the strike -->
  <g stroke-width="2.2" stroke-linecap="square">
    <line x1="72" y1="98" x2="60" y2="90" stroke="#f4c95d"/>
    <line x1="73" y1="95" x2="66" y2="83" stroke="#ff2e88"/>
    <line x1="70" y1="100" x2="55" y2="99" stroke="#22d8ff"/>
    <line x1="100" y1="98" x2="112" y2="90" stroke="#f4c95d"/>
    <line x1="99" y1="95" x2="106" y2="83" stroke="#22d8ff"/>
    <line x1="102" y1="100" x2="117" y2="99" stroke="#ff2e88"/>
    <rect x="57" y="83" width="3" height="3" fill="#f4c95d"/>
    <rect x="109" y="80" width="3" height="3" fill="#9be8b8"/>
    <rect x="63" y="78" width="2.5" height="2.5" fill="#ff2e88"/>
    <rect x="113" y="86" width="2.5" height="2.5" fill="#f4c95d"/>
  </g>
</svg>
