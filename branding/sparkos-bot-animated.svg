<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="SparkOS: a small robot hammering an anvil, throwing sparks">
  <!-- SparkOS mark, animated. Original artwork for SparkOS. Colours: wolklaw house tokens.
       Timed to the startup sound (tools/make-startup-sound.py, variant "cave"), which starts
       0.4 s into this animation: blows land at 0.4, 1.55, 2.7 s, each with a rebound tap,
       and the heavy final blow at 4.0 s. Plays once, then rests with the hammer down. -->
  <style>
    .arm   { transform-box: view-box; transform-origin: 100px 67px; animation: swing 6.8s linear 1 forwards; }
    .burst { transform-box: view-box; transform-origin: 72px 100px; opacity: 0; }
    .b1 { animation: spark1 6.8s linear 1 forwards; }
    .b2 { animation: spark2 6.8s linear 1 forwards; }
    .b3 { animation: spark3 6.8s linear 1 forwards; }
    .b4 { animation: spark4 6.8s linear 1 forwards; }
    .slip { opacity: 0; animation: slip 6.8s linear 1 forwards; }
    .glow { animation: glow 6.8s linear 1 forwards; }

    @keyframes swing {
      0%     { transform: rotate(105deg); animation-timing-function: cubic-bezier(.6,0,1,1); }
      5.88%  { transform: rotate(0deg);   animation-timing-function: ease-out; }
      6.6%   { transform: rotate(12deg);  animation-timing-function: ease-in; }
      7.35%  { transform: rotate(0deg);   animation-timing-function: ease-in-out; }
      14.5%  { transform: rotate(105deg); animation-timing-function: cubic-bezier(.6,0,1,1); }
      22.79% { transform: rotate(0deg);   animation-timing-function: ease-out; }
      23.5%  { transform: rotate(12deg);  animation-timing-function: ease-in; }
      24.26% { transform: rotate(0deg);   animation-timing-function: ease-in-out; }
      31.5%  { transform: rotate(105deg); animation-timing-function: cubic-bezier(.6,0,1,1); }
      39.71% { transform: rotate(0deg);   animation-timing-function: ease-out; }
      40.4%  { transform: rotate(12deg);  animation-timing-function: ease-in; }
      41.18% { transform: rotate(0deg);   animation-timing-function: ease-in-out; }
      50%    { transform: rotate(125deg); animation-timing-function: cubic-bezier(.7,0,1,1); }
      58.82%, 100% { transform: rotate(0deg); }
    }
    @keyframes spark1 { 0%, 5.8% { opacity: 0; transform: scale(.4); } 5.88% { opacity: 1; transform: scale(.6); } 10% { opacity: 0; transform: scale(1.3); } 100% { opacity: 0; } }
    @keyframes spark2 { 0%, 22.7% { opacity: 0; transform: scale(.4); } 22.79% { opacity: 1; transform: scale(.6); } 27% { opacity: 0; transform: scale(1.3); } 100% { opacity: 0; } }
    @keyframes spark3 { 0%, 39.6% { opacity: 0; transform: scale(.4); } 39.71% { opacity: 1; transform: scale(.6); } 44% { opacity: 0; transform: scale(1.3); } 100% { opacity: 0; } }
    @keyframes spark4 { 0%, 58.7% { opacity: 0; transform: scale(.5); } 58.82% { opacity: 1; transform: scale(.8); } 68% { opacity: 0; transform: scale(1.7); } 100% { opacity: 0; } }
    /* the house glitch: on the final blow the image slips out of register, then settles */
    @keyframes slip {
      0%, 58.7% { opacity: 0; }
      58.82% { opacity: .85; }
      60.5%  { opacity: .6; }
      62%    { opacity: .85; }
      66%, 100% { opacity: 0; }
    }
    /* the work piece glows brighter at each blow and cools a little after the last */
    @keyframes glow {
      0% { fill: #f0a671; } 5.88% { fill: #ffe9a8; } 12% { fill: #f4c95d; }
      22.79% { fill: #ffe9a8; } 29% { fill: #f4c95d; } 39.71% { fill: #ffe9a8; } 46% { fill: #f4c95d; }
      58.82% { fill: #fff4cc; } 80%, 100% { fill: #f0a671; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arm, .burst, .slip, .glow { animation: none; }
      .arm { transform: rotate(0deg); }
    }
  </style>
  <defs>
    <filter id="tint-magenta" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#ff2e88"/><feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="tint-cyan" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#22d8ff"/><feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <g id="bot">
      <line x1="116" y1="26" x2="116" y2="16" stroke="#9be8b8" stroke-width="2.5"/>
      <rect x="113" y="10" width="6" height="6" fill="#f4c95d"/>
      <rect x="96" y="26" width="40" height="30" rx="3" fill="#141233" stroke="#9be8b8" stroke-width="2.5"/>
      <rect x="101" y="35" width="30" height="11" rx="2" fill="#9be8b8"/>
      <rect x="108" y="38.5" width="5" height="4" fill="#0a0919"/>
      <rect x="120" y="38.5" width="5" height="4" fill="#0a0919"/>
      <rect x="110" y="56" width="12" height="5" fill="#1b1948" stroke="#9be8b8" stroke-width="2"/>
      <rect x="100" y="61" width="32" height="44" rx="3" fill="#141233" stroke="#9be8b8" stroke-width="2.5"/>
      <path d="M121 70 H112 L109 76 L121 80 L118 87 H109" fill="none" stroke="#9be8b8" stroke-width="2"/>
      <g class="arm">
        <line x1="100" y1="67" x2="91" y2="84" stroke="#9be8b8" stroke-width="6" stroke-linecap="square"/>
        <!-- handle out from the hand, head across its end: the bottom face strikes -->
        <line x1="91" y1="85" x2="78" y2="90" stroke="#b3b0d2" stroke-width="3.5"/>
        <rect x="66" y="82" width="12" height="18" rx="1.5" fill="#f1efff" stroke="#9be8b8" stroke-width="1.5"/>
      </g>
      <rect class="glow" x="52" y="101" width="40" height="5" fill="#f4c95d"/>
      <path d="M22 112 L40 106 H128 V120 L110 124 L104 136 L122 148 V152 H58 V148 L76 136 L70 124 H46 Z" fill="#1b1948" stroke="#9be8b8" stroke-width="2.5"/>
    </g>
    <g id="sparks" stroke-width="2.2" stroke-linecap="square">
      <g transform="translate(-8 0)">
        <line x1="72" y1="98" x2="60" y2="90" stroke="#f4c95d"/>
        <line x1="73" y1="95" x2="66" y2="83" stroke="#ff2e88"/>
        <line x1="70" y1="100" x2="55" y2="99" stroke="#22d8ff"/>
        <rect x="57" y="83" width="3" height="3" fill="#f4c95d"/>
        <rect x="63" y="78" width="2.5" height="2.5" fill="#ff2e88"/>
      </g>
      <g transform="translate(-20 0)">
        <line x1="100" y1="98" x2="112" y2="90" stroke="#f4c95d"/>
        <line x1="99" y1="95" x2="106" y2="83" stroke="#22d8ff"/>
        <line x1="102" y1="100" x2="117" y2="99" stroke="#ff2e88"/>
        <rect x="109" y="80" width="3" height="3" fill="#9be8b8"/>
        <rect x="113" y="86" width="2.5" height="2.5" fill="#f4c95d"/>
      </g>
    </g>
  </defs>

  <g class="slip">
    <use href="#bot" filter="url(#tint-magenta)" transform="translate(-4 0)"/>
    <use href="#bot" filter="url(#tint-cyan)" transform="translate(4 0)"/>
  </g>
  <use href="#bot"/>
  <g class="burst b1"><use href="#sparks"/></g>
  <g class="burst b2"><use href="#sparks"/></g>
  <g class="burst b3"><use href="#sparks"/></g>
  <g class="burst b4"><use href="#sparks"/></g>
</svg>
