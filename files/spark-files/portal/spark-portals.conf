# Portals for a desktop named Spark (XDG_CURRENT_DESKTOP=Spark). The Spark session itself is
# sparkwl:Spark and reads sparkwl-portals.conf first (files/system); this file is the fallback,
# and what tests/portal_check.py uses. Spark Files answers the file chooser and "Open with";
# the rest is the GTK portal's.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=spark;gtk;
org.freedesktop.impl.portal.AppChooser=spark;gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring
