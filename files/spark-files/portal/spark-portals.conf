# Portals for the Spark session (XDG_CURRENT_DESKTOP=Spark:KDE; this file is read before
# kde-portals.conf). Spark Files answers the file chooser and "Open with"; KDE's backend
# stays for everything that needs KWin or Plasma's services (screenshots, screen sharing,
# remote desktop, global shortcuts, settings). If Spark Files can't answer, KDE's does.
# Plasma reads kde-portals.conf only, so it keeps KDE's dialogs.
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=spark;kde;
org.freedesktop.impl.portal.AppChooser=spark;kde;
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify
