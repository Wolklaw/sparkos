# Greenboot configuration (SparkOS, the same settings as Bazzite)
#
# After an update, greenboot checks that the new system booted well. If the required checks fail
# GREENBOOT_MAX_BOOT_ATTEMPTS times in a row, the PC goes back to the previous system by itself.

## Generic
GREENBOOT_MAX_BOOT_ATTEMPTS=3

### Checks to skip (script names, spelled exactly):
### - 01_repository_dns_check.sh looks up the package repositories' hosts: SparkOS updates come
###   from the image registry, and a PC that boots offline would count as a failed boot
### - 01_update_platforms_check.sh checks the update servers can be reached, for the same reason
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "01_update_platforms_check.sh")

### The watchdog check: a boot after an update fails if the hardware watchdog reset the PC
GREENBOOT_WATCHDOG_GRACE_PERIOD=1
GREENBOOT_WATCHDOG_CHECK_ENABLED=true
