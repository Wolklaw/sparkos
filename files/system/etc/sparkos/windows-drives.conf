# The Windows drives SparkOS mounts at every boot, at /var/mnt/<letter> (also reachable as /mnt/<letter>).
# One line per drive letter: rw (read-write), ro (read-only) or off. * is every drive not listed.
# Read-write needs Windows to shut down fully: keep Fast Startup off in Windows (it is off on this PC).
# Changes apply at the next boot, or now with: sudo systemctl restart sparkos-windows-drives
#
# user=NAME   who owns the files (default: the first user account on this PC)

# D: ("Scrap": downloads and temp files) is never written to from SparkOS
D ro
* rw
