# SparkOS: Plasma Login Manager settings. The sign-in screen takes its colours and fonts from
# the system defaults (/etc/xdg/kdeglobals); Plasma Login Manager has no themes by design.
# The wallpaper must be set in this file: settings in plasmalogin.conf.d are ignored for it.
# All other options are upstream's defaults (see the commented file upstream ships).

[Greeter]
WallpaperPluginId=org.kde.image
# Start on the Spark session (spark-wl). Plasma is still listed in the session menu as the
# fallback. The greeter checks this before the user's last session, so picking Plasma works
# for that sign-in only and the next sign-in starts on Spark again.
PreselectedSession=spark-wl.desktop

[Greeter][Wallpaper][org.kde.image][General]
Image=/usr/share/wallpapers/SparkOS/contents/images/3840x2160.png
