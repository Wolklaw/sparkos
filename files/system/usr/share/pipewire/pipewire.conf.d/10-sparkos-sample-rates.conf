# SparkOS: let PipeWire switch the sound card's sample rate to match what is playing.
#
# PipeWire's own default is a fixed 48000 Hz, so a 96 kHz track on a USB DAC is resampled. With
# these rates allowed, a native Linux player gets the track's own rate when nothing else is
# playing; when several programs play at once, PipeWire keeps one rate for all of them.
#
# Windows programs under Wine (Spark Run) don't ask for a rate: they read the device's current
# one, which is 48000 Hz unless something else set it. For Amazon Music Ultra HD above 48 kHz,
# set a higher fixed rate in your own file, for example
# ~/.config/pipewire/pipewire.conf.d/50-sample-rates.conf:
#
#   context.properties = {
#       default.clock.rate          = 96000
#       default.clock.allowed-rates = [ 96000 ]
#   }
#
# then run `spark audio-restart`. This file is read first (10-), so a file of yours wins.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
