# Portals for the Spark compositor session (XDG_CURRENT_DESKTOP=sparkwl).
# Open and Save dialogs and "Open with" are Spark Files' (spark.portal). Screen capture and screenshots go through xdg-desktop-portal-wlr
# (wlr-screencopy for screens, ext-image-copy-capture for windows); its chooser is
# /usr/libexec/spark-screen-pick (screens and windows).
# Secrets are GNOME Keyring's, which the sign-in password unlocks. The rest falls back to the GTK portal.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=spark;gtk;
org.freedesktop.impl.portal.AppChooser=spark;gtk;
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
