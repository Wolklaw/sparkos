# Portals for the Spark compositor session (XDG_CURRENT_DESKTOP=sparkwl).
# Open and Save dialogs and "Open with" are Spark Files' (spark.portal). Screen capture and
# screenshots go through xdg-desktop-portal-wlr (wlr-screencopy for screens, ext-image-copy-capture
# for windows); its chooser is /usr/libexec/spark-screen-pick (screens and windows).
# Secrets are Spark Secrets' (sparksecrets), which the sign-in password unlocks.
# Everything else (settings, inhibit, notifications, access, account, email, launchers, lockdown,
# print) is the Spark portal backend, sparkos.portal in files/spark-session. There is no GTK portal.
[preferred]
default=sparkos
org.freedesktop.impl.portal.FileChooser=spark
org.freedesktop.impl.portal.AppChooser=spark
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=sparksecrets
