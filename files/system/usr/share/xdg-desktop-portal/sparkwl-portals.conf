# Portals for the experimental Spark compositor session (XDG_CURRENT_DESKTOP=sparkwl).
# Open and Save dialogs and "Open with" are Spark Files' (spark.portal, the same backend as the
# KWin Spark session). Screen capture and screenshots go through xdg-desktop-portal-wlr
# (wlr-screencopy). Secrets stay in the wallet the login already unlocks (ksecretd). The rest falls
# back to the GTK portal, so no KDE portal is needed.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=spark;gtk;
org.freedesktop.impl.portal.AppChooser=spark;gtk;
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=kwallet
