# Applies only when greetd is the display manager (`spark greeter enable`). If greetd cannot
# stay up (the greeter crashes four times in a minute), systemd runs the fallback, which puts
# Plasma Login Manager back so the next start of the PC still reaches a sign-in screen.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=4
OnFailure=spark-greeter-fallback.service
