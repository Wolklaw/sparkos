[Unit]
StartLimitIntervalSec=60
StartLimitBurst=4
OnFailure=spark-greeter-fallback.service

[Service]
# The image's greetd account has no /etc/shadow line, which makes PAM refuse to
# start its user manager (user@<uid>.service, status=224/PAM). Add a locked one.
ExecStartPre=-/usr/libexec/spark-shadow-entry greetd
