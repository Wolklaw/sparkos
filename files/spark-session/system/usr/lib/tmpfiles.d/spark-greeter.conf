#Type Path                    Mode User   Group  Age Argument
# The greeter remembers the last user and session here. Owned by the greetd account, which
# exists once greetd is installed (its sysusers.d file makes it).
d      /var/cache/spark-greeter 0750 greetd greetd -   -
# The greetd account's home. Without it Mesa turns its shader cache off for the sign-in screen
# ("Failed to create /var/lib/greetd for shader cache"), so every boot compiles the greeter's
# shaders again, and WirePlumber can't keep its state.
d      /var/lib/greetd          0750 greetd greetd -   -
