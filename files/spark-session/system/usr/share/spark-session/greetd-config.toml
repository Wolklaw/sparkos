# greetd's settings for the Spark sign-in screen. The image installs this as
# /etc/greetd/config.toml; `spark greeter disable` swaps in greetd-text.toml (text sign-in) and
# `spark greeter enable` puts this one back.

[terminal]
# The greeter is a graphical program, so greetd takes the first free VT for it.
vt = "next"

[default_session]
command = "/usr/libexec/spark-greeter-session"
user = "greetd"
